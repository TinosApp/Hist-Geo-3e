<style>
:root{
  --bg:#f5f7f5; --card:#ffffff; --ink:#15231c; --mute:#5b6b62; --line:#d9e1dc;
  --green:#0d4a33; --green2:#16714e; --gold:#e3a812; --red:#b3262d; --ok:#17794f; --okbg:#e3f4ea; --badbg:#fbe6e6;
  --soft:#eaf1ed;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1713;--card:#17231d;--ink:#e8f0ec;--mute:#9db0a6;--line:#2a3b33;--soft:#1d2d25;--okbg:#14352a;--badbg:#3a1b1d;--green:#0b3a28;}
}
:root[data-theme="dark"]{--bg:#0f1713;--card:#17231d;--ink:#e8f0ec;--mute:#9db0a6;--line:#2a3b33;--soft:#1d2d25;--okbg:#14352a;--badbg:#3a1b1d;--green:#0b3a28;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
h1,h2,h3,button,.ui{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.flag{height:5px;background:linear-gradient(90deg,#008751 0 34%,#fcd116 34% 67%,#e8112d 67%)}
header.top{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header.top .t{flex:1;min-width:0}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header.top p{margin:0;font-size:12px;opacity:.8}
header.top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:12px}
main{padding:14px 14px 96px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:11px 2px;font-size:12px;font-weight:600;border-top:3px solid transparent}
nav.tabs button.on{color:var(--green2);border-top-color:var(--gold)}
@media (prefers-color-scheme:dark){nav.tabs button.on{color:#6fd1a4}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16px}
.row{display:flex;gap:10px;align-items:flex-start}
.badge{display:inline-block;font-family:system-ui,sans-serif;font-size:12px;font-weight:700;background:var(--soft);color:var(--green2);border-radius:6px;padding:2px 8px}
.sa-btn{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px;color:var(--ink);display:block}
.sa-btn b{display:block;font-size:16px;font-family:system-ui,sans-serif;margin-bottom:3px}
.sa-btn span{font-size:14px;color:var(--mute)}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;align-items:center;justify-content:center;font-weight:700;font-family:system-ui,sans-serif;font-size:14px;flex:none}
.back{background:none;border:0;color:var(--green2);font-weight:700;padding:6px 0;font-size:14px;margin-bottom:6px}
h2.sa-title{font-size:19px;line-height:1.3;margin:4px 0 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
summary{padding:13px 14px;font-weight:700;font-family:system-ui,sans-serif;font-size:15px;cursor:pointer}
details .in{padding:0 14px 12px}
details h4{margin:12px 0 4px;font-family:system-ui,sans-serif;font-size:14px;color:var(--green2)}
@media (prefers-color-scheme:dark){details h4{color:#6fd1a4}}
ul.pts{margin:4px 0 0;padding-left:20px}
ul.pts li{margin:0 0 7px;font-size:15.5px}
.box{border-left:4px solid var(--gold);background:var(--soft);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:15px}
.btn{font-family:system-ui,sans-serif;background:var(--green2);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;width:100%}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.opt{display:block;width:100%;text-align:left;font-family:system-ui,sans-serif;font-size:15px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin:0 0 8px}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--red);background:var(--badbg)}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--gold)}
.fc{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;padding:18px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px}
.fc.ans{background:var(--okbg);border-color:var(--ok)}
.ep-q{margin:0 0 12px;font-size:15.5px}
.ep-r{background:var(--okbg);border-left:4px solid var(--ok);padding:10px 12px;border-radius:0 8px 8px 0;margin:6px 0 14px;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
table.t td:first-child{font-family:system-ui,sans-serif;font-weight:700;width:34%;color:var(--green2)}
.seg{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.seg button{font-family:system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600}
.seg button.on{background:var(--green2);color:#fff;border-color:var(--green2)}
input.code{width:100%;font-size:20px;letter-spacing:2px;text-align:center;padding:13px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-transform:uppercase;font-family:ui-monospace,monospace}
.msg{font-family:system-ui,sans-serif;font-size:14px;margin:8px 0;color:var(--red);min-height:20px}
.gate{max-width:480px;margin:0 auto;padding:22px 16px}
.gate h2{font-size:24px;line-height:1.2;margin:14px 0 4px}
.price{font-family:system-ui,sans-serif;font-size:15px;background:var(--soft);border-radius:10px;padding:12px;margin:14px 0}
.hide{display:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.small{font-size:13px;color:var(--mute);font-family:system-ui,sans-serif}

.bepc{--geo:#1f5f8b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bepc{--geo:#7ec0ee}}
:root[data-theme="dark"] .bepc{--geo:#7ec0ee}
.bepc h2{font-size:18px;line-height:1.3;margin:26px 0 6px;padding-top:6px;border-top:3px solid var(--line);color:var(--green2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bepc h2{color:#6fd1a4}}
.bepc h3{font-size:16px;margin:18px 0 6px;color:var(--green2)}
.bepc h4{font-size:15px;margin:12px 0 4px}
.bepc p{margin:6px 0 8px;font-size:15.5px}
.bepc ul,.bepc ol{margin:6px 0 10px;padding-left:22px}
.bepc li{margin:3px 0;font-size:15.5px}
.bepc .sub{color:var(--mute);font-family:system-ui,sans-serif;font-size:14px;margin:0 0 12px}
.bepc .badge.g{background:var(--geo);color:#fff}
.bepc .box{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:15px}
.bepc .box.rule{border-left-color:var(--gold)}
.bepc .box.up{border-left-color:var(--geo)}
.bepc .box .t{font-family:system-ui,sans-serif;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.bepc .scroll{overflow-x:auto;margin:10px 0}
.bepc table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px;background:var(--card)}
.bepc th,.bepc td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left}
.bepc th{background:var(--soft);font-family:system-ui,sans-serif;font-size:13px}
.bepc .sujet{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0}
.bepc .lbl{font-family:system-ui,sans-serif;font-weight:700;font-size:12.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.bepc .texte{border-left:3px solid var(--line);padding-left:12px;font-style:italic;margin:8px 0}
.bepc .src,.bepc .tag{font-size:13.5px;color:var(--mute)}
.bepc details{background:none;border:0;border-radius:0;margin:10px 0;overflow:visible}
.bepc summary{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px}
.bepc .copie{border:1px solid var(--line);border-radius:0 0 8px 8px;padding:10px 14px;background:var(--card);margin-top:-1px}
.bepc .copie .lab{font-family:system-ui,sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin:10px 0 2px}
.bepc .pos{color:var(--ok);font-weight:700}.bepc .neg{color:var(--red);font-weight:700}
.bepc .warn{background:var(--soft);border:1px dashed var(--mute);border-radius:8px;padding:10px 14px;margin:14px 0;font-size:14.5px}
.bepc footer{margin-top:30px;color:var(--mute);font-family:system-ui,sans-serif;font-size:13px;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:0;background:var(--bg);z-index:3}
.chips button{flex:0 0 auto;font-family:system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.price .alt2{display:block;margin-top:8px}
</style>
</head>

<script>
const SA = [
{
id:1, court:`Mouvement ouvrier`, titre:`Comment expliquer les origines et l'évolution du mouvement ouvrier en Europe aux XIXe et XXe siècles ?`, duree:`16 h`, dom:`Histoire`,
intro:`La succession des progrès scientifiques et techniques aux XIXe et XXe siècles a transformé l'agriculture et l'industrie européennes. Ces mutations ont fait naître deux classes sociales aux intérêts opposés : la bourgeoisie et le prolétariat. Comment le mouvement ouvrier est-il né, comment a-t-il évolué et qu'a-t-il obtenu ?`,
parts:[
 {t:`I. Les origines du mouvement ouvrier`, blocks:[
  {h:`1.1 Quelques progrès scientifiques et technologiques`, pts:[
   `En sciences : travaux de Pierre et Marie Curie et d'Albert Einstein sur la nature de la lumière, la composition de la matière, la radioactivité et les sources d'énergie.`,
   `Dans l'énergie : houille blanche (énergie hydraulique), pétrole, électricité. Repères : dynamo de Gramme (1871), houille blanche de Bergès (1869-1873), lampe à filament d'Edison (1879), transport de l'énergie électrique par Desprez (1882), transformateur de Gaulard (1884), alternateur de Tesla (1888).`,
   `En sidérurgie et métallurgie : acier, fonte à partir de minerais phosphoreux (Thomas-Gilchrist, 1878), électrométallurgie (Héroult, 1884).`,
   `En chimie : textiles artificiels, colorants synthétiques, explosifs.`,
   `Dans les transports et les machines : moteur à explosion et moteur à huile lourde.`]},
  {h:`1.2 Impact de ces progrès sur l'agriculture et l'industrie`, pts:[
   `Agriculture : machines performantes (tracteurs, faucheuses, semoirs, moissonneuses-lieuses, batteuses à vapeur). Elle devient mécanisée, scientifique, intensive, commerciale et très productive.`,
   `Industrie : passage des métiers à main aux métiers mécaniques ; industries plus variées et plus spécialisées ; création de régions industrielles et de grandes entreprises employant des milliers d'ouvriers.`,
   `De nombreux paysans ruinés par la mécanisation deviennent ouvriers d'usine.`,
   `Nouvelles méthodes de travail : standardisation, taylorisation, machinisme, automatisation, concentration des entreprises.`]}
 ]},
 {t:`II. Le mouvement ouvrier en Europe`, blocks:[
  {h:`2.1 Naissance de deux classes sociales antagonistes`, pts:[
   `La bourgeoisie (propriétaires d'usines, banquiers, commerçants) domine l'économie et vit dans l'aisance.`,
   `Le prolétariat (ouvriers) vit et travaille dans des conditions très dures.`,
   `Conditions de travail : journées très longues, ateliers mal aérés et mal éclairés, ni congés payés ni retraite, ni sécurité sociale, grèves et associations interdites, licenciements abusifs, travail des femmes et des enfants non réglementé, accidents fréquents.`,
   `Conditions de vie : logements chers et insalubres, tuberculose et rachitisme, malnutrition, salaires insuffisants (parfois payés en nature : « truck system »), chômage, livret ouvrier obligatoire, aucun droit civil, économique ou politique.`,
   `Les ouvriers prennent conscience de leur misère : le mouvement ouvrier naît.`]},
  {h:`2.2 Évolution du mouvement ouvrier`, pts:[
   `Agitation croissante des masses laborieuses entre 1880 et 1913, surtout en Angleterre, en Allemagne et en France.`,
   `Création de syndicats et forte hausse du nombre d'adhérents (Trade Unions britanniques, American Federation of Labour, Confédération générale du travail en France).`,
   `Naissance de partis politiques qui soutiennent les luttes ouvrières : le socialisme et ses variantes.`,
   `Moyens de lutte : syndicats, grèves, manifestations, partis politiques.`,
   `Deux tendances : le syndicalisme réformiste (négocier pour obtenir des réformes) et le syndicalisme révolutionnaire (renverser le système capitaliste).`]}
 ]},
 {t:`III. Les acquis du mouvement ouvrier`, blocks:[
  {h:`3.1 Amélioration des conditions de travail`, pts:[
   `Réduction des heures de travail, hausse des salaires, droit aux congés payés.`,
   `Meilleures conditions dans les ateliers ; réglementation du travail des femmes et des enfants.`,
   `Participation des ouvriers à la vie de l'entreprise par les conventions collectives ; reconnaissance du droit de grève.`]},
  {h:`3.2 Amélioration des conditions de vie`, pts:[
   `Allocations familiales ; école obligatoire pour les enfants jusqu'à 12 ans au plus.`,
   `Suffrage universel et libertés fondamentales ; députés représentant les travailleurs au parlement.`,
   `Caisses de sécurité sociale ; au Royaume-Uni, lois de 1906 à 1914 créant des assurances chômage, maladie, vieillesse, invalidité.`,
   `Possibilité pour les travailleurs d'accéder aux classes moyennes.`]},
  {h:`3.3 Portée internationale du mouvement ouvrier`, pts:[
   `Les travailleurs du monde entier peuvent créer des syndicats et adhérer au parti de leur choix.`,
   `Les moyens de lutte s'appuient désormais sur des textes et des lois.`,
   `Les syndicats cherchent à protéger les emplois menacés par l'automatisation et la délocalisation.`,
   `Tendance croissante au réformisme et à la négociation : le dialogue social devient une nécessité, y compris dans un pays comme le Bénin.`]}
 ]}
],
concl:`Né des transformations économiques de la révolution industrielle, le mouvement ouvrier a profondément amélioré la condition des travailleurs. Il a fait du dialogue social un moyen privilégié de régler les conflits du travail.`,
fc:[
 [`Que désigne la houille blanche ?`,`L'énergie hydraulique (force de l'eau).`],
 [`Quelles sont les deux classes antagonistes nées de la révolution industrielle ?`,`La bourgeoisie et le prolétariat.`],
 [`Qu'est-ce que le « truck system » ?`,`Le paiement du salaire en nature (marchandises) au lieu de l'argent.`],
 [`Quelle période connaît une agitation ouvrière croissante ?`,`De 1880 à 1913, surtout en Angleterre, en Allemagne et en France.`],
 [`Citez trois acquis du mouvement ouvrier.`,`Réduction du temps de travail, congés payés, sécurité sociale (aussi : hausse des salaires, allocations familiales, suffrage universel).`],
 [`Différence entre syndicalisme réformiste et révolutionnaire ?`,`Le premier négocie des réformes ; le second veut renverser le système capitaliste.`],
 [`Quel texte de 1848 appelle les prolétaires à s'unir ?`,`Le Manifeste du Parti communiste de Marx et Engels.`],
 [`Quelle durée du travail avant et après les luttes ?`,`14 à 16 heures par jour avant ; 8 à 10 heures selon les pays après.`],
 [`Citez deux exemples de syndicalisme.`,`Révolutionnaire : la CGT en France. Réformiste : les Trade Unions en Angleterre, l'AFL aux États-Unis.`],
 [`Qui a inventé la lampe à filament et quand ?`,`Edison, en 1879.`]
],
quiz:[
 {q:`La houille blanche désigne :`,o:[`Le charbon de bois`,`L'énergie hydraulique`,`Le pétrole raffiné`,`Le gaz naturel`],a:1,e:`La houille blanche, mise au point par Bergès (1869-1873), est l'énergie produite par la force de l'eau.`},
 {q:`Qui a mis au point l'alternateur en 1888 ?`,o:[`Edison`,`Gramme`,`Tesla`,`Bergès`],a:2,e:`Tesla (États-Unis) a mis au point l'alternateur en 1888. Edison a inventé la lampe à filament (1879).`},
 {q:`Quelles sont les deux classes sociales antagonistes nées de la révolution industrielle ?`,o:[`Noblesse et clergé`,`Bourgeoisie et prolétariat`,`Paysans et artisans`,`Marchands et militaires`],a:1,e:`La bourgeoisie détient les moyens de production ; le prolétariat vend sa force de travail.`},
 {q:`Le « truck system » consiste à :`,o:[`Payer les ouvriers en nature`,`Transporter les ouvriers par camion`,`Interdire les grèves`,`Réduire les heures de travail`],a:0,e:`Le salaire était parfois versé en marchandises, ce qui aggravait la misère ouvrière.`},
 {q:`Entre quelles dates l'agitation ouvrière s'accroît-elle fortement ?`,o:[`1780-1800`,`1840-1850`,`1880-1913`,`1920-1939`],a:2,e:`Entre 1880 et 1913, grèves et syndicats se multiplient en Angleterre, Allemagne et France.`},
 {q:`Lequel de ces éléments est un acquis des conditions de travail ?`,o:[`Livret ouvrier obligatoire`,`Interdiction des syndicats`,`Réduction des heures de travail`,`Travail des enfants généralisé`],a:2,e:`La réduction du temps de travail, la hausse des salaires et les congés payés figurent parmi les acquis.`},
 {q:`Quel est le rôle d'un syndicat ?`,o:[`Diriger l'usine`,`Défendre les intérêts des travailleurs`,`Fixer les prix des produits`,`Recruter des soldats`],a:1,e:`Le syndicat est une association de travailleurs qui défend leurs droits et leurs revendications.`},
 {q:`La taylorisation est :`,o:[`Une loi sociale`,`Une organisation du travail qui découpe et standardise les tâches`,`Un parti socialiste`,`Une machine agricole`],a:1,e:`Elle fait partie des nouvelles méthodes de travail avec la standardisation et le machinisme.`},
  {q:`Quel texte de 1848, signé Marx et Engels, appelle les prolétaires à s'unir ?`,o:[`Le Capital`,`Le Manifeste du Parti communiste`,`La Déclaration des droits de l'homme`,`Le Code civil`],a:1,e:`Le Manifeste du Parti communiste (1848) s'achève sur l'appel « Prolétaires de tous les pays, unissez-vous ! ».`},
  {q:`Quelle était la durée de la journée de travail d'un ouvrier avant les grandes luttes ?`,o:[`4 à 6 heures`,`8 heures`,`14 à 16 heures`,`24 heures`],a:2,e:`Les ouvriers travaillaient 14 à 16 heures par jour ; les luttes l'ont ramenée à 8 à 10 heures selon les pays.`},
  {q:`Le 1er mai est devenu :`,o:[`La fête de l'indépendance`,`La fête des travailleurs`,`Le jour de la rentrée`,`Un jour de deuil`],a:1,e:`La fête du 1er mai compte parmi les acquis des luttes ouvrières.`},
  {q:`Quel pays est associé aux Trade Unions et au Labour Party ?`,o:[`La France`,`L'Angleterre`,`L'Italie`,`L'Espagne`],a:1,e:`En Angleterre, les Trade Unions ont donné naissance au Labour Party : c'est un syndicalisme réformiste.`},
  {q:`Le syndicalisme révolutionnaire cherche à :`,o:[`Améliorer les conditions par la seule négociation`,`Changer radicalement la société, parfois par la violence`,`Supprimer les syndicats`,`Aider les patrons`],a:1,e:`Il emploie grèves violentes, boycotts et sabotages ; la CGT, en France, en est un exemple.`},
  {q:`Une convention collective est :`,o:[`Un accord négocié fixant les conditions de travail`,`Une loi votée par le roi`,`Une punition pour les grévistes`,`Un impôt sur les salaires`],a:0,e:`Elle est négociée entre représentants des ouvriers et patrons.`},
  {q:`Qui a mis au point la lampe à filament en 1879 ?`,o:[`Tesla`,`Gramme`,`Edison`,`Curie`],a:2,e:`Edison a mis au point la lampe à filament en 1879 ; Tesla a conçu l'alternateur en 1888.`}
],
ep:[
 {t:`Sujet 1 – Du progrès technique aux acquis ouvriers`, items:[
  {q:`Item 1 (4 pts). Définis : a) prolétariat ; b) syndicat ; c) grève ; d) convention collective.`, r:`a) Classe des ouvriers qui vivent de leur salaire (1 pt). b) Association de travailleurs qui défend leurs intérêts (1 pt). c) Arrêt collectif du travail pour appuyer des revendications (1 pt). d) Accord négocié entre syndicats et employeurs fixant les conditions de travail (1 pt).`},
  {q:`Item 2 (6 pts). a) Cite trois progrès techniques de la fin du XIXe siècle (1,5 pt). b) Explique l'impact de la mécanisation sur l'agriculture (2 pts). c) Décris deux conditions de travail des ouvriers (2,5 pts).`, r:`a) Dynamo (Gramme, 1871), lampe à filament (Edison, 1879), alternateur (Tesla, 1888)… (3 × 0,5 pt). b) Les machines (tracteurs, moissonneuses-lieuses…) rendent l'agriculture intensive, commerciale et très productive, mais ruinent de nombreux paysans qui partent travailler en usine (2 pts). c) Journées très longues ; ateliers mal aérés ; absence de congés et de retraite ; travail des enfants… (2 × 1,25 pt).`},
  {q:`Item 3 (6 pts). Cite trois acquis du mouvement ouvrier sur les conditions de travail (3 pts) et deux sur les conditions de vie (3 pts).`, r:`Travail : réduction des heures, hausse des salaires, congés payés, réglementation du travail des femmes et des enfants (3 × 1 pt). Vie : allocations familiales, sécurité sociale, suffrage universel, école obligatoire (2 × 1,5 pt).`},
  {q:`Item 4 (4 pts). Dans ton collège, des élèves veulent détruire du matériel pour protester contre une décision de l'administration. Rédige 8 lignes pour les convaincre de choisir le dialogue.`, r:`Barème : respect de la consigne (1 pt), arguments pertinents (2 pts), correction de la langue (1 pt). Idées : le mouvement ouvrier a obtenu ses droits par la négociation et des moyens organisés ; la violence détruit ce que l'on veut améliorer ; le dialogue social protège les droits de chacun.`}
 ]},
 {t:`Sujet 2 – Vrai ou faux et étude de texte`, items:[
  {q:`Item 1 (4 pts). Réponds par Vrai ou Faux : a) La houille blanche désigne l'énergie hydraulique. b) La bourgeoisie est la classe des ouvriers d'usine. c) Le « truck system » est un paiement en nature. d) Le mouvement ouvrier n'a obtenu aucun droit avant 1914.`, r:`a) Vrai. b) Faux (c'est le prolétariat). c) Vrai. d) Faux (réduction des heures, lois sociales britanniques de 1906-1914…). 1 pt chacune.`},
  {q:`Item 2 (6 pts). Texte d'exercice : « Dans la filature, on travaille quatorze heures par jour, six jours sur sept. Les ateliers sont étroits et mal aérés. Des enfants de huit ans y côtoient les adultes. Le salaire, versé parfois en nature, suffit à peine à acheter du pain. L'ouvrier blessé est renvoyé sans indemnité. » a) Identifie la classe sociale concernée (1 pt). b) Relève trois conditions de travail (3 pts). c) Dis quelle réaction va naître de cette situation (2 pts).`, r:`a) Le prolétariat (1 pt). b) Journées de quatorze heures ; ateliers mal aérés ; travail des enfants ; salaire en nature ; licenciement sans indemnité (3 × 1 pt). c) Prise de conscience, création de syndicats, grèves, soutien de partis socialistes : naissance du mouvement ouvrier (2 pts).`},
  {q:`Item 3 (6 pts). Explique comment le mouvement ouvrier a évolué entre 1880 et 1913.`, r:`Agitation croissante en Angleterre, Allemagne, France (2 pts) ; multiplication des syndicats et hausse des effectifs (2 pts) ; naissance de partis socialistes qui soutiennent les luttes (2 pts).`},
  {q:`Item 4 (4 pts). Cite deux aspects de la portée internationale du mouvement ouvrier (2 pts) et explique pourquoi le dialogue social est important au Bénin (2 pts).`, r:`Droit de se syndiquer et d'adhérer au parti de son choix ; lutte appuyée sur des textes et des lois ; protection des emplois face à l'automatisation (2 pts). Dans un pays pauvre, négocier évite les conflits qui paralysent l'économie et protège à la fois travailleurs et employeurs (2 pts).`}
 ]}
]
},
{
id:2, court:`Ressources du Bénin`, titre:`Quelle est l'importance des ressources disponibles pour le développement du Bénin ?`, duree:`24 h`, dom:`Géographie`,
intro:`Le Bénin dispose de ressources variées : agricoles, forestières, fauniques, halieutiques, minières, énergétiques, touristiques et humaines. Mal gérées ou peu valorisées, elles ne suffisent pas à assurer le développement. Quelle est leur importance et comment mieux les valoriser ?`,
parts:[
 {t:`I. Définition et localisation des ressources`, blocks:[
  {h:`1.1 Définition`, pts:[
   `Une ressource disponible est un élément, un bien matériel ou une matière première dont l'exploitation par l'homme conditionne le développement économique d'un pays.`,
   `L'homme est lui-même une ressource : on parle de ressource humaine ou de capital humain.`,
   `Les ressources sont définies et entretenues par l'interaction entre climats, sols et végétation, équilibre aujourd'hui menacé par les activités humaines.`]}
 ]},
 {t:`II. Importance des ressources pour le développement`, blocks:[
  {h:`2.1 Ressources ligneuses, fauniques, agricoles, pastorales`, pts:[
   `Ligneuses : forêts galeries, forêts claires, savanes boisées. Menaces : monoculture extensive (notamment le coton), usage abusif des intrants, feux tardifs, fabrication de charbon de bois et de bois de chauffe, coupe sélective d'essences.`,
   `Fauniques : faune variée mais menacée de disparition (braconnage, destruction des habitats).`,
   `Agricoles : coton (huileries et industries textiles), palmier à huile, anacardier, ananas, manguier, oranger. L'agriculture emploie plus de la moitié de la population active. Menaces : mauvaise gestion, manque d'encadrement et de financement.`,
   `Pastorales : élevage de bovins, porcins, caprins et volaille en développement dans tous les départements.`]},
  {h:`2.2 Ressources halieutiques, minières, énergétiques`, pts:[
   `Halieutiques : lagunes, lacs, cours d'eau répartis en deux bassins (Sud et Nord) et environ 125 km de côte maritime. Menaces : surexploitation, comblement par l'érosion, pratiques de pêche nuisibles.`,
   `Minières : or, fer, phosphate, chrome, nickel, étain, calcaire, marbre, granite, kaolin, argile, silice… Exploitation surtout artisanale ; seul le ciment alimente des usines (Onigbolo).`,
   `Énergétiques : pétrole et gaz naturel dans le bassin sédimentaire côtier (secteur de Sèmè), tourbe, hydroélectricité, énergie solaire (Nord) et éolienne (côte).`,
   `Malgré ces ressources, le Bénin connaît un déficit énergétique parce qu'elles sont peu exploitées.`]},
  {h:`2.3 Ressources touristiques, humaines et culturelles`, pts:[
   `Touristiques et culturelles : palais et musées royaux, sites historiques (route de l'esclavage), sites naturels (chaîne de l'Atacora, Tanougou, Kota), festivals.`,
   `Humaines : population jeune, main-d'œuvre abondante, marché élargi par la proximité du Nigeria et l'appartenance à la CEDEAO.`,
   `Faiblesses : faible niveau d'instruction, chômage, formation peu adaptée aux besoins de l'emploi, mauvaise gouvernance.`]}
 ]},
 {t:`III. Impact du mode de gestion des ressources`, blocks:[
  {h:`3.1 Sur l'économie et la population`, pts:[
   `Faible industrialisation et tissu industriel désarticulé.`,
   `Dépendance de l'extérieur : énergie, produits manufacturés, produits alimentaires courants ; balance commerciale déficitaire.`,
   `Production agricole artisanale centrée sur le coton ; pauvreté de nombreux ménages.`,
   `Exode rural, urbanisation anarchique, habitat spontané, insalubrité et dégradation de l'environnement.`]}
 ]},
 {t:`IV. Défis et mesures`, blocks:[
  {h:`4.1 Défis à relever`, pts:[
   `Valoriser toutes les ressources, assurer l'indépendance énergétique, adapter la formation à l'emploi, réduire l'analphabétisme.`,
   `Promouvoir la bonne gouvernance et lutter contre la corruption ; promouvoir un développement endogène et intégré.`]},
  {h:`4.2 Mesures réalistes`, pts:[
   `Développer la recherche scientifique et technique ; rénover l'école au service du développement.`,
   `Diversifier la production agricole pour la sécurité alimentaire et faire de l'agriculture la base du développement, avec l'industrie comme moteur.`,
   `Mener une politique de population cohérente et une stratégie multisectorielle de réduction de la pauvreté intégrant environnement, population et développement.`]}
 ]}
],
concl:`Le Bénin possède des ressources diversifiées, mais leur mauvaise gestion freine son développement. Mieux les valoriser, former les hommes et gouverner avec rigueur sont les clés d'un développement durable.`,
fc:[
 [`Qu'est-ce qu'une ressource disponible ?`,`Un élément ou une matière première dont l'exploitation conditionne le développement économique d'un pays.`],
 [`Où a-t-on annoncé du pétrole et du gaz au Bénin ?`,`Dans le bassin sédimentaire côtier, secteur de Sèmè (Sud-Est).`],
 [`Quelle est la longueur de la côte béninoise ?`,`Environ 125 km.`],
 [`Citez deux menaces pesant sur les forêts.`,`Monoculture extensive du coton, charbon de bois et bois de chauffe, feux tardifs, coupe sélective.`],
 [`Quelle usine illustre l'exploitation minière industrielle ?`,`La cimenterie d'Onigbolo.`],
 [`Citez deux conséquences de la mauvaise gestion des ressources.`,`Dépendance extérieure, balance commerciale déficitaire, exode rural, pauvreté.`],
 [`Citez trois ressources minières du Bénin.`,`Or, phosphate, calcaire, marbre, granite…`],
 [`Quels sont les deux parcs nationaux ?`,`Le W et la Pendjari.`],
 [`Citez trois problèmes de l'élevage.`,`Épizooties, maladies parasitaires, insuffisance de soins vétérinaires, de points d'eau et de pâturage en saison sèche.`],
 [`Citez deux solutions pour les lacs menacés.`,`Dragage, sensibilisation des riverains, réglementation de la pêche, fermes piscicoles.`]
],
quiz:[
 {q:`Une ressource disponible est :`,o:[`Un bien dont l'exploitation conditionne le développement d'un pays`,`Un produit importé`,`Un impôt`,`Une aide étrangère`],a:0,e:`Les ressources sont les éléments dont l'exploitation conditionne le développement économique.`},
 {q:`Où le pétrole et le gaz du Bénin ont-ils été annoncés ?`,o:[`Atacora`,`Secteur de Sèmè`,`Lac Nokoué`,`Borgou`],a:1,e:`Ils sont annoncés dans le bassin sédimentaire côtier, au large de Sèmè.`},
 {q:`Laquelle est une menace pour les ressources ligneuses ?`,o:[`Reboisement`,`Fabrication de charbon de bois`,`Énergie solaire`,`Pisciculture`],a:1,e:`Le charbon de bois, les feux tardifs et la monoculture extensive détruisent les forêts.`},
 {q:`Quelle ressource minière alimente une usine au Bénin ?`,o:[`L'or`,`Le fer`,`Le calcaire pour le ciment`,`Le kaolin`],a:2,e:`Seul le ciment donne lieu à une exploitation industrielle (Onigbolo).`},
 {q:`La côte maritime du Bénin mesure environ :`,o:[`25 km`,`125 km`,`525 km`,`1 000 km`],a:1,e:`Environ 125 km de côte et un système lagunaire important.`},
 {q:`Pourquoi le Bénin a-t-il un déficit énergétique malgré ses ressources ?`,o:[`Elles n'existent pas`,`Elles sont peu exploitées`,`Elles sont vendues à bas prix`,`Elles sont interdites d'exploitation`],a:1,e:`Les ressources énergétiques sont mal ou pas exploitées : le pays dépend de l'extérieur.`},
 {q:`Une conséquence de la mauvaise gestion des ressources est :`,o:[`L'indépendance alimentaire`,`La dépendance vis-à-vis de l'extérieur`,`L'excédent commercial`,`La fin de l'exode rural`],a:1,e:`Le Bénin importe énergie, produits manufacturés et produits alimentaires courants.`},
 {q:`Lequel est un défi à relever ?`,o:[`L'indépendance énergétique`,`La monoculture du coton`,`L'exode rural`,`Les importations massives`],a:0,e:`Valoriser les ressources et assurer l'indépendance énergétique font partie des défis.`},
  {q:`Quelles formations couvrent la plus grande superficie des ressources ligneuses du Bénin ?`,o:[`Les forêts galeries`,`Les forêts claires et les savanes boisées`,`Les mangroves`,`Les plantations de teck`],a:1,e:`Elles couvrent environ 1 932 000 ha, contre environ 273 000 ha de forêts galeries.`},
  {q:`Quels sont les deux parcs nationaux du Bénin ?`,o:[`W et Pendjari`,`Pendjari et Kandi`,`W et Ganvié`,`Atacora et Zou`],a:0,e:`Les parcs nationaux du W et de la Pendjari abritent la faune du Nord du pays.`},
  {q:`Les ressources halieutiques sont liées :`,o:[`À l'élevage`,`À la pêche et aux plans d'eau`,`Aux mines`,`Aux forêts`],a:1,e:`Elles proviennent des cours d'eau, lacs, lagunes et de la mer : poissons, crevettes, crabes.`},
  {q:`Quel géant démographique voisin offre un vaste marché au Bénin ?`,o:[`Le Togo`,`Le Nigeria`,`Le Niger`,`Le Burkina Faso`],a:1,e:`Le Nigeria, proche du Bénin, est le pays le plus peuplé de la sous-région.`},
  {q:`Quelles structures publiques ont remplacé les CARDER et les CeRPA ?`,o:[`Les ATDA`,`Les CEG`,`Les ONG`,`Les mairies`],a:0,e:`Les Agences territoriales de développement agricole (ATDA) sont organisées par pôles de développement agricole.`},
  {q:`Pour lutter contre le comblement d'un lac, on peut :`,o:[`Draguer le lac`,`Y jeter des ordures`,`Pêcher avec des filets interdits`,`Abattre les arbres des berges`],a:0,e:`Le dragage répond au comblement, à l'envasement et à l'ensablement.`},
  {q:`Quelle culture de rente est la plus importante au Bénin ?`,o:[`Le maïs`,`Le coton`,`Le manioc`,`L'igname`],a:1,e:`Le coton domine les cultures de rente ; maïs, manioc et igname sont des cultures vivrières.`}
],
ep:[
 {t:`Sujet 1 – Les ressources du Bénin`, items:[
  {q:`Item 1 (4 pts). Définis : a) ressource disponible (2 pts) ; b) ressource humaine (2 pts).`, r:`a) Élément, bien matériel ou matière première dont l'exploitation conditionne le développement économique d'un pays (2 pts). b) L'homme considéré comme une ressource : la population et ses compétences, ou capital humain (2 pts).`},
  {q:`Item 2 (6 pts). a) Cite quatre ressources disponibles du Bénin (2 pts). b) Localise le pétrole et le gaz naturel (2 pts). c) Cite deux menaces pesant sur les ressources ligneuses (2 pts).`, r:`a) Agricoles, ligneuses, halieutiques, minières, énergétiques, touristiques, humaines… (4 × 0,5 pt). b) Bassin sédimentaire côtier, secteur de Sèmè, au Sud-Est (2 pts). c) Monoculture extensive du coton, feux tardifs, charbon de bois, coupe sélective (2 × 1 pt).`},
  {q:`Item 3 (6 pts). Présente trois conséquences de la mauvaise gestion des ressources sur le développement.`, r:`Faible industrialisation ; dépendance extérieure (énergie, produits manufacturés, alimentation) ; balance commerciale déficitaire ; exode rural et urbanisation anarchique ; pauvreté. 3 × 2 pts.`},
  {q:`Item 4 (4 pts). Propose quatre mesures pour mieux valoriser les ressources.`, r:`Valoriser les ressources ; rénover l'école et former pour l'emploi ; promouvoir la recherche ; assurer l'indépendance énergétique ; diversifier l'agriculture ; lutter contre la corruption. 4 × 1 pt.`}
 ]},
 {t:`Sujet 2 – Vrai ou faux, défis et production écrite`, items:[
  {q:`Item 1 (4 pts). Vrai ou Faux : a) La monoculture extensive du coton menace les forêts. b) Le Bénin est autosuffisant en énergie. c) Le Bénin dispose d'environ 125 km de côte. d) L'exode rural entraîne le surpeuplement de grandes villes.`, r:`a) Vrai. b) Faux. c) Vrai. d) Vrai. 1 pt chacune.`},
  {q:`Item 2 (6 pts). a) Explique pourquoi le Bénin connaît un déficit énergétique malgré ses ressources (3 pts). b) Cite trois ressources touristiques ou culturelles (3 pts).`, r:`a) Ressources (pétrole, gaz, tourbe, hydroélectricité, solaire) peu ou pas exploitées, équipements techniques insuffisants, manque de politique énergétique : dépendance de l'extérieur (3 pts). b) Palais et musées royaux, route de l'esclavage, chaîne de l'Atacora, festivals… (3 × 1 pt).`},
  {q:`Item 3 (6 pts). Cite trois défis (3 pts) et trois mesures pour les relever (3 pts).`, r:`Défis : indépendance énergétique, formation et emploi, réduction de l'analphabétisme, bonne gouvernance… Mesures : recherche scientifique, rénovation de l'école, diversification agricole, politique de population… 6 × 1 pt.`},
  {q:`Item 4 (4 pts). Rédige 6 lignes pour inciter tes camarades à protéger les forêts de ta localité.`, r:`Barème : consigne respectée (1 pt), arguments (2 pts), langue (1 pt). Idées : les forêts protègent sols et climat, fournissent bois et abri à la faune ; le charbon de bois et les feux tardifs les détruisent ; reboiser et utiliser d'autres énergies.`}
 ]}
]
},
{
id:3, court:`Impérialisme européen`, titre:`Quelles sont les causes et les manifestations de l'impérialisme européen en Afrique aux XIXe et XXe siècles ?`, duree:`20 h`, dom:`Histoire`,
intro:`Vers la fin du XIXe siècle, l'Europe industrialisée se lance dans la conquête et l'exploitation de l'Afrique. Cette politique a pesé lourdement sur le destin du continent. Quelles en sont les causes, les manifestations et les conséquences ?`,
parts:[
 {t:`I. Les causes de l'impérialisme`, blocks:[
  {h:`1.1 Notions à clarifier`, pts:[
   `Impérialisme : politique d'expansion et de domination d'un État sur d'autres peuples ou territoires.`,
   `Colonisation : occupation et mise en valeur d'un territoire étranger. Colonialisme : doctrine qui justifie la colonisation.`,
   `Colonie : territoire administré directement par un État étranger. Protectorat : territoire qui garde ses autorités locales mais dont la défense et les relations extérieures sont contrôlées par une puissance étrangère.`,
   `Dominion : colonie de peuplement européen largement autonome (dans l'Empire britannique). Condominium : territoire administré conjointement par deux États.`]},
  {h:`1.2 Les causes`, pts:[
   `Économiques et stratégiques (les plus importantes) : placer les capitaux, trouver des matières premières et des débouchés pour les produits des usines.`,
   `Démographiques : trouver des terres pour accueillir le surplus de population.`,
   `Politiques : rechercher puissance et prestige par l'expansion militaire.`,
   `Humanitaires : prétexte de la « mission civilisatrice » (lutte contre l'esclavage, évangélisation, progrès).`]}
 ]},
 {t:`II. Les manifestations de l'impérialisme`, blocks:[
  {h:`2.1 Méthodes de pénétration`, pts:[
   `Les explorateurs : cartes et récits de voyage qui font connaître l'Afrique.`,
   `Les missionnaires : évangélisation, écoles, et appui à la présence européenne.`,
   `Les marchands : comptoirs et traités commerciaux.`,
   `Les militaires : conquête armée et occupation.`]},
  {h:`2.2 La Conférence de Berlin (1884-1885)`, pts:[
   `Causes : rivalités entre puissances européennes (notamment autour du Congo et du Niger). Elle est réunie à Berlin sous l'impulsion du chancelier allemand Bismarck.`,
   `Décisions : liberté de commerce dans les bassins du Congo et du Niger ; principe de l'occupation effective pour reconnaître les possessions ; obligation de notifier aux autres puissances toute prise de possession.`,
   `Impacts : accélération de la course au partage de l'Afrique, découpage sans tenir compte des réalités des peuples (balkanisation).`]},
  {h:`2.3 Les formes de colonisation`, pts:[
   `Britannique : administration indirecte (indirect rule) s'appuyant sur les chefs locaux.`,
   `Française : administration directe, assimilation puis association ; fédérations d'AOF (Dakar) et d'AEF, dirigées par des gouverneurs généraux.`,
   `Belge : administration directe et paternaliste, Congo belge, Rwanda-Urundi.`,
   `Portugaise : Angola, Mozambique, Guinée-Bissau… administration directe et assimilation.`,
   `Allemande : Togo, Cameroun, Sud-Ouest africain, Afrique orientale (perdus après 1918). Italienne : Érythrée, Somalie, Libye. Espagnole : Sahara espagnol, Guinée équatoriale, nord du Maroc.`]}
 ]},
 {t:`III. Les conséquences de l'impérialisme`, blocks:[
  {h:`3.1 Avantages pour l'Europe`, pts:[
   `Politique : suprématie européenne sur le monde, apogée de l'européocentrisme.`,
   `Économique : exploitation des ressources, approvisionnement des industries en matières premières, pacte colonial (les colonies fournissent matières premières et achètent les produits de la métropole).`,
   `Socio-culturel : rayonnement de la culture européenne (christianisme, langues de travail) imposée comme norme.`]},
  {h:`3.2 Un frein au développement de l'Afrique`, pts:[
   `Politique : massacres, humiliation et exil de souverains ; perte de souveraineté ; frontières artificielles.`,
   `Économique : pillage des ressources, extraversion de l'économie, poids de l'économie de traite.`,
   `Socio-culturel : destruction de sociétés, code de l'indigénat (statut avilissant des colonisés), impôts, réquisitions, travaux forcés, pillage des biens culturels.`]}
 ]}
],
concl:`Poussée par des causes surtout économiques, l'Europe a partagé l'Afrique après la Conférence de Berlin. La colonisation a servi l'Europe mais a durablement freiné le développement du continent.`,
fc:[
 [`Définissez l'impérialisme.`,`Politique d'expansion et de domination d'un État sur d'autres peuples ou territoires.`],
 [`Quelles sont les causes de l'impérialisme ?`,`Économiques et stratégiques, démographiques, politiques, humanitaires (mission civilisatrice).`],
 [`Quand s'est tenue la Conférence de Berlin ?`,`De novembre 1884 à février 1885.`],
 [`Citez deux décisions de la Conférence de Berlin.`,`Liberté de commerce sur le Congo et le Niger ; occupation effective ; notification des prises de possession.`],
 [`Quelle administration pratique la Grande-Bretagne ?`,`L'administration indirecte (indirect rule).`],
 [`Qu'est-ce que le pacte colonial ?`,`Les colonies fournissent les matières premières et achètent les produits manufacturés de la métropole.`],
 [`Que décide la loi de l'hinterland ?`,`La puissance installée sur la côte a des droits sur l'arrière-pays.`],
 [`Qui est Léopold II ?`,`Roi des Belges, propriétaire de l'État libre du Congo reconnu à Berlin.`],
 [`Citez deux formes d'administration coloniale.`,`Administration indirecte (britannique) et administration directe (française).`],
 [`Que sont les « 3M » ?`,`Missionnaires, marchands et militaires.`]
],
quiz:[
 {q:`La Conférence de Berlin s'est tenue en :`,o:[`1805-1806`,`1884-1885`,`1914-1915`,`1960`],a:1,e:`Elle a eu lieu de novembre 1884 à février 1885 et a accéléré le partage de l'Afrique.`},
 {q:`Quel chancelier a accueilli la Conférence de Berlin ?`,o:[`Napoléon III`,`Bismarck`,`Churchill`,`Léopold II`],a:1,e:`Le chancelier allemand Bismarck en a été l'initiateur avec d'autres puissances.`},
 {q:`Quelle cause est la plus importante ?`,o:[`Humanitaire`,`Économique et stratégique`,`Religieuse`,`Sportive`],a:1,e:`Matières premières, débouchés et placement de capitaux dominent les causes.`},
 {q:`L'indirect rule est pratiquée par :`,o:[`La France`,`La Belgique`,`La Grande-Bretagne`,`Le Portugal`],a:2,e:`Les Britanniques gouvernent en s'appuyant sur les chefs traditionnels.`},
 {q:`L'AOF est une fédération de colonies :`,o:[`Britanniques`,`Françaises`,`Belges`,`Italiennes`],a:1,e:`Elle était dirigée par un gouverneur général installé à Dakar.`},
 {q:`La « mission civilisatrice » est :`,o:[`Une cause réelle principale`,`Un prétexte pour justifier la conquête`,`Un traité commercial`,`Un syndicat`],a:1,e:`Elle servait à justifier moralement la colonisation.`},
 {q:`Le code de l'indigénat :`,o:[`Donnait aux Africains la citoyenneté`,`Fixait un statut avilissant aux colonisés`,`Supprimait l'impôt`,`Créait des écoles`],a:1,e:`Il soumettait les colonisés à un régime d'exception.`},
 {q:`Un protectorat est un territoire :`,o:[`Administré directement`,`Qui garde ses autorités locales sous contrôle extérieur`,`Sans habitants`,`Gouverné par deux États`],a:1,e:`Défense et relations extérieures sont contrôlées par la puissance protectrice.`},
  {q:`À qui l'État libre du Congo est-il reconnu comme propriété ?`,o:[`À la France`,`À Léopold II, roi des Belges`,`À Bismarck`,`Au Portugal`],a:1,e:`La Conférence de Berlin a reconnu l'État libre du Congo comme propriété du roi Léopold II.`},
  {q:`Que dit la loi de l'occupation effective ?`,o:[`Une possession n'est reconnue que si elle est réellement occupée`,`Les Africains choisissent leur colonisateur`,`Toute conquête est interdite`,`Seuls les missionnaires peuvent occuper`],a:0,e:`Il fallait une administration et une force armée sur place pour faire reconnaître une possession.`},
  {q:`Qui a signé un traité de protectorat avec Makoko, roi des Batéké ?`,o:[`Stanley`,`Livingstone`,`Brazza`,`Gouraud`],a:2,e:`Pierre Savorgnan de Brazza a signé ce traité au nom de la France.`},
  {q:`Quelle est la capitale de l'AOF ?`,o:[`Dakar`,`Abidjan`,`Cotonou`,`Brazzaville`],a:0,e:`Dakar est la capitale de l'AOF ; Brazzaville est celle de l'AEF.`},
  {q:`Que désigne l'impôt de capitation ?`,o:[`Un impôt payé par chaque personne`,`Un impôt sur les entreprises`,`Un droit de douane`,`Une taxe sur le cacao`],a:0,e:`C'est un impôt par tête, qui obligeait les colonisés à produire pour vendre ou à travailler pour les Européens.`},
  {q:`Que signifient les « 3M » ?`,o:[`Missionnaires, marchands, militaires`,`Mines, marchés, monnaie`,`Monarques, maires, ministres`,`Mer, montagne, musée`],a:0,e:`Les trois groupes qui ont préparé et réalisé la pénétration européenne.`},
  {q:`Quelle enclave la Conférence de Berlin a-t-elle laissée au Portugal ?`,o:[`Le Togo`,`Le Cabinda`,`Le Katanga`,`Le Rwanda`],a:1,e:`Le Portugal a gardé l'enclave de Cabinda.`}
],
ep:[
 {t:`Sujet 1 – Causes, Berlin et formes de colonisation`, items:[
  {q:`Item 1 (4 pts). Définis : impérialisme, colonisation, protectorat, colonie.`, r:`1 pt chacune. Impérialisme : politique d'expansion et de domination sur d'autres peuples. Colonisation : occupation et mise en valeur d'un territoire étranger. Protectorat : territoire qui garde ses autorités mais dont défense et relations extérieures sont contrôlées. Colonie : territoire administré directement par un État étranger.`},
  {q:`Item 2 (6 pts). a) Cite les quatre causes de l'impérialisme (2 pts). b) Cite les quatre acteurs de la pénétration européenne (2 pts). c) Explique la « mission civilisatrice » (2 pts).`, r:`a) Économiques et stratégiques, démographiques, politiques, humanitaires. b) Explorateurs, missionnaires, marchands, militaires. c) Prétexte moral : prétendue mission d'apporter civilisation, religion et progrès aux peuples colonisés, pour justifier la conquête.`},
  {q:`Item 3 (6 pts). Conférence de Berlin : indique ses dates (1 pt), son initiateur (1 pt), deux décisions (2 pts) et deux impacts (2 pts).`, r:`1884-1885 ; Bismarck, chancelier allemand ; liberté de commerce sur Congo et Niger, occupation effective, notification ; accélération du partage de l'Afrique, frontières artificielles.`},
  {q:`Item 4 (4 pts). Compare la colonisation britannique et la colonisation française.`, r:`Britannique : administration indirecte, appui sur les chefs locaux (2 pts). Française : administration directe, assimilation puis association, fédérations d'AOF et d'AEF (2 pts).`}
 ]},
 {t:`Sujet 2 – Étude de document et conséquences`, items:[
  {q:`Item 1 (4 pts). Vrai ou Faux : a) La Conférence de Berlin a eu lieu en 1914. b) Le pacte colonial profite surtout à la métropole. c) L'indirect rule est une pratique britannique. d) L'impérialisme européen a eu uniquement des effets positifs en Afrique.`, r:`a) Faux (1884-1885). b) Vrai. c) Vrai. d) Faux. 1 pt chacune.`},
  {q:`Item 2 (6 pts). Document d'exercice : en juillet 1885, devant la Chambre des députés français, Jules Ferry défend l'expansion coloniale en invoquant les débouchés économiques et un prétendu devoir des « races supérieures » ; Georges Clemenceau lui répond que la conquête est violence et refuse de la parer du nom de civilisation. a) Présente le débat (2 pts). b) Relève l'argument de Ferry (2 pts). c) Relève l'argument de Clemenceau (2 pts).`, r:`a) Débat parlementaire français de juillet 1885 entre partisan et adversaire de la politique coloniale (2 pts). b) Débouchés économiques et devoir civilisateur (2 pts). c) La conquête repose sur la violence ; elle ne peut être justifiée par la civilisation (2 pts).`},
  {q:`Item 3 (6 pts). Présente trois conséquences de la colonisation pour l'Europe (3 pts) et trois pour l'Afrique (3 pts).`, r:`Europe : suprématie politique, approvisionnement en matières premières, pacte colonial, rayonnement culturel. Afrique : perte de souveraineté, pillage des ressources, économie de traite, code de l'indigénat, travaux forcés. 6 × 1 pt.`},
  {q:`Item 4 (4 pts). Rédige 6 lignes pour défendre cette idée : « La colonisation a freiné le développement de l'Afrique ».`, r:`Barème : consigne (1 pt), arguments (2 pts), langue (1 pt). Arguments : perte de souveraineté, frontières artificielles, pillage des ressources, économie extravertie, travaux forcés, pillage des biens culturels.`}
 ]}
]
},

id:4, court:`CEDEAO`, titre:`En quoi la CEDEAO constitue-t-elle un exemple d'intégration économique ?`, duree:`20 h`, dom:`Géographie`,
intro:`Face à l'étroitesse de leurs marchés et à leur dépendance, les États d'Afrique de l'Ouest ont choisi de mettre en commun leurs potentialités. La CEDEAO en est l'exemple principal. En quoi illustre-t-elle une intégration économique ?`,
parts:[
 {t:`I. La notion d'intégration économique`, blocks:[
  {h:`1.1 Définition`, pts:[
   `L'intégration économique est un processus par lequel plusieurs États mettent en commun leurs économies et suppriment progressivement les obstacles aux échanges pour former un ensemble économique plus vaste.`]},
  {h:`1.2 Caractéristiques et avantages`, pts:[
   `Caractéristiques : traité et institutions communes, libre circulation des biens, des personnes et des capitaux, tarif extérieur commun, politiques économiques coordonnées, parfois monnaie commune.`,
   `Avantages : élargissement du marché, hausse des échanges, économies d'échelle, attrait pour les investisseurs, meilleur poids dans les négociations, paix et sécurité renforcées.`]}
 ]},
 {t:`II. Les origines de la CEDEAO`, blocks:[
  {h:`2.1 Naissance`, pts:[
   `La CEDEAO (Communauté économique des États de l'Afrique de l'Ouest) est créée le 28 mai 1975 à Lagos (Nigeria).`,
   `Elle réunit 15 États à l'origine. Son siège est à Abuja (Nigeria).`,
   `Elle s'appuie sur des regroupements antérieurs (AOF, Conseil de l'Entente) et sur la volonté de réduire la dépendance extérieure.`,
   `Note d'actualité : le Mali, le Burkina Faso et le Niger ont annoncé leur retrait en janvier 2024 ; il est devenu effectif en 2025. La composition de la CEDEAO a donc changé depuis la rédaction du guide : elle compte aujourd'hui 12 membres. Depuis le 19 juillet 2026, le président sénégalais Bassirou Diomaye Faye préside la Conférence et le général Birame Diop dirige la Commission pour 2026-2030.`]}
 ]},
 {t:`III. Le fonctionnement de la CEDEAO`, blocks:[
  {h:`3.1 Les institutions`, pts:[
   `Conférence des chefs d'État et de gouvernement : organe suprême.`,
   `Conseil des ministres ; Commission (organe exécutif) ; Parlement communautaire ; Cour de justice de la Communauté.`,
   `Institutions spécialisées : banque d'investissement et de développement (BIDC), organisation de santé, etc.`,
   `Actions : libre circulation des personnes (protocole de 1979), construction d'infrastructures régionales, médiation et maintien de la paix.`]}
 ]},
 {t:`IV. Les potentialités économiques de l'espace CEDEAO`, blocks:[
  {h:`4.1 Atouts`, pts:[
   `Population nombreuse (plus de 300 millions d'habitants) : grand marché potentiel et main-d'œuvre jeune.`,
   `Ressources variées : pétrole et gaz (Nigeria), or (Ghana, Mali), cacao (Côte d'Ivoire, Ghana), coton, bauxite, fer, phosphates, ressources agricoles et halieutiques.`,
   `Complémentarité entre pays côtiers et pays sahéliens.`]},
  {h:`4.2 Difficultés et actions à mener`, pts:[
   `Obstacles : barrières non tarifaires et tracasseries aux frontières, insuffisance des infrastructures, divergences politiques, instabilité, monnaies différentes.`,
   `Actions : respecter la libre circulation, améliorer routes et chemins de fer, harmoniser les politiques, soutenir la production locale, former les cadres.`]}
 ]}
],
concl:`La CEDEAO illustre l'intégration économique par son traité, ses institutions, son marché élargi et ses projets communs. Son avenir dépend de la volonté des États de lever les obstacles à l'intégration.`,
fc:[
 [`Définissez l'intégration économique.`,`Mise en commun des économies de plusieurs États avec suppression progressive des obstacles aux échanges.`],
 [`Quand et où la CEDEAO est-elle créée ?`,`Le 28 mai 1975 à Lagos.`],
 [`Où est le siège de la CEDEAO ?`,`À Abuja (Nigeria).`],
 [`Quel est l'organe suprême ?`,`La Conférence des chefs d'État et de gouvernement.`],
 [`Citez deux avantages d'une intégration.`,`Marché élargi, hausse des échanges, meilleur poids dans les négociations.`],
 [`Citez deux obstacles à l'intégration.`,`Tracasseries aux frontières, insuffisance des infrastructures, divergences politiques.`],
 [`Citez les cinq niveaux d'intégration économique.`,`Zone de libre-échange, union douanière, marché commun, union économique, union économique et monétaire.`],
 [`Combien d'États compte la CEDEAO aujourd'hui ?`,`12 : le Burkina Faso, le Mali et le Niger sont partis le 29 janvier 2025.`],
 [`Quel organe a remplacé le Secrétariat exécutif ?`,`La Commission, organe exécutif (siège à Abuja).`],
 [`Citez trois organes de la CEDEAO.`,`Conférence des chefs d'État, Conseil des ministres, Commission, Parlement, Cour de justice.`]
],
quiz:[
 {q:`La CEDEAO a été créée en :`,o:[`1960`,`1975`,`1990`,`2000`],a:1,e:`Le traité de Lagos date du 28 mai 1975.`},
 {q:`Où se trouve le siège de la CEDEAO ?`,o:[`Cotonou`,`Dakar`,`Abuja`,`Accra`],a:2,e:`Le siège est à Abuja, au Nigeria.`},
 {q:`Combien d'États comptait-elle à sa création ?`,o:[`5`,`10`,`15`,`25`],a:2,e:`Quinze États ont signé le traité de Lagos.`},
 {q:`Quel est l'organe suprême ?`,o:[`La Cour de justice`,`La Conférence des chefs d'État et de gouvernement`,`Le Parlement`,`La Commission`],a:1,e:`Elle fixe les grandes orientations de la Communauté.`},
 {q:`Un avantage de l'intégration économique est :`,o:[`La fermeture des frontières`,`L'élargissement du marché`,`La hausse des droits de douane internes`,`L'isolement des États`],a:1,e:`Un marché plus vaste favorise échanges, investissements et économies d'échelle.`},
 {q:`Quel pays est le plus peuplé de l'espace CEDEAO ?`,o:[`Bénin`,`Togo`,`Nigeria`,`Gambie`],a:2,e:`Le Nigeria est le géant démographique de la sous-région.`},
 {q:`Que signifie intégration économique ?`,o:[`Isoler les économies`,`Mettre en commun les économies de plusieurs États`,`Vendre uniquement à l'étranger`,`Supprimer les entreprises`],a:1,e:`Les États coordonnent leurs économies et suppriment les obstacles aux échanges.`},
 {q:`Quel obstacle freine encore l'intégration ?`,o:[`Les tracasseries aux frontières`,`La libre circulation parfaite`,`Un tarif extérieur commun`,`Un trop grand nombre de routes`],a:0,e:`Les barrières non tarifaires et contrôles abusifs ralentissent les échanges.`},
  {q:`Quel traité a créé la CEDEAO ?`,o:[`Le traité de Lagos`,`Le traité d'Accra`,`Le traité de Monrovia`,`Le traité de Berlin`],a:0,e:`Le traité de Lagos, signé le 28 mai 1975, a été révisé en 1993.`},
  {q:`Combien d'États la CEDEAO compte-t-elle depuis janvier 2025 ?`,o:[`9`,`12`,`15`,`18`],a:1,e:`Le Burkina Faso, le Mali et le Niger l'ont quittée le 29 janvier 2025.`},
  {q:`Quelle institution a remplacé le Secrétariat exécutif ?`,o:[`La Commission`,`La Cour de justice`,`Le Parlement`,`La BIDC`],a:0,e:`La Commission est l'organe exécutif ; son siège est à Abuja.`},
  {q:`Le protocole de 1979 concerne :`,o:[`La libre circulation des personnes`,`La monnaie unique`,`Le tarif extérieur commun`,`La défense commune`],a:0,e:`Il organise la libre circulation des personnes dans l'espace communautaire.`},
  {q:`Quel niveau d'intégration adopte une monnaie unique ?`,o:[`La zone de libre-échange`,`L'union douanière`,`Le marché commun`,`L'union économique et monétaire`],a:3,e:`C'est le dernier niveau, après l'union économique.`},
  {q:`À quoi sert la carte brune CEDEAO ?`,o:[`À l'assurance automobile dans l'espace CEDEAO`,`À voter`,`À payer les impôts`,`À s'inscrire à l'école`],a:0,e:`Elle évite de souscrire une assurance dans chaque pays traversé.`},
  {q:`Qui a lancé en 1964 l'idée d'une communauté ouest-africaine ?`,o:[`William Tubman`,`Bismarck`,`Samory`,`Ménélik II`],a:0,e:`Le président libérien William Tubman, avant Accra (1967) et Monrovia (1968).`}
],
ep:[
 {t:`Sujet 1 – Notion et origines`, items:[
  {q:`Item 1 (4 pts). a) Définis l'intégration économique (2 pts). b) Donne la signification du sigle CEDEAO (2 pts).`, r:`a) Mise en commun des économies de plusieurs États avec suppression progressive des obstacles aux échanges (2 pts). b) Communauté économique des États de l'Afrique de l'Ouest (2 pts).`},
  {q:`Item 2 (6 pts). a) Indique la date et le lieu de création de la CEDEAO (2 pts). b) Cite quatre États membres (2 pts). c) Cite deux organes (2 pts).`, r:`a) 28 mai 1975, Lagos. b) Bénin, Togo, Ghana, Nigeria, Sénégal, Côte d'Ivoire… c) Conférence des chefs d'État, Conseil des ministres, Commission, Parlement, Cour de justice.`},
  {q:`Item 3 (6 pts). Cite trois caractéristiques (3 pts) et trois avantages (3 pts) d'une intégration économique.`, r:`Caractéristiques : traité, institutions communes, libre circulation, tarif extérieur commun… Avantages : marché élargi, échanges accrus, économies d'échelle, poids dans les négociations. 6 × 1 pt.`},
  {q:`Item 4 (4 pts). Propose quatre actions pour faciliter l'intégration économique des États membres.`, r:`Respecter la libre circulation, supprimer les tracasseries aux frontières, améliorer les infrastructures, harmoniser les politiques économiques, soutenir la production locale. 4 × 1 pt.`}
 ]},
 {t:`Sujet 2 – Fonctionnement et potentialités`, items:[
  {q:`Item 1 (4 pts). Vrai ou Faux : a) La CEDEAO a été créée à Lagos. b) Son siège est à Cotonou. c) La Conférence des chefs d'État est l'organe suprême. d) L'espace CEDEAO compte moins de 10 millions d'habitants.`, r:`a) Vrai. b) Faux (Abuja). c) Vrai. d) Faux (plus de 300 millions). 1 pt chacune.`},
  {q:`Item 2 (6 pts). Présente trois potentialités économiques de l'espace CEDEAO.`, r:`Grand marché de plus de 300 millions d'habitants ; ressources variées (pétrole, or, cacao, coton…) ; complémentarité pays côtiers et sahéliens. 3 × 2 pts.`},
  {q:`Item 3 (6 pts). Cite trois obstacles à l'intégration (3 pts) et propose une solution à chacun (3 pts).`, r:`Tracasseries aux frontières → respecter la libre circulation ; infrastructures insuffisantes → investir dans routes et énergie ; divergences politiques → dialogue et harmonisation. 6 × 1 pt.`},
  {q:`Item 4 (4 pts). Une étudiante voit ses colis confisqués à la frontière d'un pays voisin. Rédige 6 lignes pour expliquer en quoi cela contredit l'idée d'intégration.`, r:`Barème : consigne (1 pt), arguments (2 pts), langue (1 pt). Idées : l'intégration suppose la libre circulation des biens et des personnes ; les tracasseries freinent les échanges et découragent les citoyens ; il faut appliquer les textes communautaires.`}
 ]}
]
},
{
id:5, court:`Résistances africaines`, titre:`Comment expliquer les résistances africaines face à l'impérialisme européen ?`, duree:`28 h`, dom:`Histoire`,
intro:`Face à la conquête européenne, les souverains et les peuples africains ont opposé de vives résistances, au Soudan occidental, en Éthiopie et dans l'actuel Bénin. Pourquoi ont-ils résisté et pourquoi la plupart ont-ils échoué ?`,
parts:[
 {t:`I. Les résistances face à la conquête coloniale`, blocks:[
  {h:`1.1 Samory Touré (pays mandingue)`, pts:[
   `Origines modestes, conversion à l'islam, création d'un empire théocratique en pays mandingue.`,
   `Affrontements prolongés avec les troupes françaises ; tactique de la terre brûlée.`,
   `Capturé en 1898 par le capitaine Gouraud, exilé au Gabon où il meurt en 1900.`]},
  {h:`1.2 Ménélik II (Éthiopie)`, pts:[
   `Cause immédiate : interprétation contradictoire du traité d'Uccialli (1889) entre Italiens et Éthiopiens.`,
   `Victoire éclatante d'Adoua le 1er mars 1896 sur l'armée italienne.`,
   `Facteurs : armée nombreuse et bien équipée, union autour de l'empereur, bonne connaissance du terrain.`,
   `Portée : l'Éthiopie préserve son indépendance et devient un symbole de la résistance africaine.`]},
  {h:`1.3 Béhanzin (Danxomè)`, pts:[
   `Roi du Danxomè (1889-1894), il refuse l'emprise française sur son royaume.`,
   `Deux guerres de résistance contre la France (1890 et 1892), puis vie au maquis.`,
   `Reddition en 1894 et exil en Martinique, puis en Algérie où il meurt en 1906.`]},
  {h:`1.4 Saka Yerima (Borgu)`, pts:[
   `Prince Wassangari (1830-1897) ; causes : brutalités françaises, pillage et incendie de son village maternel Gbegburu (1897), volonté d'empêcher les Français d'entrer à Nikki.`,
   `Combats à Bon Nuki (8 novembre 1897) et à Ariyo (31 décembre 1897) ; il y meurt avec une centaine de combattants.`]}
 ]},
 {t:`II. Les résistances face à l'administration coloniale (Dahomey)`, blocks:[
  {h:`2.1 Les causes générales`, pts:[
   `Abus de l'administration, surtout pendant la Première Guerre mondiale : travaux forcés, réquisitions, portage, impôts, taxes, enrôlement.`]},
  {h:`2.2 Quelques résistances populaires`, pts:[
   `Les Holli (Hollidjè) : révoltes en 1914, 1915 et 1916 ; échec et répression.`,
   `Les Saxwè (Sahouè, Mono) : mobilisation en 1916, insurrection de juillet 1918, mort de l'administrateur Grange (21 juillet 1918) ; échec en 1919.`,
   `Bio Guéra (Borgu) : prince Wassangari ; combat 15 mois ; tué le 17 décembre 1916 à Baura.`,
   `Kaba (Atacora) : guérilla de 1916 à 1917 ; lui et ses guerriers sont massacrés dans la grotte de Data Ouri.`]}
 ]},
 {t:`III. Les causes de l'échec des résistances`, blocks:[
  {h:`3.1 Causes internes`, pts:[
   `Affaiblissement des royaumes côtiers par la traite négrière transatlantique.`,
   `Divisions entre Africains : Kong appuie les Français contre Samory ; Porto-Novo sert de base à la conquête du Danxomè.`,
   `Présence de populations acquises aux valeurs occidentales, qui appuient les troupes coloniales.`]},
  {h:`3.2 Causes externes`, pts:[
   `Meilleure connaissance de l'Afrique grâce aux cartes et récits des explorateurs et missionnaires.`,
   `Supériorité militaire, technique et financière des troupes coloniales.`]},
  {h:`3.3 Leçons à tirer`, pts:[
   `L'union, la modernisation des armées et des économies sont nécessaires pour préserver la souveraineté.`,
   `Honorer la mémoire des résistants et transmettre leur patriotisme.`]}
 ]}
],
concl:`Malgré leur courage, la plupart des résistances ont échoué à cause des divisions africaines et de la supériorité militaire européenne. Seule l'Éthiopie de Ménélik II a conservé son indépendance. Leur mémoire reste une source de fierté et de leçons.`,
fc:[
 [`Qui est vainqueur à Adoua ?`,`Ménélik II (Éthiopie) contre l'Italie, le 1er mars 1896.`],
 [`Quand et par qui Samory est-il capturé ?`,`En 1898, par le capitaine Gouraud.`],
 [`Quel roi du Danxomè résiste à la France ?`,`Béhanzin (guerres de 1890 et 1892, reddition en 1894).`],
 [`Où et quand meurt Saka Yerima ?`,`À Ariyo, le 31 décembre 1897.`],
 [`Quand est tué Bio Guéra ?`,`Le 17 décembre 1916, à Baura.`],
 [`Citez deux causes de l'échec des résistances.`,`Divisions des Africains, supériorité militaire et technique européenne.`],
 [`Quel traité provoque la guerre entre l'Italie et l'Éthiopie ?`,`Le traité d'Uccialli (1889), compris différemment par les deux camps.`],
 [`Où et quand meurt Samory ?`,`Au Gabon, en 1900, après sa capture en 1898.`],
 [`Où meurt Béhanzin ?`,`En exil en Algérie, en 1906 (après la Martinique).`],
 [`Citez les causes générales des soulèvements populaires.`,`Travaux forcés, impôts, portage, réquisitions, enrôlement forcé et abus de l'administration.`]
],
quiz:[
 {q:`Qui a remporté la bataille d'Adoua en 1896 ?`,o:[`Samory`,`Ménélik II`,`Béhanzin`,`Kaba`],a:1,e:`Ménélik II a battu l'armée italienne le 1er mars 1896.`},
 {q:`Qui a capturé Samory Touré en 1898 ?`,o:[`Gouraud`,`Faidherbe`,`Lyautey`,`Brazza`],a:0,e:`Le capitaine Gouraud a capturé Samory ; il meurt exilé au Gabon en 1900.`},
 {q:`Béhanzin a été exilé en :`,o:[`Martinique`,`Madagascar`,`Gabon`,`France métropolitaine uniquement`],a:0,e:`Il est exilé en Martinique, puis en Algérie, où il meurt en 1906.`},
 {q:`Saka Yerima est mort à :`,o:[`Abomey`,`Ariyo`,`Kandi`,`Natitingou`],a:1,e:`Il est mort à Ariyo le 31 décembre 1897.`},
 {q:`Bio Guéra est mort en :`,o:[`1894`,`1897`,`1916`,`1960`],a:2,e:`Il est tué le 17 décembre 1916 à Baura.`},
 {q:`Kaba a combattu dans :`,o:[`L'Atacora`,`Le Mono`,`Le Zou`,`L'Ouémé`],a:0,e:`Sa guérilla se termine par le massacre de Data Ouri (1917).`},
 {q:`Une cause interne de l'échec des résistances est :`,o:[`La supériorité des armes`,`Les divisions entre Africains`,`Les cartes des explorateurs`,`Les moyens financiers européens`],a:1,e:`Les rivalités africaines ont facilité la conquête.`},
 {q:`Une cause externe de l'échec est :`,o:[`La traite négrière`,`La supériorité militaire et technique européenne`,`La division des chefs`,`Les alliances locales`],a:1,e:`Armes modernes, organisation et moyens financiers donnent l'avantage aux troupes coloniales.`},
  {q:`Quel traité est à l'origine de la guerre entre l'Italie et l'Éthiopie ?`,o:[`Uccialli (1889)`,`Berlin (1885)`,`Lagos (1975)`,`Versailles (1919)`],a:0,e:`Italiens et Éthiopiens l'interprétaient de façon contradictoire.`},
  {q:`Quelle tactique Samory a-t-il utilisée face aux Français ?`,o:[`La terre brûlée`,`La grève générale`,`Le boycott`,`La seule diplomatie`],a:0,e:`Il harcelait l'ennemi et faisait le vide devant lui.`},
  {q:`Où Béhanzin est-il mort en exil ?`,o:[`En Martinique`,`En Algérie`,`Au Gabon`,`À Paris`],a:1,e:`Exilé en Martinique puis en Algérie, il y meurt en 1906. Samory est mort au Gabon.`},
  {q:`Quand Béhanzin se rend-il aux Français ?`,o:[`Le 25 janvier 1894`,`Le 1er mars 1896`,`En 1916`,`En 1975`],a:0,e:`Sa reddition met fin à la deuxième guerre du Danxomè.`},
  {q:`Où Kaba et ses guerriers ont-ils été massacrés ?`,o:[`Dans la grotte de Data Ouri`,`À Adoua`,`À Cana`,`À Ariyo`],a:0,e:`Kaba a mené une guérilla de 1916 à 1917 dans l'Atacora.`},
  {q:`Les Saxwè (Sahouè) se soulèvent en juillet :`,o:[`1894`,`1918`,`1960`,`1975`],a:1,e:`L'administrateur Grange est tué le 21 juillet 1918 ; la révolte échoue en 1919.`},
  {q:`Quel royaume a appuyé les Français contre Samory ?`,o:[`Kong`,`L'Éthiopie`,`Le Danxomè`,`Le Borgu`],a:0,e:`C'est un exemple des divisions des Africains.`}
],
ep:[
 {t:`Sujet 1 – Les grandes résistances`, items:[
  {q:`Item 1 (4 pts). Associe chaque résistant à son territoire : a) Samory ; b) Ménélik II ; c) Béhanzin ; d) Saka Yerima. (Éthiopie – Danxomè – pays mandingue – Borgu)`, r:`a) pays mandingue ; b) Éthiopie ; c) Danxomè ; d) Borgu. 1 pt chacune.`},
  {q:`Item 2 (6 pts). a) Dis pourquoi Adoua est importante (3 pts). b) Raconte la fin de Samory (3 pts).`, r:`a) Victoire de Ménélik II sur l'Italie le 1er mars 1896 : l'Éthiopie garde son indépendance, symbole pour l'Afrique. b) Terre brûlée, capture en 1898 par Gouraud, exil au Gabon, mort en 1900.`},
  {q:`Item 3 (6 pts). Présente la résistance de Béhanzin (causes, déroulement, fin).`, r:`Causes : refus de l'emprise française (2 pts). Déroulement : guerres de 1890 et 1892, maquis (2 pts). Fin : reddition en 1894, exil en Martinique puis en Algérie, mort en 1906 (2 pts).`},
  {q:`Item 4 (4 pts). Cite deux causes internes (2 pts) et deux causes externes (2 pts) de l'échec des résistances.`, r:`Internes : traite négrière, divisions, appui de populations acquises à l'Occident. Externes : meilleure connaissance de l'Afrique, supériorité militaire et financière.`}
 ]},
 {t:`Sujet 2 – Résistances populaires et leçons`, items:[
  {q:`Item 1 (4 pts). Vrai ou Faux : a) Bio Guéra est mort en 1916. b) Les Holli se sont révoltés contre l'administration coloniale. c) Kaba a résisté dans le Mono. d) Saka Yerima a combattu à Ariyo.`, r:`a) Vrai. b) Vrai. c) Faux (Atacora). d) Vrai. 1 pt chacune.`},
  {q:`Item 2 (6 pts). Explique les causes des résistances populaires au Dahomey pendant la Première Guerre mondiale.`, r:`Travaux forcés, réquisitions, portage, impôts, taxes, enrôlement ; abus de l'administration (3 × 2 pts).`},
  {q:`Item 3 (6 pts). Présente brièvement les résistances de Kaba et des Saxwè.`, r:`Kaba : guérilla 1916-1917 dans l'Atacora, massacre à Data Ouri (3 pts). Saxwè : mobilisation 1916, insurrection de juillet 1918, mort de l'administrateur Grange, échec en 1919 (3 pts).`},
  {q:`Item 4 (4 pts). Rédige 6 lignes pour dire quelles leçons les jeunes Béninois peuvent tirer des résistances et de leur échec.`, r:`Barème : consigne (1 pt), arguments (2 pts), langue (1 pt). Idées : l'union est indispensable ; il faut moderniser l'armée et l'économie ; défendre la souveraineté ; honorer la mémoire des héros.`}
 ]}
]
}
];

const METHODES = [
 {t:`Dissertation (format BEPC)`, s:[`Introduction en un seul bloc : préambule (contexte ou cadre, une ou deux phrases), problématique sous forme affirmative, puis annonce du plan, soit sous forme affirmative (« Notre devoir consistera à… »), soit sous forme de questions qui reprennent les consignes.`,`Corps : un grand paragraphe par consigne, relié au suivant par une phrase de transition.`,`Conclusion : bilan des idées développées, puis ouverture affirmative ou interrogative.`,`Pas de tirets ni de listes dans la rédaction.`]},
 {t:`Explication de texte (format BEPC)`, s:[`Introduction : « Le texte que nous avons à expliquer… », avec la source (sans recopier mécaniquement les références), puis l'idée générale (thème + ce que l'auteur en dit) introduite par « Il met en exergue… », « Il met en relief… », « Il aborde… » ou « Il insiste sur… ».`,`Corps : une seule partie qui répond à la consigne 2, appuyée sur au moins trois extraits mis entre guillemets.`,`Conclusion : en Histoire, l'intérêt du texte ; en Géographie, ton opinion justifiée par des arguments.`]},
 {t:`Répondre à une question de cours`, s:[`Lis la consigne et repère le verbe : définis, cite, décris, explique, présente.`,`Réponds par une phrase complète qui reprend les termes de la question.`,`Donne le nombre d'éléments demandés, avec dates, lieux et noms précis.`,`Relis-toi : orthographe, noms propres, dates.`]},
 {t:`Étudier un document`, s:[`Identifie : nature, auteur, date, source.`,`Résume l'idée générale en une phrase.`,`Relève les informations demandées avec tes propres mots (cite entre guillemets seulement si on te le demande).`,`Mets le document en relation avec ce que tu sais du cours.`]},
 {t:`Rédiger un texte argumenté (situation d'évaluation)`, s:[`Souligne les mots clés de la consigne.`,`Rédige une courte introduction (contexte).`,`Développe 2 ou 3 arguments, chacun avec un exemple tiré du cours.`,`Conclus par une prise de position claire et respectueuse.`]},
 {t:`Gérer son temps à l'examen`, s:[`Lis tout le sujet avant de commencer.`,`Répartis le temps selon le barème de chaque item.`,`Traite d'abord ce que tu maîtrises.`,`Garde cinq minutes pour la relecture.`]},

const SALT="HG3E-BJ-2026";
function cyrb53(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){let ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}

function sget(k){try{const v=localStorage.getItem(k);return v===null?(mem[k]??null):v}catch(e){return mem[k]??null}}
function sset(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}

/* ===== Activation : un code = un téléphone ; accès illimité une fois le code saisi ===== */
const SERVER_URL=(typeof window!=="undefined"&&window.HG3E_SERVER?String(window.HG3E_SERVER):"").trim();
function normCode(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
function formatOk(c){const n=normCode(c);return n.length===10&&n.slice(0,2)==="3E";}
function codeValide(c){if(!formatOk(c))return false;return HASHES.has(cyrb53(SALT+normCode(c),7).toString(36));}
function deviceId(){let d=sget("dev3e");if(!d){const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256)}d=Array.from(a,x=>x.toString(16).padStart(2,"0")).join("");sset("dev3e",d);}return d;}
function acces(){const a=jget("acces3e",null);if(!a||!a.code)return false;if(SERVER_URL)return true;return codeValide(a.code);}
function accesFin(){return null;}
function messageRefus(raison){
  const c=" Contacte "+OWNER.nom+" au "+OWNER.tel+".";
  if(raison==="autre_appareil")return "Ce code est déjà utilisé sur un autre téléphone : il ne fonctionne que sur le téléphone où il a été activé pour la première fois."+c;
  if(raison==="expire")return "Ce code n'est plus valide."+c;
  if(raison==="inactif")return "Ce code doit être activé de nouveau."+c;
  return "Code incorrect. Vérifie-le."+c;
}
async function appelServeur(action,n){
  const r=await fetch(SERVER_URL+(SERVER_URL.indexOf("?")>-1?"&":"?")+"action="+action+"&code="+encodeURIComponent(n)+"&dev="+encodeURIComponent(deviceId()));
  return await r.json();
}
async function activerCode(c){
  const n=normCode(c);
  if(!formatOk(n))return{ok:false,msg:messageRefus("inconnu")};
  if(!SERVER_URL){ /* mode local : pas de limite d'appareil */
    if(!codeValide(n))return{ok:false,msg:messageRefus("inconnu")};
    sset("acces3e",JSON.stringify({code:n,debut:Date.now(),fin:null}));
    return{ok:true};
  }
  try{
    const j=await appelServeur("activer",n);
    if(j&&j.ok){sset("acces3e",JSON.stringify({code:n,debut:j.debut,fin:null}));return{ok:true};}
    return{ok:false,msg:messageRefus(j&&j.raison)};
  }catch(e){return{ok:false,msg:"Connexion impossible. Pour la première activation, une connexion Internet est nécessaire. Réessaie."};}
}
async function reverifier(){
  const a=jget("acces3e",null);if(!a||!SERVER_URL)return;
  try{
    const j=await appelServeur("verifier",a.code);
    if(j&&j.ok){/* accès illimité : la date de fin du serveur est ignorée */}
    else if(j&&j.definitif&&j.raison!=="expire"){sset("acces3e","");render();}
  }catch(e){/* hors ligne : on garde l'accès local jusqu'à l'échéance */}
}

  </div>`;
  const input=$("#code");
  input.addEventListener("input",()=>{let v=input.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,10);let o=v.slice(0,2);if(v.length>2)o+="-"+v.slice(2,6);if(v.length>6)o+="-"+v.slice(6);input.value=o;});
  const go=async()=>{const b=$("#go");$("#msg").textContent="Vérification…";b.disabled=true;const r=await activerCode(input.value);b.disabled=false;if(r.ok){render();}else{$("#msg").textContent=r.msg;}};
  $("#go").onclick=go;input.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  if(back)$("#bkg").onclick=()=>{back();render();window.scrollTo(0,0);};
}

const BEPC={sa5:"<p class=\"sub\">Histoire · 5 dissertations et 5 explications de texte · format béninois : contexte d'évaluation, tâche, consigne<\/p>\n<div class=\"box\"><b>Rappel.<\/b> <i>Dissertation :<\/i> introduction en un seul bloc (préambule, problématique affirmative, annonce du plan en questions ou sous forme affirmative) ; un paragraphe par consigne, reliés par des phrases de transition en gras ; conclusion (bilan et ouverture) ; ni tirets, ni astérisques dans la rédaction. <i>Explication de texte :<\/i> introduction = source + idée générale introduite par « il met en exergue / en relief… », « il aborde… » ou « il insiste sur… » ; corps = réponse à la consigne 2 appuyée sur au moins trois extraits entre guillemets ; conclusion = en Histoire, l'intérêt du texte. Les textes sont des textes d'entraînement : à l'examen, la source figure sous le texte, ne l'invente jamais.<\/div>\n<div class=\"box rule\"><b>Attention aux dates.<\/b> Les dates exactes de certains combats varient d'une source à l'autre. Retiens d'abord celles de la fiche : Adoua le 1er mars 1896, capture de Samory en 1898, reddition de Béhanzin le 25 janvier 1894, Bon Nuki le 8 novembre 1897, Ariyo le 31 décembre 1897, mort de Bio Guéra le 17 décembre 1916.<\/div>\n\n<h2 id=\"s1\"><span class=\"badge\">Sujet 1<\/span>Dissertation · Samory Touré et sa résistance<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre de la semaine culturelle de ton lycée, ton professeur te demande de présenter la résistance de Samory Touré à la conquête française.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir de tes savoirs construits, présente une analyse cohérente de la résistance de Samory Touré.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente l'empire de Samory Touré et son armée.<\/li><li>Décris les stratégies utilisées dans sa résistance.<\/li><li>Explique les causes de son échec.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Au XIXe siècle, alors que les Européens se lancent à la conquête de l'Afrique, plusieurs souverains organisent la résistance. Parmi eux figure Samory Touré, chef de l'empire mandingue de l'Ouassoulou. Sa résistance, longue de sept ans, a opposé son armée disciplinée aux troupes françaises et s'est soldée par un échec. Quel était son empire, quelles stratégies a-t-il employées et pourquoi a-t-il été vaincu ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Issu d'une famille modeste, converti à l'islam, Samory Touré constitue en peu de temps un vaste empire en pays mandingue. Il s'étend sur les territoires actuels du Mali et de la Guinée, limité au nord par le fleuve Niger, au sud par le Liberia, à l'est par le royaume de Sikasso et à l'ouest par le Fouta Djalon. Grand chef d'État, il rend une justice sévère, développe l'instruction et organise l'administration. Son armée compte environ quinze mille hommes, équipés au début d'armes traditionnelles puis, à partir de 1876, d'armes plus modernes ; elle est entraînée, disciplinée, et divisée en infanterie et en cavalerie. <b>Avec cette armée, Samory a mené une longue résistance.<\/b><\/p>\n<p>Pour s'opposer aux Français, il divise ses troupes en trois groupes afin de défendre son territoire, évacue les populations, conquiert un nouveau territoire à l'est et met en place une stratégie originale pour résister à l'artillerie française. Il pratique la guérilla, les affrontements armés et surtout la tactique de la terre brûlée, qui consiste à harceler l'ennemi et à faire le vide devant lui. Il recourt aussi à la diplomatie, par des négociations et des traités. Cette guerre dure sept ans, de 1891 à 1898. <b>Malgré ces moyens, la résistance de Samory a échoué.<\/b><\/p>\n<p>L'échec s'explique par la supériorité militaire des troupes françaises et par leur artillerie, par la division des Africains, car Kong appuie les Français contre Samory,
