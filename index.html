n du continent. Quelles sont les causes de l'impérialisme, comment les Européens ont-ils pénétré en Afrique et quel jugement porter sur les conséquences de la colonisation ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les causes de l'impérialisme européen en Afrique sont nombreuses. Les causes morales et scientifiques avancées par les Européens étaient d'imposer la paix en mettant fin aux guerres tribales et aux razzias esclavagistes, d'apporter la science et la médecine, de propager le christianisme et la civilisation européenne, et d'explorer le continent pour en établir la carte. Les causes politiques tenaient à l'idée que la puissance d'une nation dépendait des territoires qu'elle possédait hors d'Europe, et à la pression de groupes de presse favorables à l'expansion. Les causes stratégiques étaient le contrôle des routes maritimes, comme le canal de Suez, grâce à des bases navales et des dépôts de charbon. Les causes sociales poussaient l'Europe à envoyer son surplus de population vers des terres jugées vacantes. Les causes économiques étaient la recherche de débouchés, de matières premières (coton, caoutchouc, arachide, huile de palme, minerais) et de zones commerciales exclusives. <b>Pour atteindre ces buts, les Européens ont employé des méthodes précises.<\/b><\/p>\n<p>La conquête a d'abord été préparée par les explorateurs, dont les missions ont déblayé le chemin des conquérants. Elle s'est ensuite déroulée selon le système des « 3M ». Les missionnaires pacifiaient et évangélisaient les peuples, les préparant à accepter la conquête. Les marchands installaient des comptoirs sur les côtes, faisaient de la reconnaissance et signaient avec les rois des traités d'amitié qui se transformaient vite en traités de protectorat. Les militaires, enfin, protégeaient les comptoirs et écrasaient les résistances. La Conférence de Berlin, tenue du 15 novembre 1884 au 26 février 1885, a accéléré et réglementé cette ruée en imposant notamment l'occupation effective des territoires. <b>Ces méthodes ont eu de lourdes conséquences que nous allons apprécier.<\/b><\/p>\n<p>Pour nous, la colonisation a été plus un frein qu'un atout pour l'Afrique. Certes, elle a apporté des routes, des voies ferrées, des écoles, des centres de santé, formé les premiers intellectuels et fait reculer des maladies. Mais elle a aussi balkanisé le continent sur des bases artificielles, détruit les structures politiques traditionnelles, imposé impôts, travaux forcés et portage, pillé les ressources et fait reculer les cultures vivrières au profit des cultures d'exportation. Elle a enfin dévalorisé les cultures africaines. L'Europe en a tiré l'essentiel des profits, alors que l'Afrique en traîne encore les séquelles.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Au total, motivés par des raisons morales, politiques, stratégiques et surtout économiques, les Européens ont conquis l'Afrique par les explorateurs et le système des 3M. Leur domination a plus lésé l'Afrique qu'elle ne l'a servie, et pose aujourd'hui la question de la réalité des indépendances et du développement du continent.<\/p>\n<\/div><\/details>\n\n<h3>Sujet 2 · Explication de texte<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Les nouveaux rapports entre l'Europe et l'Afrique à partir de la seconde moitié du XIXe siècle ont engendré des rivalités qui ont conduit les puissances européennes à s'entendre à Berlin : c'est la Conférence de Berlin.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Pour montrer ta compréhension de cette conférence, tu es convié(e) à expliquer le texte suivant en t'appuyant sur la consigne qui l'accompagne.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Au XIXe siècle, les Européens s'implantent en Afrique et s'engagent dans une véritable « course aux colonies ». Dans le sillage des congrès du XIXe siècle (Vienne 1815 ; Paris 1856 ; Berlin 1878), la conférence de Berlin de 1885 réunit les représentants de 14 pays : 12 pays européens, l'Empire ottoman et les États-Unis. Il s'agit de réduire les tensions entre puissances qui désormais concernent l'Afrique, plus particulièrement la question du commerce dans le bassin du Congo, et de fixer les « règles » de la colonisation du continent. La conférence ne débouche pas sur le partage de l'Afrique mais en devient le symbole. Dans les années qui suivent, la colonisation s'accélère et les Européens retracent les frontières du continent.<\/div>\n<p class=\"src\">Source : site internet de l'académie de Paris (ac-paris.fr), page « La conférence de Berlin 1884-1885 », consulté le 26/04/2021 à 14 h 32.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente la source et l'idée générale du texte.<\/li><li>Décris les causes et les conséquences de la Conférence de Berlin de 1885.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est tiré du site internet de l'académie de Paris, de la page intitulée « La conférence de Berlin 1884-1885 », consultée le 26 avril 2021 à 14 h 32. Il met en relief les causes et les conséquences de la Conférence de Berlin tenue de novembre 1884 à février 1885.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Pour l'auteur, « les Européens s'implantent en Afrique et s'engagent dans une véritable course aux colonies ». Au XIXe siècle, l'Europe retrouve en effet un grand intérêt pour l'Afrique : c'est le début de l'impérialisme. Cette course provoque des rivalités : entre la France et l'Italie en Tunisie (1881), entre la France et l'Allemagne au Maroc, entre la France et l'Angleterre à propos du canal de Suez et sur les côtes du golfe de Guinée. Il y a aussi la question du « commerce dans le bassin du Congo » : la France y est présente grâce au traité de protectorat signé par Pierre Savorgnan de Brazza avec Makoko, roi des Batéké ; la Belgique, par Stanley, agit pour le compte de Léopold II ; le Portugal revendique un droit historique sur le bassin. L'Allemagne, venue tard dans la conquête, veut aussi sa part. Pour « réduire les tensions entre puissances », le chancelier allemand Otto von Bismarck convoque la conférence ; il s'agit aussi de « fixer les règles de la colonisation du continent » : entente sur les modalités d'occupation et rejet de tout conflit armé entre puissances en terre africaine. Parmi les règles figurent la liberté de navigation et de commerce sur le Congo et le Niger et l'obligation d'une occupation effective, notifiée aux autres puissances.<\/p>\n<p>Quant aux conséquences, l'auteur précise que « la conférence ne débouche pas sur le partage de l'Afrique mais en devient le symbole ». Elle n'a pas partagé le continent, mais elle a été l'élément précurseur et déterminant de son morcellement. Ensuite, « la colonisation s'accélère » : c'est la ruée européenne sur l'Afrique, suivie de la colonisation et de l'exploitation systématique du continent. Enfin, « les Européens retracent les frontières du continent » : l'Afrique est divisée sur le papier, sans tenir compte des réalités sociologiques, d'où la balkanisation et l'existence de frontières artificielles. Les Africains, absents de la conférence, en ont subi les conséquences.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre les causes et les conséquences de la Conférence de Berlin de 1884-1885.<\/p>\n<\/div><\/details>\n\n<div class=\"box key\"><div class=\"t\">Banque d'arguments (BEPC 2010, 2020, 2021)<\/div>\n<p><b>Causes de Berlin :<\/b> rivalités France/Angleterre sur les côtes du golfe de Guinée (1880) ; France/Italie en Tunisie (1881) ; France/Angleterre pour le canal de Suez (Égypte, jusqu'en 1882) ; tensions entre France, Belgique et Portugal autour du bassin du Congo (1884) ; fachoda (Soudan) ; appétit de l'Allemagne, venue tard.<\/p>\n<p><b>Décisions :<\/b> reconnaissance de l'État libre du Congo comme propriété privée de Léopold II ; enclave de Cabinda au Portugal ; liberté de navigation sur les grands fleuves (Congo, Niger) et liberté de commerce dans le bassin du Congo ; lutte contre l'esclavage ; loi de l'hinterland (la puissance installée sur la côte a des droits sur l'arrière-pays) ; notification des prises de possession ; loi de l'occupation effective.<\/p>\n<p><b>Impressions sur les décisions (point de vue) :<\/b> injustice flagrante (Africains non invités) ; égoïsme (décisions dans l'intérêt exclusif des Européens) ; ruse (clauses pour faciliter le partage) ; entente entre Européens pour la conquête ; mesures contre le trafic d'armes pour empêcher les Africains de résister ; lutte contre l'esclavage pour faire croire à un humanisme.<\/p>\n<p><b>Conséquences :<\/b> balkanisation, domination des territoires, dislocation des structures royales, destruction des valeurs morales, exploitation abusive des ressources, ruée sur l'Afrique.<\/p><\/div>\n\n<!-- ============ SA4 ============ -->\n<h2 id=\"sa4\"><span class=\"badge g\">Géographie<\/span>SA4 — La CEDEAO<\/h2>\n<div class=\"box up\"><div class=\"t\">Repères actualisés (octobre 2026)<\/div>\n<p>La CEDEAO, créée à 15 États, compte aujourd'hui <b>12 membres<\/b> : le Burkina Faso, le Mali et le Niger, regroupés dans l'Alliance des États du Sahel (AES), l'ont quittée le 29 janvier 2025. Membres : Bénin, Cap-Vert, Côte d'Ivoire, Gambie, Ghana, Guinée, Guinée-Bissau, Liberia, Nigeria, Sénégal, Sierra Leone, Togo.<\/p>\n<p><b>Conférence :<\/b> président en exercice depuis le 19 juillet 2026 (sommet de Freetown) : Bassirou Diomaye Faye (Sénégal), qui succède à Julius Maada Bio (Sierra Leone). <b>Commission :<\/b> elle a remplacé le Secrétariat exécutif (siège : Abuja) ; le général sénégalais Birame Diop préside la Commission pour 2026-2030 (prise de fonctions le 1er septembre 2026), après Omar Alieu Touray (Gambie). <b>Monnaie unique :<\/b> l'ECO reste un objectif, avec 2027 comme horizon annoncé. <b>Carte brune CEDEAO :<\/b> plus valable pour les ressortissants de l'AES.<\/p>\n<p class=\"tag\">Avant l'examen, vérifier la liste des membres et les dirigeants dans le programme officiel : des suspensions peuvent intervenir selon l'actualité politique.<\/p><\/div>\n\n<h3>Sujet 1 · Dissertation<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation / Tâche<\/span><br>Dans le cadre de ta préparation au BEPC, tu as, à travers des activités de recherche, approfondi tes connaissances sur les regroupements économiques en Afrique de l'Ouest. Tu es convié(e) à utiliser tes savoirs construits pour expliquer le fonctionnement de la CEDEAO.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les étapes de la création de la CEDEAO.<\/li><li>Décris les organes dirigeants de cette organisation.<\/li><li>Donne ton point de vue argumenté sur l'efficacité de l'organe judiciaire de la Communauté.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Après les indépendances, les États ouest-africains ont voulu unir leurs efforts pour se développer, ce qui a donné naissance à plusieurs organisations sous-régionales, dont la Communauté Économique des États de l'Afrique de l'Ouest (CEDEAO). La CEDEAO s'est construite par étapes et fonctionne grâce à des organes dont l'efficacité n'est pas la même. Notre devoir consistera à présenter d'abord les étapes de sa création, ensuite à décrire ses organes dirigeants, enfin à donner notre point de vue sur l'efficacité de son organe judiciaire.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'échec de la plupart des regroupements politiques et économiques créés avant et après les indépendances a motivé la création de la CEDEAO, qui s'est faite par étapes. En 1964, le président libérien William Tubman lance l'idée d'une communauté de l'Afrique de l'Ouest. En 1967, la conférence des chefs d'État d'Accra, au Ghana, en élabore le projet. En 1968, un accord signé à Monrovia, au Liberia, crée un groupe sous-régional. En 1972, les présidents Yakubu Gowon du Nigeria et Gnassingbé Eyadéma du Togo relancent l'idée. Enfin, le 28 mai 1975, le traité de Lagos, au Nigeria, créant la CEDEAO est signé par 15 chefs d'État ; il sera révisé le 24 juillet 1993. <b>Pour fonctionner, la CEDEAO s'est dotée d'organes dont nous allons décrire les principaux.<\/b><\/p>\n<p>La Conférence des chefs d'État et de gouvernement est l'organe suprême ; elle dirige et contrôle la Communauté, détermine ses grandes orientations et se réunit au moins une fois par an. Son président en exercice est, depuis juillet 2026, le président sénégalais Bassirou Diomaye Faye. Le Conseil des ministres regroupe les ministres des affaires étrangères et les ministres concernés par l'ordre du jour ; il assure le bon fonctionnement de l'institution, approuve les programmes et le budget et se réunit deux fois par an. La Commission, installée à Abuja, a remplacé le Secrétariat exécutif : c'est l'organe exécutif, qui met en œuvre les décisions de la Conférence et du Conseil des ministres ; elle est présidée pour 2026-2030 par le général sénégalais Birame Diop. Le Parlement communautaire compte, selon l'Acte additionnel, 115 sièges répartis entre les États (minimum garanti de cinq par État), les députés étant détachés des parlements nationaux pour cinq ans. <b>La Cour de Justice est l'organe judiciaire, dont l'efficacité mérite d'être appréciée.<\/b><\/p>\n<p>Notre point de vue est que la Cour de Justice est efficace sur certains points mais limitée sur d'autres. Elle est indépendante des autres organes, composée de 7 juges nommés pour 4 ans, accessible aux personnes physiques, protège les droits individuels, a rendu de nombreuses décisions et continue d'être saisie. Cependant, elle manque de force exécutoire réelle, des États ne respectent pas ses décisions, certaines décisions sont politisées et la Cour reste peu connue des populations.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>La CEDEAO est née d'un long processus et fonctionne grâce à plusieurs organes, dont la Cour de Justice, au bilan mitigé. Alors que la Communauté est désormais réduite à douze membres, des voies doivent être trouvées pour renforcer l'autorité de ses décisions et préserver l'intégration régionale.<\/p>\n<\/div><\/details>\n\n<h3>Sujet 2 · Explication de texte<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre de la préparation de ton examen, tu as fait des recherches sur la CEDEAO.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Sur la base de ces recherches et de tes connaissances sur la CEDEAO, tu es invité(e) à rédiger une explication du texte suivant, en te conformant à la consigne.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Quand des marchés régionaux se développent grâce à l'intégration économique, davantage de fournisseurs sont attirés vers le marché régional et les entreprises peuvent se spécialiser (…). En outre, l'intégration régionale a des retombées technologiques conduisant à des gains de productivité et à une réduction des coûts de production, ce qui attire d'autres investissements et favorise par conséquent l'accumulation des facteurs de production.<\/div>\n<p class=\"src\">Source : site memoireonline.com, article sur la problématique de l'intégration de l'Afrique face à la multiplicité des organisations sous-régionales, consulté le 26/03/2019 à 12 h.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en mettant l'accent sur la source et l'idée générale.<\/li><li>Explique comment l'intégration économique permet le développement des États.<\/li><li>Donne ton point de vue sur la contribution de la CEDEAO au développement du Bénin.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est tiré du site internet memoireonline.com, d'un article consacré à la problématique de l'intégration de l'Afrique face à la multiplicité des organisations sous-régionales, consulté le 26 mars 2019 à 12 heures. Il met en exergue les avantages de l'intégration économique.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'intégration économique est le processus par lequel plusieurs nations créent un espace économique commun par la suppression des barrières douanières, la libre circulation des personnes, des biens, des capitaux et des idées, et l'adoption de politiques économiques communes. Pour l'auteur, « davantage de fournisseurs sont attirés vers le marché régional et les entreprises peuvent se spécialiser » : on obtient un vaste marché de consommation qui stimule les fournisseurs, favorise la spécialisation des entreprises et facilite les échanges. Il ajoute que l'intégration a « des retombées technologiques conduisant à des gains de productivité et à une réduction des coûts de production » : les entreprises de grande envergure se créent, la production massive revient moins cher et les articles deviennent concurrentiels. Cela « attire d'autres investissements et favorise par conséquent l'accumulation des facteurs de production » : l'espace de libre-échange devient une source de croissance économique. À ces avantages s'ajoutent la diminution de la dépendance des États pauvres vis-à-vis des pays riches, la réduction de l'importance des frontières artificielles, le renforcement des liens par la complémentarité, la création d'ensembles géographiques plus viables, l'accès aux ressources minières, agricoles, énergétiques et touristiques de l'espace communautaire et le poids accru de la communauté dans le commerce mondial.<\/p>\n<p>Quant à la contribution de la CEDEAO au développement du Bénin, nous pensons qu'elle est réelle mais encore limitée. Le Bénin profite du marché ouest-africain, notamment de la proximité du Nigeria, de la libre circulation et des infrastructures routières et énergétiques communautaires. Mais la libre circulation reste entravée par des tracasseries, les performances du pays dans les échanges demeurent faibles et le retrait récent de trois États a réduit la taille de l'espace d'intégration.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>Nous pensons que l'intégration économique est une chance pour le développement et que la CEDEAO doit rendre ses accords réellement opérationnels pour que le Bénin en tire pleinement profit.<\/p>\n<\/div><\/details>\n\n<div class=\"box key\"><div class=\"t\">Banque d'arguments (BEPC 2015, 2018, 2021)<\/div>\n<p><b>Cinq étapes de l'intégration :<\/b> zone de libre-échange (suppression des droits de douane et des restrictions) → union douanière (politique douanière commune vis-à-vis des non-membres) → marché commun (union douanière + libre circulation des personnes, capitaux, biens) → union économique (marché commun + harmonisation des politiques monétaire et budgétaire) → union économique et monétaire (monnaie commune).<\/p>\n<p><b>Objectifs de la CEDEAO et caractéristique correspondante :<\/b> éliminer les barrières douanières → union douanière ; libre circulation des personnes, capitaux et biens → vaste marché commun ; coopération dans tous les domaines → union économique ; harmonisation des politiques économiques → union économique ; création d'une monnaie unique (ECO) → union monétaire.<\/p>\n<p><b>Problèmes du commerce (BEPC 2015) :<\/b> absence d'une véritable politique de commerce intracommunautaire ; insuffisance et manque d'entretien des infrastructures de transport et de communication ; difficultés de libre circulation ; multiplicité des monnaies et non-convertibilité de certaines ; faible industrialisation ; barrières douanières et tracasseries ; non-application des protocoles ; commerce informel anarchique.<\/p>\n<p><b>Efforts de la Communauté :<\/b> transcôtière Lagos-Nouakchott et Transsaharienne Dakar-N'Djamena ; ponts ; programme de libéralisation des échanges ; carte brune ; chèque de voyage CEDEAO ; mécanisme de transit routier inter-États (TRIE) ; télécommunications et services postaux ; Tarif Extérieur Commun ; foires CEDEAO.<\/p>\n<p><b>Action pour rendre ces efforts plus efficaces :<\/b> renforcer les infrastructures, supprimer les obstacles à la libre circulation, réaliser la monnaie commune, appliquer effectivement le Tarif Extérieur Commun, promouvoir l'industrie, harmoniser les politiques fiscales et monétaires.<\/p>\n<p><b>Opinion sur l'intégration :<\/b> la CEDEAO est une opportunité de développement et ses objectifs sont mis en œuvre ; mais difficultés de la libre circulation, de la monnaie unique, conflits, micro-nationalismes et gestion intégrée des potentialités. Il faut rendre les accords opérationnels.<\/p><\/div>\n\n<!-- ============ SA5 ============ -->\n<h2 id=\"sa5\"><span class=\"badge\">Histoire<\/span>SA5 — Les résistances africaines<\/h2>\n\n<h3>Sujet 1 · Dissertation<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pendant la colonisation, plusieurs peuples du Dahomey ont opposé une résistance à l'administration française.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Tu es invité(e) à présenter une analyse cohérente des soulèvements populaires dans la colonie du Dahomey.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les causes des soulèvements populaires dans la colonie du Dahomey.<\/li><li>Décris le soulèvement de Kaba dans l'Atacora.<\/li><li>Donne un avis argumenté sur ce soulèvement.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Après l'échec des résistances des souverains, comme celle de Béhanzin, les populations dahoméennes ont continué à s'opposer à l'administration coloniale française : ce sont les soulèvements populaires. Ces mouvements, dont celui de Kaba dans l'Atacora, traduisent le refus de la domination coloniale par les populations. Quelles sont les causes de ces soulèvements, comment s'est déroulé celui de Kaba et quel avis argumenté peut-on donner à son sujet ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Plusieurs causes sont à l'origine des soulèvements populaires dans la colonie du Dahomey. Il s'agit des pressions administratives, des recrutements militaires obligatoires, du portage et des travaux forcés, de l'impôt de capitation et des pressions fiscales, des mauvais traitements, du dépouillement des chefs traditionnels de leur autorité et de leurs privilèges, de la dislocation des structures sociales, de l'accaparement des bonnes terres, de l'imposition des cultures commerciales et du pillage des ressources. À cela s'ajoutent le contrôle du commerce par les compagnies françaises et l'aliénation culturelle. <b>Parmi ces soulèvements, celui de Kaba mérite d'être décrit.<\/b><\/p>\n<p>Kaba, de son vrai nom Bio Tchayeba, est un Natimba de Kouandé, né vers 1867 à Orou Kayo. Simple cultivateur, plein d'expérience et meneur d'hommes, il jouit d'un grand prestige. En janvier 1916, les populations natimba de l'Atacora, sous sa direction, se soulèvent contre les mauvais traitements de l'administration française, les travaux forcés, le regroupement militaire obligatoire, les impôts et le portage. L'insurrection prend de l'ampleur en février 1917 et atteint Tanguiéta. Les insurgés coupent les fils téléphoniques en cuivre pour fabriquer des pointes de flèche. L'administration est paralysée et la région passe sous le contrôle des insurgés. La guérilla dure jusqu'au 7 avril 1917, date à laquelle Kaba et ses combattants sont massacrés dans la grotte de Datawoory, trahis par les leurs. <b>Ce soulèvement a échoué, mais il appelle un jugement.<\/b><\/p>\n<p>À notre avis, le soulèvement de Kaba est une résistance légitime et courageuse, même s'il a échoué. Il traduit l'attachement à la terre natale, le rejet de l'ordre colonial et l'aspiration à la liberté. Son échec s'explique par l'infériorité technique et militaire et par la trahison, ce qui nous enseigne l'importance de l'union et de la solidarité.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>En somme, de multiples abus coloniaux ont provoqué des soulèvements populaires au Dahomey, dont celui de Kaba, qui a échoué mais demeure un exemple de bravoure. Ces luttes invitent à s'interroger sur la place de ces héros dans la mémoire nationale.<\/p>\n<\/div><\/details>\n\n<h3>Sujet 2 · Explication de texte<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour ta préparation au BEPC, tu as mené des recherches sur les résistances en Afrique de l'Ouest face à l'impérialisme européen.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Tu es convié(e) à expliquer, à partir du texte ci-après, le cas spécifique de Samory Touré.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">En 1891, les colonisateurs accentuèrent leur pression sur l'empire d'Ouassoulou qui s'étendait, pour sa majeure partie, sur le territoire des Républiques actuelles du Mali et de la Guinée. Samory Touré, grand homme politique et capitaine de talent, qui se trouvait à la tête de cet empire, fut pour eux un adversaire plus sérieux qu'Ahmadou. Samory Touré avait sous son commandement une armée de quinze mille (15 000) hommes, qui se distinguaient fort peu des troupes françaises régulières. […] « Conducteur d'hommes, en tout cas, il le fut, possédant l'audace, l'énergie, l'esprit de suite et de prévision, et par-dessus tout une ténacité irréductible, inaccessible au découragement », écrivait l'historien français Albert Sabatier.<\/div>\n<p class=\"src\">Source : http://renaudossavi.mondoblog.org<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Introduis le texte en précisant la source et l'idée générale.<\/li><li>Expose les moyens et stratégies utilisés par Samory Touré dans sa résistance à l'invasion française.<\/li><li>Mets en évidence l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est extrait du site internet http://renaudossavi.mondoblog.org. Il insiste sur les moyens et les stratégies utilisés par Samory Touré, grand résistant mandingue, face à l'invasion française.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Samory Touré se révèle d'abord un « grand homme politique » : grand chef d'État, il rend une justice sévère, développe l'instruction et organise l'administration de son armée. Il a constitué en peu de temps un vaste empire musulman, « l'empire d'Ouassoulou », qui s'étendait « sur le territoire des Républiques actuelles du Mali et de la Guinée », avec Bissandougou pour capitale, limité au nord par le Niger, au sud par le Liberia, à l'est par le royaume de Sikasso et à l'ouest par le Fouta Djalon. Il avait aussi « sous son commandement une armée de quinze mille (15 000) hommes », les sofas, d'abord équipée d'un armement traditionnel puis, à partir de 1876, d'armes modernes achetées ; une armée entraînée, disciplinée, soudée par l'esprit de corps, divisée en infanterie (unités de 10 à 20 hommes) et en cavalerie (colonnes de 50 hommes).<\/p>\n<p>À ces moyens, il associe des stratégies de lutte. Décrit comme un « conducteur d'hommes », il divise ses troupes en trois groupes pour défendre son territoire, aide à l'évacuation des populations, conquiert un nouveau territoire à l'est, se déplace sous escorte et recourt à la guérilla, aux affrontements armés et au corps à corps. Il applique aussi la tactique de la terre brûlée, qui consiste à harceler les Français et à faire le vide devant eux sans abandonner ni hommes ni vivres, et il pratique la diplomatie : négociations et traités, comme ceux de Bissandougou (1886) et de Niako (1889). Cette résistance a duré sept ans, de 1891 à 1898. Samory est finalement capturé par le colonel Gouraud à Guélémou en septembre 1898 et déporté au Gabon, où il meurt en 1900.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre l'organisation militaire de Samory Touré et sa détermination face à l'impérialisme français, un exemple à suivre pour les générations actuelles et futures.<\/p>\n<\/div><\/details>\n\n<div class=\"box key\"><div class=\"t\">Complément fréquemment évalué : Béhanzin (BEPC 2012, 2014, 2015, 2016)<\/div>\n<p><b>Causes de sa résistance :<\/b> amour de la patrie ; perte de Cotonou ; refus de l'aliénation culturelle et de la colonisation ; rejet du protectorat négocié à son insu (Glèlè et Kondo avaient déjà refusé le protectorat proposé par les agents du Portugal à Ouidah) ; droit de chaque peuple à vivre en paix chez soi ; défense de la souveraineté et de l'intégrité du royaume.<\/p>\n<p><b>Organisation :<\/b> armée d'environ 12 000 hommes avec un corps d'élite de femmes guerrières, les Amazones ; mobilisation sociale fondée sur l'idée que « la terre de Houégbadja n'est pas à aliéner » ; corps de renseignement et conseil de guerre, avec le roi comme chef suprême.<\/p>\n<p><b>Première guerre (1890) :<\/b> bataille de Zogbo (1er mars 1890, armée dahoméenne repoussée), combat d'Atchoukpa (avril 1890), puis trêve : cession de Cotonou aux Français contre une redevance annuelle de 20 000 francs, reconnaissance du protectorat français sur Porto-Novo, refus de l'installation française à Ouidah.<\/p>\n<p><b>Deuxième guerre (1892-1894) :<\/b> Dogbo (12 septembre 1892) ; Akpa-Kotokpa (30 septembre 1892) ; Kpokissa (13 octobre 1892) ; Cana (4 novembre 1892) ; entrée des troupes françaises à Abomey (17-18 novembre 1892, après la tactique de la terre brûlée) ; poursuite de la lutte jusqu'à sa reddition le 25 janvier 1894.<\/p>\n<p><b>Leçons de l'échec :<\/b> esprit de coopération, de dialogue et de solidarité ; amour de la patrie ; défense de l'inviolabilité des frontières ; modernisation de l'arsenal militaire ; formation technique des soldats de métier.<\/p>\n<p><b>Autres soulèvements au Dahomey :<\/b> Holli (janvier 1914, siège du poste d'Aba) ; Sahouè de Doutou, dans le Mono (1916 à 1919 : marche sur Bopa en 1916 ; prise de la poudrière de Grand-Popo le 12 juillet 1918 ; lignes télégraphiques Bopa-Lokossa coupées le 14 juillet 1918 ; mort du commandant Grange ; arrivée de troupes de l'AOF venues du Sénégal en octobre 1918 ; défaite des Sahouè en février 1919).<\/p>\n<p><b>Avis argumenté (BEPC 2014 et 2017) :<\/b> même si la résistance de Béhanzin a causé des pertes, elle n'a pas fait plus de mal que de bien : elle a défendu le royaume et le peuple, et affirmé la liberté, la bravoure, la justice et l'indépendance. Le soulèvement des Sahouè traduit l'attachement à la terre natale, le rejet de l'ordre colonial et l'aspiration à la liberté.<\/p><\/div>\n\n<!-- ============ ACTUALISATION ============ -->\n<h2 id=\"maj\">5. Actualisation et points de vigilance<\/h2>\n<div class=\"warn\">\n<ul>\n<li><b>CEDEAO :<\/b> 12 membres depuis le 29 janvier 2025 (et non plus 15) ; organe exécutif : la Commission (et non plus le Secrétariat exécutif) ; président en exercice : Bassirou Diomaye Faye (depuis le 19 juillet 2026) ; président de la Commission : Birame Diop (mandat 2026-2030). Les dirigeants cités dans les anciennes fiches (M. Buhari, M. Kassi Brou) sont dépassés. Le traité de 1975 reste celui de la création, avec une révision en 1993.<\/li>\n<li><b>Bénin :<\/b> Romuald Wadagni, élu le 12 avril 2026, est président de la République depuis le 24 mai 2026 pour un mandat de sept ans ; il a succédé à Patrice Talon. Données démographiques : 10 008 749 habitants en 2013 (la fiche indiquait 9 983 884), environ 15 millions estimés en 2026 (projections de l'ONU). Les ministères et organismes cités dans les fiches sont à vérifier avec leurs appellations actuelles : par exemple, les CARDER et les CeRPA ont été remplacés par les Agences territoriales de développement agricole (ATDA). Parlement de la CEDEAO : 115 sièges prévus par l'Acte additionnel ; l'occupation des sièges du Mali, du Burkina Faso et du Niger est à vérifier.<\/li>\n<li><b>Chiffres économiques :<\/b> les données des fiches (PIB agricole 2011, pétrole offshore, tourbe, forêts) sont anciennes : les reprendre telles quelles dans une copie si elles figurent au programme, mais citer les ordres de grandeur récents en complément (coton, soja, pauvreté).<\/li>\n<li><b>Écarts dans le recueil BEPC :<\/b> la CGT s'appelle « Confédération Générale du Travail » (le corrigé 2019 écrit « Conférence Générale du Travail ») ; le texte de 2017 parle de « plus de 14 000 ha » de teck alors que le corrigé écrit 140 000 ; la date d'entrée des Français à Abomey est donnée au 17 ou au 18 novembre 1892.<\/li>\n<li><b>Sujets d'entraînement :<\/b> ils sont proposés pour la révision ; les corrigés sont des propositions, non des corrigés officiels. En situation d'examen, la source figure sous le texte : ne jamais l'inventer.<\/li>\n<\/ul>\n<\/div>\n<footer>Document préparé à partir de la méthodologie de l'explication de texte, de la technique de la dissertation et du recueil BEPC 2009-2021 fournis.<\/footer>",sa1:"\n<p class=\"sub\">Histoire · 5 dissertations et 5 explications de texte · format béninois : contexte d'évaluation, tâche, consigne<\/p>\n<div class=\"box\"><b>Rappel.<\/b> <i>Dissertation :<\/i> introduction en un seul bloc (préambule, problématique affirmative, annonce du plan en questions ou sous forme affirmative) ; un paragraphe par consigne, reliés par des phrases de transition en gras ; conclusion (bilan et ouverture) ; ni tirets, ni astérisques, ni lignes vides. <i>Explication de texte :<\/i> introduction = source + idée générale introduite par « il met en exergue / en relief… », « il aborde… » ou « il insiste sur… » (ni plan, ni problématique) ; corps = au moins deux citations expliquées ; conclusion = intérêt du texte (Histoire). Les textes marqués « d'entraînement » sont composés d'après la fiche de cours : à l'examen, la vraie source figure sous le texte et ne doit jamais être inventée.<\/div>\n\n<h2 id=\"s1\"><span class=\"badge\">Sujet 1<\/span>Dissertation · Progrès scientifiques et agriculture<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'une exposition sur les découvertes et inventions, ton professeur d'Histoire-Géographie te demande de présenter les progrès scientifiques et techniques des XIXe et XXe siècles.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir de tes savoirs construits, présente une analyse cohérente de ces progrès et de leur impact sur l'agriculture européenne.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Cite quelques découvertes et inventions des XIXe et XXe siècles dans les domaines de la physique, de la chimie et de l'énergie.<\/li><li>Décris les transformations qu'elles ont entraînées dans l'agriculture européenne.<\/li><li>Donne les conséquences négatives de ces transformations sur l'environnement.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Les XIXe et XXe siècles sont marqués en Europe par de spectaculaires progrès scientifiques et techniques. Ces progrès ont bouleversé les activités économiques, en particulier l'agriculture. Quelles sont les principales découvertes et inventions, comment ont-elles transformé l'agriculture et quelles menaces font-elles peser sur l'environnement ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les progrès ont été remarquables dans plusieurs domaines. En physique, les Français Becquerel, Pierre et Marie Curie découvrent la radioactivité et isolent le radium en 1898 ; l'Allemand Röntgen découvre les rayons X en 1895 ; Ohm formule les lois du courant électrique et Einstein élabore la théorie de la relativité. En chimie, le Russe Mendeleïev établit la classification périodique des éléments, l'Anglais Priestley isole l'oxygène, le Français Lebon invente l'éclairage au gaz et l'Allemand Bayer l'aspirine en 1889. Dans le domaine de l'énergie, l'Américain Edison invente la lampe à incandescence, le Belge Gramme découvre la dynamo en 1869, le charbon alimente les machines à vapeur à partir de 1850, le pétrole apparaît en 1859-1860 et permet les moteurs à explosion de Lenoir (1860), de Daimler et Benz (1891) et de Diesel (1893). <b>Ces progrès ont profondément changé l'agriculture.<\/b><\/p>\n<p>L'agriculture européenne s'est modernisée. Elle utilise des machines performantes (tracteurs, batteuses à vapeur, moissonneuses-lieuses, semoirs), des engrais chimiques et naturels, des pesticides, des semences sélectionnées, le greffage, le croisement et des méthodes d'assolement et d'irrigation scientifiques. Elle devient ainsi mécanisée, scientifique, intensive grâce à des rendements élevés, commerciale puisque les produits sont destinés à la vente, et spécialisée car des régions entières choisissent des cultures selon leur climat, leurs sols et le marché. Les populations en tirent une meilleure alimentation, l'abondance des vivres, une hausse de l'espérance de vie et de la population. Mais l'abandon des cultures vivrières au profit des cultures de rente provoque chômage, disette et exode rural. <b>Ces transformations ont aussi un coût pour la nature.<\/b><\/p>\n<p>Sur le plan environnemental, les sols trop travaillés se dégradent et s'érodent, la déforestation et la désertification progressent, et l'usage massif de produits chimiques pollue les sols et les eaux.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>En définitive, les découvertes en physique, en chimie et en énergie ont modernisé l'agriculture européenne, mais au prix du chômage rural et d'atteintes à l'environnement. Ce constat pose la question d'un développement durable, qui concilie progrès et protection de la nature.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s2\"><span class=\"badge\">Sujet 2<\/span>Explication de texte · Le monde rural change<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>L'introduction des découvertes et inventions dans l'agriculture au XIXe siècle a entraîné de nombreuses transformations dans les campagnes européennes.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Tu es invité(e) à produire une explication des changements intervenus dans l'agriculture à partir du texte suivant.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">La machine à vapeur, les moissonneuses et les engrais chimiques ont transformé les campagnes. Les grands fermiers produisent davantage avec moins de bras. De nombreux paysans, devenus inutiles ou ruinés, quittent leurs villages pour travailler dans les usines des villes. Les récoltes sont destinées à la vente plus qu'à la consommation familiale. Mais les sols trop travaillés s'épuisent.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA1.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les changements intervenus dans l'agriculture et leurs conséquences.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 1. Il met en exergue les transformations de l'agriculture européenne au XIXe siècle et leurs conséquences.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Selon l'auteur, « la machine à vapeur, les moissonneuses et les engrais chimiques ont transformé les campagnes ». L'agriculture est en effet devenue mécanisée grâce aux tracteurs, batteuses et moissonneuses-lieuses, et scientifique grâce aux engrais, aux pesticides et à la sélection des semences. Elle est aussi devenue intensive et commerciale : « les récoltes sont destinées à la vente plus qu'à la consommation familiale ». Les grands fermiers voient leurs rendements et leurs revenus augmenter, la nourriture devient abondante et la population s'accroît.<\/p>\n<p>Mais ces changements ont des conséquences négatives. « De nombreux paysans, devenus inutiles ou ruinés, quittent leurs villages » : c'est le chômage rural et l'exode vers les villes, où ils forment la main-d'œuvre des usines et deviendront des prolétaires. Les cultures de rente prennent la place des cultures vivrières, d'où la disette dans certaines campagnes. Enfin, comme le dit le texte, « les sols trop travaillés s'épuisent » : érosion, dégradation des sols et pollution chimique accompagnent cette modernisation.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre les transformations de l'agriculture européenne et leur lien avec la naissance de la classe ouvrière.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s3\"><span class=\"badge\">Sujet 3<\/span>Dissertation · La révolution industrielle<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour préparer un exposé sur la révolution industrielle, tu dois montrer comment l'industrie européenne s'est transformée au XIXe siècle.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter une analyse cohérente de la révolution industrielle en Europe.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les facteurs de la révolution industrielle.<\/li><li>Décris les nouvelles méthodes d'organisation du travail.<\/li><li>Expose les différentes formes de regroupement des entreprises.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>L'industrie européenne a connu aux XIXe et XXe siècles de profondes mutations, regroupées sous le nom de révolution industrielle. Cette révolution a modifié la production, l'organisation du travail et la taille des entreprises. Notre devoir consistera à présenter d'abord les facteurs de la révolution industrielle, ensuite à décrire les méthodes d'organisation du travail, enfin à exposer les formes de regroupement des entreprises.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Plusieurs facteurs expliquent la révolution industrielle : la disponibilité des matières premières, la découverte de nouvelles sources d'énergie (charbon, électricité, pétrole), l'existence d'une main-d'œuvre abondante constituée de paysans ruinés par la mécanisation agricole, l'essor du capitalisme avec les banques, les bourses de valeurs, les actions et les obligations, et enfin la publicité qui stimule la vente. <b>Pour produire plus et à moindre coût, les patrons ont aussi inventé de nouvelles méthodes de travail.<\/b><\/p>\n<p>La taylorisation, inventée par l'Américain Taylor, organise le travail à la chaîne et spécialise chaque ouvrier dans une tâche précise pour éviter les gestes inutiles et les pertes de temps. La standardisation consiste à fabriquer en masse des articles identiques d'un même modèle. La robotisation ou automation remplace l'homme par des machines automatiques, robots ou ordinateurs. <b>Ces méthodes ont favorisé la concentration des entreprises.<\/b><\/p>\n<p>Pour devenir plus performantes et éviter la concurrence, les entreprises se sont regroupées. La concentration géographique rassemble les industries près des matières premières, des sources d'énergie et de la main-d'œuvre. La concentration horizontale associe des entreprises qui fabriquent les mêmes articles pour fixer les prix : c'est le cartel. La concentration verticale fusionne des entreprises complémentaires, de la matière première à la vente : c'est le trust. S'y ajoutent le holding, société financière qui contrôle d'autres entreprises grâce à ses capitaux, et la multinationale, qui exerce ses activités dans plusieurs États par ses filiales.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Ainsi, la révolution industrielle repose sur des facteurs variés et s'accompagne de nouvelles méthodes de travail et de grands regroupements d'entreprises. Elle a apporté des produits abondants et abordables, mais aussi la naissance de classes sociales opposées, ce qui conduit à s'interroger sur le sort des ouvriers.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s4\"><span class=\"badge\">Sujet 4<\/span>Explication de texte · L'usine et le travail à la chaîne<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour comprendre l'évolution de l'industrie au XIXe siècle, ton professeur te propose d'étudier un texte sur les nouvelles méthodes de production.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte et de tes savoirs construits, présente une explication cohérente des nouvelles méthodes de production et de regroupement des entreprises.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Pour produire plus vite et à moindre coût, les patrons organisent le travail à la chaîne : chaque ouvrier répète toute la journée le même geste. Les articles sont tous identiques. En même temps, les grandes entreprises s'associent ou se rachètent pour éviter la concurrence et fixer les prix. Quelques sociétés finissent par dominer le marché.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA1.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les nouvelles méthodes de production et de regroupement évoquées dans le texte.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre analyse est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 1. Il aborde les nouvelles méthodes de production et le regroupement des entreprises au XIXe siècle en Europe.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'auteur affirme que, « pour produire plus vite et à moindre coût, les patrons organisent le travail à la chaîne ». Il s'agit de la taylorisation, méthode inventée par l'Américain Taylor : chaque ouvrier est spécialisé dans une tâche ponctuelle, ce qui évite les gestes inutiles et les pertes de temps. Le texte précise que « les articles sont tous identiques » : c'est la standardisation, c'est-à-dire la production en série d'un modèle appelé standard. À ces deux méthodes s'ajoute l'automation, qui remplace progressivement l'homme par des machines.<\/p>\n<p>Le texte note aussi que « les grandes entreprises s'associent ou se rachètent pour éviter la concurrence et fixer les prix ». Cela correspond à la concentration horizontale, qui donne le cartel, et à la concentration verticale, qui donne le trust. D'autres formes existent : le holding et la multinationale. Le résultat est que « quelques sociétés finissent par dominer le marché », ce qui donne naissance aux empires économiques. Ces évolutions entraînent l'abondance des produits à des prix abordables, mais aussi la surproduction, la mévente et les crises boursières.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est d'un intérêt appréciable parce qu'il nous a permis de mieux comprendre l'organisation de la production industrielle et la concentration des entreprises au XIXe siècle.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s5\"><span class=\"badge\">Sujet 5<\/span>Dissertation · Bourgeoisie et prolétariat<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre de la préparation de ton examen, tu as effectué des recherches sur les transformations sociales en Europe aux XIXe et XXe siècles.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter une analyse cohérente de la naissance de deux classes sociales opposées en Europe.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente la bourgeoisie et le prolétariat.<\/li><li>Compare leurs conditions de vie et de travail.<\/li><li>Explique comment l'opposition entre ces deux classes a donné naissance au mouvement ouvrier.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>La révolution agricole et industrielle a profondément transformé la société européenne : l'aristocratie du XVIIe siècle est remplacée par la bourgeoisie tandis que les paysans deviennent des ouvriers d'usine. Cette évolution a fait naître deux classes sociales aux conditions de vie opposées, dont l'affrontement est à l'origine du mouvement ouvrier. Quelles sont ces deux classes, en quoi leurs conditions diffèrent-elles et comment leur opposition a-t-elle produit le mouvement ouvrier ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>La bourgeoisie est la classe des riches, propriétaires des moyens de production matériels et financiers ; c'est la classe dominante. On distingue la haute bourgeoisie (armateurs, négociants, gros industriels, banquiers), la moyenne bourgeoisie (commerçants, petits industriels, professeurs, médecins) et la petite bourgeoisie (boutiquiers, artisans, employés subalternes). Le prolétariat est la classe des ouvriers : ne possédant que leur force de travail qu'ils vendent aux bourgeois pour survivre, ils forment la classe dominée. <b>Ces deux classes se distinguent fortement par leur mode de vie.<\/b><\/p>\n<p>Les bourgeois sont bien logés, bien soignés et vivent dans le luxe et le confort. Les prolétaires, eux, vivent dans des logements exigus, chers et insalubres, souffrent de sous-alimentation, de tuberculose et d'alcoolisme, et n'ont aucun droit civil, économique ni politique. Au travail, ils subissent des salaires très bas, des journées de 14 à 16 heures, le renvoi en cas de maladie ou de crise, l'absence de congés payés et de retraite, le travail non réglementé des femmes et des enfants et une discipline sévère ; grèves et associations leur sont interdites. <b>Cette inégalité extrême ne pouvait pas durer.<\/b><\/p>\n<p>L'opposition entre ces deux classes provoque inégalités, pauvreté, chômage et troubles sociaux. Les ouvriers prennent conscience de leur misère, de leur nombre et de leur rôle dans la production. Ils s'organisent alors pour défendre leurs intérêts par le syndicalisme, le socialisme et les partis politiques : c'est la naissance du mouvement ouvrier.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>En somme, la bourgeoisie, riche et dominante, s'oppose au prolétariat, pauvre et dominé, et cette opposition est à l'origine du mouvement ouvrier. Les luttes engagées ont transformé durablement le monde du travail, ce qui invite à s'interroger sur leurs résultats.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s6\"><span class=\"badge\">Sujet 6<\/span>Explication de texte · La vie d'un ouvrier<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Les ouvriers d'une usine te demandent de leur expliquer pourquoi leurs ancêtres du XIXe siècle ont commencé à se battre pour leurs droits.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, explique les raisons des luttes ouvrières au XIXe siècle.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">À cinq heures du matin, l'ouvrier est déjà à l'usine. Il y reste jusqu'à huit heures du soir, six jours sur sept, dans un atelier sombre et mal aéré. Son salaire, parfois payé en nature, ne suffit pas à nourrir sa famille. Sa femme et ses enfants travaillent aussi, pour une paie encore plus faible. Malade ou victime d'un accident, il est renvoyé sans aucune indemnité, car il n'existe ni retraite ni assurance. Le soir, il rentre dans un logement humide, exigu et cher.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA1.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les raisons des luttes ouvrières en t'appuyant sur le texte.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 1. Il met en relief les conditions de vie et de travail d'un ouvrier européen au XIXe siècle.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les conditions de travail décrites sont très dures. L'ouvrier « reste jusqu'à huit heures du soir, six jours sur sept » : la journée atteint 14 à 16 heures, sans repos suffisant ni congés payés. Il travaille « dans un atelier sombre et mal aéré », comme le montrent les ateliers mal éclairés de l'époque. Son salaire, « parfois payé en nature », c'est-à-dire selon le truck system, « ne suffit pas à nourrir sa famille ». Le texte ajoute que sa femme et ses enfants travaillent aussi pour une paie plus faible, ce qui renvoie à l'absence de réglementation du travail des femmes et des enfants. Enfin, l'ouvrier est « renvoyé sans aucune indemnité » en cas de maladie ou d'accident, puisqu'il n'existe « ni retraite ni assurance ».<\/p>\n<p>Ses conditions de vie sont tout aussi pénibles : il rentre « dans un logement humide, exigu et cher », ce qui favorise la tuberculose, la sous-alimentation et les vices sociaux. Ces conditions expliquent les luttes ouvrières : privés de droits, sans grève ni association autorisées, les ouvriers prennent conscience de leur misère et s'unissent dans les syndicats pour obtenir la réduction du temps de travail, de meilleurs salaires, la retraite et des assurances.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre les raisons qui ont poussé les ouvriers européens du XIXe siècle à lutter pour leurs droits.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s7\"><span class=\"badge\">Sujet 7<\/span>Dissertation · Syndicalisme, socialisme et partis<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'un exposé de ton club d'Histoire-Géographie, tu dois montrer comment les ouvriers européens se sont organisés pour défendre leurs intérêts.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Présente une analyse cohérente des formes d'organisation du mouvement ouvrier au XIXe siècle.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Définis le syndicalisme et décris ses deux formes.<\/li><li>Distingue le socialisme utopique du socialisme scientifique.<\/li><li>Présente le rôle des partis politiques ouvriers.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>La misère née de la révolution industrielle a poussé les ouvriers européens à s'organiser. Ils ont adopté trois grands modes d'action : le syndicalisme, le socialisme et les partis politiques. Notre devoir consistera à définir d'abord le syndicalisme et à décrire ses formes, ensuite à distinguer les deux socialismes, enfin à présenter le rôle des partis politiques.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Le syndicalisme est un mouvement qui regroupe les travailleurs d'une même corporation pour défendre leurs intérêts moraux, sociaux et matériels face au patronat, par des négociations et des grèves. Il connaît deux formes. Le syndicalisme révolutionnaire recourt à des actions violentes comme la grève générale, le sabotage, le boycott ou les casses ; l'exemple est la Confédération Générale du Travail (CGT), créée en France en 1896. Le syndicalisme réformiste ou modéré cherche une amélioration progressive des conditions de vie et de travail par des moyens pacifiques, la négociation et le dialogue ; l'exemple est celui des Trade Unions en Angleterre. <b>À côté des syndicats, une doctrine voulait changer la société en profondeur : le socialisme.<\/b><\/p>\n<p>Le socialisme est une doctrine qui cherche à établir une société plus juste et égalitaire en supprimant les inégalités sociales. Le socialisme utopique dénonce le capitalisme et ses effets désastreux et préconise une société égalitaire par des moyens irréalistes ; ses penseurs sont Owen, Saint-Simon, Fourier, Proudhon et Louis Blanc. Le socialisme scientifique ou marxiste invite les ouvriers à compter sur eux-mêmes et à recourir à la lutte, parfois violente, pour supprimer les inégalités ; ses défenseurs sont Karl Marx, Friedrich Engels et Lénine. <b>L'influence de ces idées a conduit à la création de partis.<\/b><\/p>\n<p>Les partis politiques regroupent des personnes qui cherchent à organiser ou à exercer le pouvoir de l'État. Sous l'influence du socialisme sont nés des partis socialistes réformistes, comme le Labour Party en Angleterre et la social-démocratie en Allemagne, et des partis révolutionnaires, comme la SFIO en France. Ils portent les revendications ouvrières jusqu'au parlement.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Au total, les ouvriers se sont organisés en syndicats révolutionnaires ou réformistes, ont inspiré deux socialismes et ont fondé des partis qui portent leurs revendications. Ces diverses formes d'action ont permis des acquis importants, dont la portée dépasse l'Europe.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s8\"><span class=\"badge\">Sujet 8<\/span>Explication de texte · Deux syndicalismes<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Lors d'une journée consacrée aux droits des travailleurs, ton professeur te demande d'expliquer comment les syndicats ont mené leurs luttes en Europe.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Sur la base du texte ci-après et de tes savoirs construits, explique les formes du syndicalisme et leurs résultats.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">En France, la CGT, créée en 1896, appelle à la grève générale et au sabotage pour obtenir satisfaction. En Angleterre, les Trade Unions préfèrent la négociation avec le patronat et obtiennent peu à peu de meilleurs salaires. Dans les deux cas, les travailleurs ont compris que l'union fait la force.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA1.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les formes de syndicalisme évoquées et leurs résultats.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 1. Il insiste sur les deux formes de syndicalisme utilisées par les ouvriers européens au XIXe siècle.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Le texte présente d'abord le syndicalisme révolutionnaire : « en France, la CGT, créée en 1896, appelle à la grève générale et au sabotage ». Cette forme vise un changement radical de la société et utilise des actions violentes comme les grèves générales, le boycott, le sabotage des outils de travail, les casses et les voies de fait. Elle s'est développée en France, en Italie et en Espagne. Face à la violence, le patronat et l'État cèdent parfois, mais la répression est aussi sévère.<\/p>\n<p>Il présente ensuite le syndicalisme réformiste : « en Angleterre, les Trade Unions préfèrent la négociation avec le patronat et obtiennent peu à peu de meilleurs salaires ». Cette forme modérée cherche à améliorer progressivement les conditions de vie et de travail par le dialogue, les négociations et des grèves pacifiques. Elle a donné naissance au Labour Party et s'est aussi développée aux États-Unis avec l'American Federation of Labour. Dans les deux cas, comme l'écrit l'auteur, « les travailleurs ont compris que l'union fait la force » : leurs luttes ont abouti à la réduction du temps de travail, à l'augmentation des salaires, aux congés payés et à la sécurité sociale.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre les différences entre syndicalisme révolutionnaire et syndicalisme réformiste, ainsi que la force de l'union des travailleurs.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s9\"><span class=\"badge\">Sujet 9<\/span>Dissertation · Acquis et dialogue social<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion de la fête du 1er mai, ton professeur t'invite à présenter aux élèves l'héritage des luttes ouvrières du XIXe siècle.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter une analyse cohérente des acquis du mouvement ouvrier et de leur portée.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les acquis du mouvement ouvrier relatifs aux conditions de travail.<\/li><li>Présente ses acquis relatifs aux conditions de vie, ainsi que sa portée internationale.<\/li><li>Donne ton avis argumenté sur la nécessité du dialogue social dans un pays comme le Bénin.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Après de longues luttes, les ouvriers européens ont obtenu une amélioration progressive de leurs conditions d'existence. Leur mouvement a eu des échos dans le monde entier et offre des enseignements pour le Bénin. Quels progrès ont-ils obtenus, quelle est la portée de leur combat et quelle leçon en tirer pour le Bénin ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Dans le domaine du travail, les ouvriers ont obtenu la réduction de la journée de travail à 8 à 10 heures selon les pays, l'augmentation progressive des salaires, le droit aux congés payés, l'amélioration des conditions de travail dans les ateliers, la négociation de conventions collectives, le droit de grève, la liberté d'association, la réglementation du travail des femmes et des enfants et l'institution du 1er mai comme fête des travailleurs. <b>Leurs conditions de vie se sont aussi améliorées.<\/b><\/p>\n<p>Ils ont obtenu les allocations familiales, la scolarité obligatoire pour les enfants jusqu'à 12 ans, le suffrage universel et les libertés fondamentales, des représentants au parlement, des caisses de sécurité sociale et, au Royaume-Uni, des lois votées entre 1906 et 1914 créant l'assurance chômage, maladie, vieillesse et invalidité. Le mouvement a aussi une portée internationale : les travailleurs du monde entier peuvent créer des syndicats et choisir leur parti ; les moyens de lutte se sont perfectionnés par des textes et des lois ; une tendance au réformisme et à la négociation s'est affirmée ; et les organisations nationales des pays occidentaux ont formé en 1902 le Secrétariat Syndical International. <b>Ces expériences offrent des enseignements pour le Bénin.<\/b><\/p>\n<p>À notre avis, le dialogue social est nécessaire au Bénin parce que les conflits entre employeurs et travailleurs se règlent mieux par la négociation que par la violence. Il garantit des salaires justes, la protection sociale et la paix dans les entreprises, et il favorise la productivité et le développement.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>En définitive, les luttes ouvrières ont arraché des droits dans le travail comme dans la vie quotidienne, avec un retentissement mondial. Ces droits restent fragiles : leur préservation par le dialogue social est un enjeu actuel, y compris au Bénin.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s10\"><span class=\"badge\">Sujet 10<\/span>Explication de texte · Le Manifeste de 1848<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour montrer ta compréhension des idées socialistes du XIXe siècle, ton professeur te propose d'étudier un texte célèbre.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, explique les idées de ses auteurs.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">L'histoire de toute société jusqu'à nos jours n'a été que l'histoire de luttes de classes. (…) Les prolétaires n'ont rien à y perdre que leurs chaînes. Ils ont un monde à gagner. Prolétaires de tous les pays, unissez-vous !<\/div>\n<p class=\"src\">Source : Karl Marx et Friedrich Engels, Manifeste du Parti communiste, 1848.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les idées des auteurs en t'appuyant sur ce que tu sais des classes sociales et du mouvement ouvrier au XIXe siècle.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est extrait du Manifeste du Parti communiste, écrit par Karl Marx et Friedrich Engels et publié en 1848. Il met en exergue la lutte des classes et l'appel à l'union des prolétaires.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Pour les auteurs, « l'histoire de toute société jusqu'à nos jours n'a été que l'histoire de luttes de classes ». Au XIXe siècle, la révolution industrielle a fait naître deux classes opposées : la bourgeoisie, propriétaire des moyens de production, et le prolétariat, qui ne possède que sa force de travail. La bourgeoisie vit dans le confort tandis que les ouvriers subissent de bas salaires, de longues journées de travail et l'absence de droits. Cette opposition d'intérêts engendre des conflits permanents : les grèves, les sabotages et les manifestations en sont des manifestations.<\/p>\n<p>Marx et Engels, défenseurs du socialisme scientifique ou marxiste, ne se contentent pas de constater cette situation : ils lancent un appel. Selon eux, « les prolétaires n'ont rien à y perdre que leurs chaînes » : leur misère est comparée à des chaînes dont la révolution les libérerait, alors qu'« ils ont un monde à gagner », c'est-à-dire une société plus juste. Le texte s'achève sur le cri « prolétaires de tous les pays, unissez-vous ! ». Pour eux, les ouvriers doivent compter sur eux-mêmes et s'organiser au-delà des frontières pour supprimer les inégalités sociales. Cet appel a inspiré des syndicats et des partis socialistes, et a contribué à la portée internationale du mouvement ouvrier, dont le Secrétariat Syndical International de 1902 est un exemple.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte de Marx et Engels est d'un intérêt historique appréciable parce qu'il nous a permis de mieux comprendre les idées qui ont nourri le mouvement ouvrier et son organisation à l'échelle internationale.<\/p>\n<\/div><\/details>\n\n<footer>Corrigés proposés pour la révision, non officiels. Retour aux résumés et aux méthodes pour les règles de rédaction.<\/footer>"};

}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(i){const qs=shuffle(SA[i].quiz).map(q=>{const idx=shuffle(q.o.map((t,k)=>k));return{q:q.q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a),e:q.e};});S.quiz={sa:i,qs,i:0,sc:0,pick:null,done:false};}
function vQuiz(m){
  if(!S.quiz){const sc=jget("scores3e_v2",{});saList(m,"Quiz","15 questions par SA, correction immédiate."+(Object.keys(sc).length?" Meilleurs scores : "+SA.map(s=>sc[s.id]!==undefined?"SA"+s.id+" "+sc[s.id]+"/"+s.quiz.length:"").filter(Boolean).join(" · "):""),i=>startQuiz(i));return;}
  const q=S.quiz,s=SA[q.sa];
  if(!libre(q.sa)){gate(m,"",()=>{S.quiz=null});return;}
  if(q.done){
    const sc=jget("scores3e_v2",{});if(sc[s.id]===undefined||q.sc>sc[s.id]){sc[s.id]=q.sc;sset("scores3e_v2",JSON.stringify(sc));}
    const msg=q.sc>=7?"Excellent travail !":q.sc>=5?"Bien, continue à réviser les points manqués.":"Relis la fiche de cette SA puis recommence.";
    m.innerHTML=`<div class="card" style="text-align:center"><span class="badge">SA${s.id} · ${esc(s.court)}</span><h2 style="margin:12px 0 4px;font-size:34px">${q.sc} / ${q.qs.length}</h2><p>${msg}</p></div>
    <button class="btn" id="re">Recommencer ce quiz</button><div style="height:10px"></div><button class="btn alt" id="fi">Relire la fiche</button><div style="height:10px"></div><button class="btn alt" id="all">Choisir une autre SA</button>`;
    $("#re").onclick=()=>{startQuiz(q.sa);render();};$("#fi").onclick=()=>{S.tab="fiches";S.sa=q.sa;S.quiz=null;render();window.scrollTo(0,0);};$("#all").onclick=()=>{S.quiz=null;render();};return;
  }
  const c=q.qs[q.i];const pk=q.pick;
  m.innerHTML=`<button class="back" id="bk">‹ Quitter le quiz</button>
  <div class="small">SA${s.id} · question ${q.i+1} sur ${q.qs.length} · score ${q.sc}</div>
  <div class="prog"><i style="width:${(q.i/q.qs.length)*100}%"></i></div>
  <h3 style="font-size:18px;margin:0 0 12px">${esc(c.q)}</h3>
  ${c.o.map((t,k)=>`<button class="opt ${pk!==null?(k===c.a?"good":(k===pk?"bad":"")):""}" data-k="${k}" ${pk!==null?"disabled":""}>${esc(t)}</button>`).join("")}
  ${pk!==null?`<div class="box"><b class="ui">${pk===c.a?"Bonne réponse. ":"Mauvaise réponse. "}</b>${esc(c.e)}</div><button class="btn" id="nx">${q.i+1<q.qs.length?"Question suivante":"Voir mon score"}</button>`:""}`;
  $("#bk").onclick=()=>{S.quiz=null;render();};
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(q.pick!==null)return;q.pick=+b.dataset.k;if(q.pick===c.a)q.sc++;render();});
  const nx=$("#nx");if(nx)nx.onclick=()=>{q.pick=null;q.i++;if(q.i>=q.qs.length)q.done=true;render();window.scrollTo(0,0);};
}

function vReviser(m){
  const s=SA[S.fcSa];const f=s.fc[S.fcI];
  if(!libre(S.fcSa)){gate(m,`<h2 class="sa-title">Réviser</h2><div class="seg">${SA.map((x,i)=>`<button data-i="${i}" class="${i===S.fcSa?"on":""}">SA${x.id}${i>0&&!acces()?" 🔒":""}</button>`).join("")}</div>`,null);m.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.fcSa=+b.dataset.i;S.fcI=0;S.fcShow=false;render();});return;}
  m.innerHTML=`<h2 class="sa-title">Réviser</h2>
  <div class="seg">${SA.map((x,i)=>`<button data-i="${i}" class="${i===S.fcSa?"on":""}">SA${x.id}</button>`).join("")}</div>
  <p class="small">${esc(s.court)} · carte ${S.fcI+1} sur ${s.fc.length}. Touche la carte pour voir la réponse.</p>
  <div class="fc ${S.fcShow?"ans":""}" id="card" role="button" tabindex="0">${esc(S.fcShow?f[1]:f[0])}</div>
  <div class="row"><button class="btn alt sm" id="pv" style="flex:1">Précédente</button><button class="btn sm" id="nx" style="flex:1">Suivante</button></div>
  <h3 style="margin:18px 0 6px;font-size:16px">L'essentiel de la SA${s.id}</h3>
  <div class="card"><ul class="pts">${s.fc.map(x=>`<li><b>${esc(x[0])}</b> ${esc(x[1])}</li>`).join("")}</ul></div>`;
  m.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.fcSa=+b.dataset.i;S.fcI=0;S.fcShow=false;render();});
  const flip=()=>{S.fcShow=!S.fcShow;render();};$("#card").onclick=flip;$("#card").onkeydown=e=>{if(e.key==="Enter"||e.key===" ")flip();};
  $("#nx").onclick=()=>{S.fcI=(S.fcI+1)%s.fc.length;S.fcShow=false;render();};
  $("#pv").onclick=()=>{S.fcI=(S.fcI-1+s.fc.length)%s.fc.length;S.fcShow=false;render();};
}

function vReperes(m){
  if(!acces()){gate(m,"",null);return;}
  const tabs=[["chrono","Chronologie"],["pers","Personnages"],["gloss","Vocabulaire"]];
  m.innerHTML=`<h2 class="sa-title">Repères</h2><div class="seg">${tabs.map(([k,l])=>`<button data-k="${k}" class="${S.repTab===k?"on":""}">${l}</button>`).join("")}</div>
  <div class="card"><table class="t">${REPERES[S.repTab].map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></div>`;
  m.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.repTab=b.dataset.k;render();});
}

function vMethodes(m){
  if(!acces()){gate(m,"",null);return;}
  m.innerHTML=`<h2 class="sa-title">Méthodes</h2>`+METHODES.map((x,i)=>`<details ${i===0?"open":""}><summary>${esc(x.t)}</summary><div class="in"><ul class="pts">${x.s.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></details>`).join("");
}

if("serviceWorker" in navigator){window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}});}
render();reverifier();
</script>
