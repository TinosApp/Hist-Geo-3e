 et par l'épuisement des populations touchées par la terre brûlée. Samory est capturé en 1898 par le capitaine Gouraud à Guélémou, puis exilé au Gabon, où il meurt en 1900.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Grand organisateur et chef de guerre, Samory Touré a résisté pendant sept ans à la conquête française avant d'être vaincu et exilé. Sa ténacité reste un exemple de patriotisme. Quelles leçons les Africains d'aujourd'hui peuvent-ils tirer de son combat ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s2\"><span class=\"badge\">Sujet 2<\/span>Explication de texte · Ménélik II et la victoire d'Adoua<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour préparer un exposé sur les résistances victorieuses en Afrique, ton groupe de travail étudie un texte consacré à l'Éthiopie.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de la résistance de l'Éthiopie à l'impérialisme italien.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">En 1889, le traité d'Uccialli est rédigé en deux langues, et les Italiens y lisent que l'Éthiopie devient leur protectorat, ce que Ménélik II refuse. L'empereur rassemble alors une armée nombreuse et bien équipée, unie autour de lui. Le 1er mars 1896, à Adoua, elle écrase les troupes italiennes. L'Éthiopie conserve ainsi son indépendance et devient un symbole pour tous les Africains.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA5.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les causes de la guerre et les raisons de la victoire éthiopienne.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 5. Il met en relief la résistance de l'Éthiopie de Ménélik II à l'impérialisme italien et la victoire d'Adoua.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>La guerre a pour cause immédiate un désaccord sur le traité : « le traité d'Uccialli est rédigé en deux langues », et les deux versions ne disent pas la même chose. Les Italiens y voient le protectorat de l'Éthiopie, ce que Ménélik II refuse, car il ne veut pas renoncer à la souveraineté de son pays. L'Italie, qui s'est installée en Érythrée, veut imposer sa domination, d'où l'affrontement.<\/p>\n<p>La victoire s'explique par la puissance de l'armée éthiopienne : l'empereur dispose d'« une armée nombreuse et bien équipée, unie autour de lui », avec la bonne connaissance du terrain. Le 1er mars 1896, « à Adoua, elle écrase les troupes italiennes ». Les conséquences sont décisives : « l'Éthiopie conserve ainsi son indépendance et devient un symbole pour tous les Africains », car c'est la grande victoire d'un peuple africain sur une armée européenne.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre les causes et la portée de la victoire d'Adoua et de voir qu'une résistance bien préparée et unie pouvait vaincre l'impérialisme.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s3\"><span class=\"badge\">Sujet 3<\/span>Dissertation · Ménélik II et Adoua<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion de la commémoration de la victoire d'Adoua, ton professeur te demande d'expliquer comment l'Éthiopie a préservé son indépendance.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter une analyse cohérente de la résistance de Ménélik II.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Explique les causes de la guerre entre l'Éthiopie et l'Italie.<\/li><li>Décris la bataille d'Adoua et ses résultats.<\/li><li>Donne ton avis sur la portée de cette victoire pour l'Afrique.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>À la fin du XIXe siècle, l'Italie, venue tard dans la course aux colonies, cherche à s'emparer de l'Éthiopie. L'empereur Ménélik II lui oppose une vive résistance. Cette résistance a abouti à la victoire d'Adoua, qui a préservé l'indépendance de l'Éthiopie et est devenue un symbole pour toute l'Afrique. Notre devoir consistera à expliquer d'abord les causes de la guerre, ensuite à décrire la bataille d'Adoua et ses résultats, enfin à donner notre avis sur la portée de cette victoire.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>La cause immédiate de la guerre est l'interprétation contradictoire du traité d'Uccialli, signé en 1889 entre Italiens et Éthiopiens. Pour les Italiens, ce traité fait de l'Éthiopie un protectorat italien ; Ménélik II refuse cette lecture et dénonce le traité. Derrière ce désaccord se trouvent les ambitions de l'Italie, déjà installée en Érythrée, qui veut conquérir l'Éthiopie pour se constituer un empire colonial. <b>Le désaccord conduit alors à la guerre.<\/b><\/p>\n<p>Le 1er mars 1896, à Adoua, l'armée éthiopienne affronte les troupes italiennes. Elle est nombreuse et bien équipée, unie autour de son empereur et elle connaît bien le terrain. Elle inflige à l'armée italienne une défaite éclatante. Le résultat est que l'Italie doit renoncer à son projet de protectorat et que l'Éthiopie préserve son indépendance. <b>Cette victoire dépasse largement les frontières de l'Éthiopie.<\/b><\/p>\n<p>À notre avis, la victoire d'Adoua a une portée considérable. Elle montre qu'une armée africaine bien organisée, bien équipée et unie peut vaincre une puissance européenne. Elle fait de l'Éthiopie un symbole de la résistance africaine et de la fierté des peuples colonisés. Elle reste pourtant une exception, car presque tous les autres peuples ont été vaincus.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Grâce à l'union de son peuple, à la préparation de son armée et à l'habileté de Ménélik II, l'Éthiopie a préservé son indépendance. Pourquoi cet exemple n'a-t-il pu être suivi ailleurs sur le continent ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s4\"><span class=\"badge\">Sujet 4<\/span>Explication de texte · Le soulèvement de Kaba<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'une journée culturelle consacrée aux résistants du Nord-Bénin, ton professeur t'invite à expliquer un texte sur Kaba.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente du soulèvement de Kaba.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">En 1916, alors que la guerre fait rage en Europe, des habitants de l'Atacora refusent de nouveaux enrôlements, le portage et les travaux forcés. Autour de Kaba, ils mènent une guérilla qui dure jusqu'en 1917. Mal armés, ils sont traqués par les troupes coloniales. Kaba et ses guerriers sont massacrés dans la grotte de Data Ouri, où ils s'étaient réfugiés.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA5.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les causes et le déroulement du soulèvement de Kaba.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 5. Il aborde les causes et le déroulement du soulèvement de Kaba dans l'Atacora pendant la Première Guerre mondiale.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les causes du soulèvement sont précisées dans le texte : en 1916, des habitants de l'Atacora « refusent de nouveaux enrôlements, le portage et les travaux forcés ». Ces charges, aggravées par la guerre, s'ajoutaient aux impôts, aux réquisitions et aux abus de l'administration coloniale. Les populations refusent de partir au front et de servir de main-d'œuvre gratuite.<\/p>\n<p>Le déroulement est ensuite décrit : « ils mènent une guérilla qui dure jusqu'en 1917 », avec des attaques surprises et des replis dans les zones difficiles. Mais, « mal armés, ils sont traqués par les troupes coloniales », dont l'armement est bien supérieur. Le dénouement est tragique : « Kaba et ses guerriers sont massacrés dans la grotte de Data Ouri », ce qui met fin à la résistance, qui échoue militairement.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre les raisons du soulèvement de Kaba, le courage de ses guerriers et le sens de leur sacrifice pour la liberté.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s5\"><span class=\"badge\">Sujet 5<\/span>Dissertation · Béhanzin et la résistance du Danxomè<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour la journée consacrée aux héros nationaux, ton lycée organise un exposé sur le roi Béhanzin.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir de tes savoirs construits, présente une analyse cohérente de la résistance de Béhanzin.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les causes de la résistance de Béhanzin.<\/li><li>Décris ses deux guerres contre la France.<\/li><li>Donne ton avis sur le sort qui lui a été réservé après sa reddition.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>À la fin du XIXe siècle, le royaume du Danxomè, dirigé par le roi Béhanzin, se trouve face à l'expansion coloniale française. Béhanzin refuse de se soumettre. Sa résistance, menée en deux guerres, s'est soldée par sa défaite et par son exil. Pourquoi a-t-il résisté, comment s'est déroulée la lutte et que penser du sort qui lui a été réservé ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Béhanzin a résisté pour plusieurs raisons : l'amour de la patrie, la perte de Cotonou, le rejet du protectorat négocié à son insu, le refus de la colonisation et de l'aliénation culturelle, la défense de la souveraineté et de l'intégrité de son royaume et le droit de chaque peuple à vivre en paix chez lui. <b>Pour défendre ces valeurs, Béhanzin a mené deux guerres.<\/b><\/p>\n<p>La première guerre se déroule en 1890. L'armée danxoméenne est repoussée à Zogbo, mais les Français reculent à Atchoukpa. Une trêve s'ensuit : Cotonou est cédée aux Français contre une redevance annuelle, le protectorat français est reconnu sur Porto-Novo, mais Béhanzin refuse l'installation des Français à Ouidah. La deuxième guerre, de 1892 à 1894, débute par les batailles de Dogbo, de Kpokissa, d'Akpa-Kotokpa et de Cana, où, malgré la vaillance des Amazones, les troupes danxoméennes sont vaincues. Les troupes françaises du général Dodds entrent à Abomey en novembre 1892 ; Béhanzin abandonne la ville en flammes et poursuit la lutte dans la brousse jusqu'à sa reddition, le 25 janvier 1894. <b>Cette défaite a eu de lourdes conséquences pour le roi.<\/b><\/p>\n<p>Béhanzin est exilé à la Martinique, puis en Algérie, où il meurt en 1906. À notre avis, ce sort est injuste : il a été puni pour avoir défendu son peuple et son royaume, sans que l'on tienne compte de son droit à la souveraineté. Son exil l'a éloigné de sa patrie, mais il n'a pas effacé sa mémoire, aujourd'hui honorée comme celle d'un héros.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Pour défendre son royaume, Béhanzin a mené deux guerres avant d'être vaincu et exilé. Son combat demeure un symbole de patriotisme. Comment transmettre aux jeunes générations cet héritage de courage et de fierté nationale ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s6\"><span class=\"badge\">Sujet 6<\/span>Explication de texte · Les soulèvements pendant la Première Guerre mondiale<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'une recherche sur les résistances populaires au Dahomey, tu étudies un texte consacré aux causes des révoltes.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des causes des soulèvements populaires dans la colonie du Dahomey.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Pendant la Première Guerre mondiale, l'administration coloniale du Dahomey exige toujours plus des populations : impôts et taxes, portage, travaux forcés, réquisitions de vivres et enrôlement de jeunes pour le front. Ces abus provoquent des révoltes chez les Holli, les Saxwè, les Wassangari du Borgu et dans l'Atacora. Les troupes coloniales les écrasent, mais le souvenir de ces luttes demeure.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA5.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les causes des soulèvements populaires et leurs résultats.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 5. Il met en exergue les causes et les résultats des soulèvements populaires dans la colonie du Dahomey pendant la Première Guerre mondiale.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Pour l'auteur, « l'administration coloniale du Dahomey exige toujours plus des populations » : la guerre en Europe accroît les besoins de la métropole. Il énumère les exigences : « impôts et taxes, portage, travaux forcés, réquisitions de vivres et enrôlement de jeunes pour le front ». Les populations paient plus, transportent les charges, travaillent sans salaire, livrent leurs récoltes et voient partir leurs enfants, ce qui provoque leur exaspération. S'y ajoutent les mauvais traitements, la dislocation des structures traditionnelles et l'atteinte aux coutumes.<\/p>\n<p>Le texte précise que « ces abus provoquent des révoltes chez les Holli, les Saxwè, les Wassangari du Borgu et dans l'Atacora ». Mais ces soulèvements sont vaincus : « les troupes coloniales les écrasent, mais le souvenir de ces luttes demeure ». Ils échouent donc militairement, avec une lourde répression, mais ils montrent que les populations n'ont jamais accepté la domination coloniale.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre les causes des soulèvements populaires au Dahomey et le sens de ces luttes pour la mémoire nationale.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s7\"><span class=\"badge\">Sujet 7<\/span>Dissertation · Les résistances du Borgu : Saka Yerima et Bio Guéra<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion d'une causerie sur les héros du Nord-Bénin, on te demande de présenter les résistances des princes wassangari du Borgu.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter un texte cohérent sur les résistances de Saka Yerima et de Bio Guéra.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les causes de la résistance de Saka Yerima.<\/li><li>Décris les combats de Bon Nuki et d'Ariyo.<\/li><li>Présente la résistance de Bio Guéra jusqu'à sa mort.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Dans le Borgu, au nord du Dahomey, les princes wassangari ont refusé l'occupation française. Saka Yerima, puis Bio Guéra, ont pris les armes pour défendre leur pays. Ces résistances, menées jusqu'à la mort, ont échoué militairement mais font de leurs auteurs des symboles de patriotisme. Notre devoir consistera à présenter d'abord les causes de la résistance de Saka Yerima, ensuite à décrire les combats de Bon Nuki et d'Ariyo, enfin à présenter la résistance de Bio Guéra jusqu'à sa mort.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Saka Yerima est un prince wassangari du Borgu, né vers 1830. Sa résistance a plusieurs causes : les brutalités des troupes françaises, le pillage et l'incendie, en 1897, de son village maternel de Gbegburu et sa volonté d'empêcher les Français d'entrer à Nikki, la capitale du Borgu. <b>Ces causes l'ont conduit à l'affrontement armé.<\/b><\/p>\n<p>Le 8 novembre 1897, ses guerriers affrontent les troupes françaises à Bon Nuki. Le 31 décembre 1897, un nouveau combat a lieu à Ariyo ; Saka Yerima y trouve la mort avec une centaine de combattants. Il disparaît ainsi sans avoir cédé. <b>D'autres princes wassangari ont poursuivi la lutte, comme Bio Guéra.<\/b><\/p>\n<p>Bio Guéra, également prince wassangari, refuse à son tour l'autorité française et les abus de l'administration coloniale, aggravés pendant la Première Guerre mondiale. Il combat pendant quinze mois, avant d'être tué le 17 décembre 1916 à Baura. Comme Saka Yerima, il paie de sa vie son attachement à la liberté de son peuple.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Saka Yerima et Bio Guéra ont résisté à l'occupation française jusqu'à la mort, à Ariyo et à Baura. Leur sacrifice, bien que vain sur le plan militaire, reste un exemple de courage et de patriotisme. Comment la mémoire de ces héros du Borgu peut-elle être mieux connue de la jeunesse béninoise ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s8\"><span class=\"badge\">Sujet 8<\/span>Explication de texte · Les divisions des Africains<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Au cours d'un travail dirigé sur l'échec des résistances, ton professeur te propose d'expliquer un texte sur les faiblesses internes des sociétés africaines.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des causes internes de l'échec des résistances africaines.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Les royaumes africains ne forment pas un bloc face aux Européens. La traite négrière avait déjà affaibli les États de la côte. Les rivalités entre voisins sont exploitées : Kong appuie les Français contre Samory et Porto-Novo sert de base à la conquête du Danxomè. Certains Africains, acquis aux valeurs occidentales, soutiennent même les troupes coloniales.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA5.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les causes internes de l'échec des résistances africaines.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 5. Il insiste sur les faiblesses internes qui expliquent l'échec des résistances africaines face à la conquête européenne.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'auteur constate d'abord que « les royaumes africains ne forment pas un bloc face aux Européens » : chacun résiste seul, sans coordination, ce qui permet aux colonisateurs de les vaincre un par un. Il rappelle que « la traite négrière avait déjà affaibli les États de la côte » : la perte de populations, les guerres et les dépendances qu'elle a entraînées ont diminué leur capacité de résistance.<\/p>\n<p>Il montre ensuite que les Européens exploitent les divisions : « Kong appuie les Français contre Samory et Porto-Novo sert de base à la conquête du Danxomè ». Les rivalités entre voisins profitent donc à l'envahisseur. Il ajoute enfin que « certains Africains, acquis aux valeurs occidentales, soutiennent même les troupes coloniales », comme guides, informateurs ou soldats.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre le rôle des divisions africaines dans l'échec des résistances et l'importance de l'union pour préserver la souveraineté.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s9\"><span class=\"badge\">Sujet 9<\/span>Dissertation · Pourquoi les résistances ont-elles échoué ?<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion d'un débat sur la souveraineté des États africains, ton professeur te demande de tirer les leçons de l'échec des résistances à la conquête coloniale.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir de tes savoirs construits, présente une analyse cohérente de l'échec des résistances africaines.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente deux causes internes de l'échec des résistances africaines.<\/li><li>Présente deux causes externes de cet échec.<\/li><li>Dis les leçons que tu tires de cet échec pour la sauvegarde de l'intégrité territoriale du Bénin.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Face à la conquête européenne, les souverains et les peuples d'Afrique ont presque tous résisté, mais la plupart ont été vaincus. Cet échec général s'explique par des faiblesses internes aux sociétés africaines et par des atouts décisifs des Européens. Quelles sont les causes internes et externes de cet échec et quelles leçons en tirer pour la sauvegarde de l'intégrité territoriale du Bénin ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les causes internes tiennent d'abord à l'affaiblissement des royaumes côtiers par la traite négrière transatlantique. Elles tiennent ensuite aux divisions entre Africains : Kong appuie les Français contre Samory, et Porto-Novo sert de base à la conquête du Danxomè. S'y ajoute la présence de populations acquises aux valeurs occidentales, qui soutiennent les troupes coloniales. <b>À ces faiblesses s'ajoutent des causes externes.<\/b><\/p>\n<p>Les Européens connaissaient mieux l'Afrique, grâce aux cartes et aux récits des explorateurs et des missionnaires. Ils disposaient surtout d'une supériorité militaire, technique et financière : des armes modernes et de l'artillerie face à des armes souvent traditionnelles, et des moyens financiers que les royaumes africains n'avaient pas. <b>Ces causes permettent de tirer des leçons pour le présent.<\/b><\/p>\n<p>Pour préserver l'intégrité territoriale du Bénin, il faut cultiver l'esprit de coopération, de dialogue et de solidarité entre les citoyens. Il faut aussi cultiver l'amour de la patrie, lutter pour l'inviolabilité des frontières, moderniser l'armée et assurer la formation technique des soldats de métier. Il faut enfin bâtir une économie solide, sans laquelle aucune souveraineté n'est durable.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>L'échec des résistances s'explique par des faiblesses internes et par la supériorité des Européens. Il enseigne l'union, la modernisation et le patriotisme. Comment appliquer aujourd'hui ces leçons pour consolider la souveraineté du Bénin et de l'Afrique ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s10\"><span class=\"badge\">Sujet 10<\/span>Explication de texte · Les leçons des résistances<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour clôturer la semaine consacrée aux résistances, ton professeur te propose d'expliquer un texte sur les enseignements que l'on peut en tirer.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des leçons tirées de l'échec des résistances africaines.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">L'échec de Béhanzin, de Samory et de tant d'autres montre qu'aucun roi ne peut vaincre seul des armées modernes. Pour préserver la souveraineté d'un pays, il faut l'union de ses habitants, des armées modernisées et une économie solide. Mais il faut aussi honorer la mémoire des résistants, dont le courage et le patriotisme sont des exemples pour la jeunesse.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA5.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les leçons à tirer de l'échec des résistances.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 5. Il met en relief les enseignements que l'on peut tirer de l'échec des résistances africaines à la conquête coloniale.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Pour l'auteur, l'échec de Béhanzin, de Samory et d'autres chefs montre qu'« aucun roi ne peut vaincre seul des armées modernes » : la première leçon est donc la solidarité et la coopération entre les peuples. Il affirme ensuite que, pour préserver la souveraineté d'un pays, « il faut l'union de ses habitants, des armées modernisées et une économie solide » : l'union évite les divisions exploitées par l'ennemi, l'armée moderne et bien formée protège le territoire, et l'économie fournit les moyens financiers de la défense.<\/p>\n<p>Le texte ajoute un devoir de mémoire : « honorer la mémoire des résistants », dont « le courage et le patriotisme sont des exemples pour la jeunesse ». Il s'agit de transmettre à la jeunesse l'amour de la patrie et le sens du sacrifice, en commémorant les héros et en enseignant leur histoire.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre les leçons de l'échec des résistances : l'union, la modernisation et le patriotisme sont les conditions de la sauvegarde de la souveraineté.<\/p>\n<\/div><\/details>\n\n<footer>Sujets d'entraînement composés d'après la fiche de cours de SA5, les corrigés du recueil BEPC 2009-2021 et les méthodes officielles. Les corrigés sont des propositions, non des corrigés officiels.<\/footer>",sa4:"<p class=\"sub\">Géographie · 5 dissertations et 5 explications de texte · format béninois : contexte d'évaluation, tâche, consigne<\/p>\n<div class=\"box\"><b>Rappel.<\/b> <i>Dissertation :<\/i> introduction en un seul bloc (préambule, problématique affirmative, annonce du plan en questions ou sous forme affirmative) ; un paragraphe par consigne, reliés par des phrases de transition en gras ; conclusion (bilan et ouverture) ; ni tirets, ni astérisques dans la rédaction. <i>Explication de texte :<\/i> introduction = source + idée générale introduite par « il met en exergue / en relief… », « il aborde… » ou « il insiste sur… » ; corps = réponse à la consigne 2 appuyée sur au moins trois extraits entre guillemets ; conclusion = en Géographie, ton opinion justifiée. Les textes sont des textes d'entraînement : à l'examen, la source figure sous le texte, ne l'invente jamais.<\/div>\n<div class=\"box\"><b>Repères actualisés.<\/b> La CEDEAO, créée à 15 États en 1975, compte aujourd'hui 12 membres : le Burkina Faso, le Mali et le Niger l'ont quittée le 29 janvier 2025. Les anciens corrigés parlent encore de 15 États, du Secrétariat exécutif (remplacé par la Commission) et de dirigeants aujourd'hui dépassés. Depuis le 19 juillet 2026, le président sénégalais Bassirou Diomaye Faye préside la Conférence, et le général Birame Diop dirige la Commission pour 2026-2030. Le Parlement compte 115 sièges selon l'Acte additionnel (minimum garanti de cinq par État) ; l'occupation des sièges de l'AES est à vérifier.<\/div>\n\n<h2 id=\"s1\"><span class=\"badge g\">Sujet 1<\/span>Dissertation · L'intégration économique<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'un club de réflexion sur l'avenir de l'Afrique de l'Ouest, ton professeur te demande d'expliquer ce qu'est l'intégration économique et pourquoi les États la recherchent.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir de tes savoirs construits, présente une analyse cohérente de l'intégration économique.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Définis l'intégration économique.<\/li><li>Présente les cinq niveaux d'intégration économique.<\/li><li>Montre les avantages d'une intégration économique pour les États membres.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Face à l'étroitesse de leurs marchés et à leur dépendance de l'extérieur, de nombreux États du monde choisissent de s'unir pour mieux se développer. L'intégration économique est devenue un moyen privilégié de croissance, qui se construit par étapes et profite aux États membres. Notre devoir consistera à définir d'abord l'intégration économique, ensuite à présenter ses cinq niveaux, enfin à montrer ses avantages pour les États membres.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'intégration économique est un processus par lequel plusieurs États mettent en commun leurs économies et suppriment progressivement les obstacles aux échanges pour former un ensemble économique plus vaste. Elle repose sur un traité, des institutions communes, la libre circulation des biens, des personnes et des capitaux, un tarif extérieur commun et des politiques économiques coordonnées. <b>Cette définition permet de distinguer plusieurs niveaux d'intégration.<\/b><\/p>\n<p>Le premier niveau est la zone de libre-échange, où les droits de douane et les restrictions commerciales sont supprimés entre les membres. Vient ensuite l'union douanière, qui ajoute une politique douanière commune, avec un tarif extérieur commun, vis-à-vis des pays non membres. Le marché commun y ajoute la libre circulation des personnes, des capitaux et des biens. L'union économique harmonise en plus les politiques monétaire et budgétaire. Enfin, l'union économique et monétaire adopte une monnaie unique. <b>Ces niveaux conduisent à des avantages que nous allons présenter.<\/b><\/p>\n<p>L'intégration économique élargit le marché, ce qui augmente les échanges et permet des économies d'échelle, car les entreprises produisent en plus grande quantité et à moindre coût. Elle attire les investisseurs, renforce le poids des États dans les négociations internationales, réduit leur dépendance vis-à-vis des pays riches et diminue l'importance des frontières artificielles. Elle contribue enfin à la paix et à la sécurité par la coopération.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>L'intégration économique, qui va de la zone de libre-échange à l'union économique et monétaire, offre de réels avantages aux États qui la pratiquent. Reste à savoir jusqu'où les États d'Afrique de l'Ouest sont prêts à aller dans cette voie.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s2\"><span class=\"badge g\">Sujet 2<\/span>Explication de texte · Le marché élargi<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour préparer un exposé sur la CEDEAO, ton groupe de travail étudie un texte consacré aux effets d'un grand marché régional.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des avantages d'un marché élargi.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">La CEDEAO réunit des centaines de millions d'habitants. Ce vaste marché attire les investisseurs et permet aux entreprises de produire en grande quantité, donc à moindre coût. Lorsque les droits de douane disparaissent, les produits d'un pays circulent plus facilement dans les autres. Les États pèsent aussi davantage ensemble que séparément dans les négociations commerciales internationales.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA4.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les avantages d'un marché élargi pour les États membres.<\/li><li>Donne ton point de vue sur la contribution de la CEDEAO au développement du Bénin.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 4. Il met en exergue les avantages économiques du vaste marché de la CEDEAO.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Selon l'auteur, « ce vaste marché attire les investisseurs » : une population nombreuse représente une demande importante, ce qui encourage la création d'entreprises. Il précise que le marché permet « de produire en grande quantité, donc à moindre coût » : ce sont les économies d'échelle, qui rendent les produits plus compétitifs et créent des emplois. Il ajoute que « lorsque les droits de douane disparaissent, les produits d'un pays circulent plus facilement dans les autres » : les échanges augmentent et les consommateurs ont plus de choix.<\/p>\n<p>Le texte note enfin que « les États pèsent aussi davantage ensemble que séparément dans les négociations commerciales internationales » : unis, les pays d'Afrique de l'Ouest défendent mieux leurs intérêts face aux grandes puissances économiques. Le marché élargi réduit aussi leur dépendance de l'extérieur et favorise la spécialisation des entreprises.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, la CEDEAO contribue au développement du Bénin : elle lui ouvre un vaste marché, notamment grâce à la proximité du Nigeria, et facilite ses échanges. Mais cette contribution reste limitée par les tracasseries aux frontières et par la faiblesse des infrastructures ; il faut donc les lever pour que le Bénin en profite pleinement.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s3\"><span class=\"badge g\">Sujet 3<\/span>Dissertation · La naissance de la CEDEAO<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion de la journée de l'Afrique, ton lycée organise une série d'exposés sur les organisations sous-régionales. Tu es chargé(e) de présenter la naissance de la CEDEAO.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter une analyse cohérente de la naissance de la CEDEAO.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Explique les raisons de la création de la CEDEAO.<\/li><li>Présente les étapes de sa création jusqu'au traité de Lagos.<\/li><li>Cite quatre objectifs de la Communauté.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Après les indépendances, les États ouest-africains, aux économies petites et dépendantes, ont cherché à unir leurs efforts pour se développer. La CEDEAO est née de cette volonté, au terme d'un processus progressif qui lui a fixé des objectifs précis. Pourquoi a-t-elle été créée, par quelles étapes est-elle passée et quels objectifs poursuit-elle ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>La création de la CEDEAO s'explique d'abord par l'échec de la plupart des regroupements politiques et économiques formés avant et après les indépendances de 1960. Elle répond aussi à l'étroitesse des marchés nationaux, à la faiblesse des économies et à leur forte dépendance de l'extérieur. Les États voulaient mettre en commun leurs potentialités, en s'appuyant sur des ensembles antérieurs comme l'AOF et le Conseil de l'Entente. <b>Cette volonté s'est concrétisée par étapes.<\/b><\/p>\n<p>En 1964, le président libérien William Tubman lance l'idée d'une communauté de l'Afrique de l'Ouest. En 1967, la conférence des chefs d'État d'Accra, au Ghana, en élabore le projet. En 1968, un accord signé à Monrovia, au Liberia, crée un groupe sous-régional. En 1972, les présidents Yakubu Gowon du Nigeria et Gnassingbé Eyadéma du Togo relancent l'idée. Enfin, le 28 mai 1975, quinze chefs d'État signent à Lagos, au Nigeria, le traité créant la CEDEAO, révisé le 24 juillet 1993. <b>Le traité de Lagos a fixé des objectifs à la Communauté.<\/b><\/p>\n<p>Parmi ses objectifs, la CEDEAO vise l'élimination des barrières douanières et commerciales entre les États membres, la libre circulation des personnes, des capitaux et des biens, l'harmonisation des politiques économiques, financières et sociales, la promotion de la coopération et du développement dans tous les domaines et, à terme, la création d'une monnaie unique.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Née d'un long processus et du constat des faiblesses des économies de la sous-région, la CEDEAO s'est donné des objectifs ambitieux d'intégration. Dans quelle mesure ces objectifs ont-ils été atteints depuis 1975 ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s4\"><span class=\"badge g\">Sujet 4<\/span>Explication de texte · Les obstacles aux échanges<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Lors d'une séance de travaux dirigés sur le commerce en Afrique de l'Ouest, ton professeur te propose d'expliquer un texte sur les difficultés rencontrées par les commerçants.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des obstacles aux échanges dans l'espace CEDEAO.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Dans l'espace CEDEAO, un camion de marchandises doit souvent s'arrêter à de nombreux postes de contrôle où les voyageurs et les commerçants subissent des tracasseries. Les routes sont insuffisantes ou mal entretenues, et les monnaies des États sont différentes et parfois non convertibles. Tous ces obstacles renchérissent les produits et découragent le commerce entre pays voisins.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA4.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les obstacles aux échanges décrits dans le texte et leurs conséquences.<\/li><li>Donne ton opinion sur les solutions à apporter.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 4. Il aborde les obstacles qui freinent le commerce entre les États de la CEDEAO.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'auteur décrit d'abord les lenteurs et les contrôles : « un camion de marchandises doit souvent s'arrêter à de nombreux postes de contrôle », où commerçants et voyageurs subissent des tracasseries, parfois des paiements illégaux, malgré la libre circulation prévue par les textes. Il évoque ensuite les infrastructures : « les routes sont insuffisantes ou mal entretenues », ce qui allonge les trajets et augmente les coûts de transport. Il relève enfin l'obstacle monétaire : « les monnaies des États sont différentes et parfois non convertibles », ce qui complique les paiements et oblige à des opérations de change coûteuses.<\/p>\n<p>La conséquence est précisée par le texte : « tous ces obstacles renchérissent les produits et découragent le commerce entre pays voisins ». Les échanges entre États membres restent faibles, le commerce informel se développe de manière anarchique et la Communauté perd une grande partie des gains attendus de l'intégration.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, ces obstacles sont les principales causes de la faiblesse du commerce intracommunautaire. Nous pensons qu'il faut appliquer réellement les protocoles de libre circulation, supprimer les barrages abusifs, construire et entretenir les routes et réaliser la monnaie commune annoncée.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s5\"><span class=\"badge g\">Sujet 5<\/span>Dissertation · La CEDEAO et le Bénin<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion de la journée de l'intégration africaine, un débat est organisé dans ton établissement sur l'apport de la CEDEAO au Bénin et sur les obstacles à une meilleure intégration.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter un texte cohérent sur la CEDEAO et le Bénin.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les avantages que le Bénin tire de son appartenance à la CEDEAO.<\/li><li>Expose les difficultés de l'intégration en Afrique de l'Ouest.<\/li><li>Propose trois actions pour renforcer l'intégration.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Le Bénin compte parmi les États qui ont signé le traité de Lagos en 1975 et fait aujourd'hui partie des douze membres de la CEDEAO. Son appartenance à cette communauté lui offre de réelles opportunités, mais l'intégration reste freinée par de nombreux obstacles. Notre devoir consistera à présenter d'abord les avantages que le Bénin en retire, ensuite à exposer les difficultés de l'intégration, enfin à proposer trois actions pour la renforcer.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Le Bénin profite d'abord d'un vaste marché de plus de 300 millions d'habitants, en particulier de la proximité du Nigeria, géant démographique, ce qui favorise le commerce et le transit par le port de Cotonou. La libre circulation des personnes, prévue par le protocole de 1979, facilite les déplacements des commerçants et des travailleurs. Le pays bénéficie aussi des infrastructures régionales, de la coopération, de l'attrait des investisseurs et de l'action de la Communauté pour la paix et la sécurité. <b>Malgré ces atouts, l'intégration rencontre de sérieuses difficultés.<\/b><\/p>\n<p>Les tracasseries aux frontières et les barrières non tarifaires freinent les échanges. Les routes et les chemins de fer sont insuffisants, les monnaies sont différentes et les politiques économiques mal harmonisées. Les divergences politiques et l'instabilité de certains États compliquent l'application des décisions communes. Le départ du Burkina Faso, du Mali et du Niger, en janvier 2025, a réduit la taille de l'espace d'intégration et a fragilisé la libre circulation. <b>Face à ces difficultés, des actions doivent être engagées.<\/b><\/p>\n<p>Il faut d'abord respecter réellement la libre circulation des personnes et des biens en supprimant les barrages abusifs. Il faut ensuite améliorer les routes et les chemins de fer et harmoniser les politiques économiques pour faciliter les échanges. Il faut enfin soutenir la production locale et former les cadres, afin que chaque État tire profit du marché commun.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>La CEDEAO offre au Bénin un marché, des infrastructures et des occasions de coopération, mais son efficacité dépend de la levée des obstacles. Comment les États peuvent-ils préserver l'unité de la Communauté tout en approfondissant son intégration ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s6\"><span class=\"badge g\">Sujet 6<\/span>Explication de texte · Les efforts d'infrastructure<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre de ta préparation au BEPC, tu as mené des recherches sur les actions menées par la CEDEAO pour faciliter les échanges.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des efforts de la CEDEAO pour faciliter les échanges.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Pour faciliter les échanges, la CEDEAO a lancé la construction de grandes routes comme la transcôtière de Lagos à Nouakchott et la route transsaharienne de Dakar à N'Djamena. Elle a aussi créé la carte brune d'assurance automobile et un mécanisme de transit routier entre les États. Mais ces projets avancent lentement, car les financements sont limités et les règles communes sont mal appliquées.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA4.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les efforts fournis par la CEDEAO et leurs limites.<\/li><li>Donne ton opinion sur les moyens de rendre ces efforts plus efficaces.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 4. Il met en relief les efforts de la CEDEAO pour faciliter les échanges et leurs limites.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'auteur rappelle que la Communauté a lancé « la construction de grandes routes comme la transcôtière de Lagos à Nouakchott et la route transsaharienne de Dakar à N'Djamena » : ces axes relient les pays côtiers et les pays sahéliens et réduisent les coûts de transport. Elle a aussi créé « la carte brune d'assurance automobile », qui évite aux conducteurs de souscrire une assurance dans chaque pays traversé, et « un mécanisme de transit routier entre les États », qui permet aux marchandises de traverser plusieurs frontières avec un seul document. S'y ajoutent d'autres initiatives, comme le tarif extérieur commun, la libéralisation des échanges et les foires commerciales.<\/p>\n<p>Mais le texte souligne que « ces projets avancent lentement » parce que « les financements sont limités et les règles communes sont mal appliquées ». Les États tardent à appliquer les protocoles, les travaux prennent du retard et les contrôles abusifs persistent. Les résultats restent donc inférieurs aux attentes des populations.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, ces efforts sont utiles mais insuffisants. Nous pensons qu'il faut mobiliser davantage de financements, appliquer strictement les règles communes, entretenir les routes existantes et sanctionner les États et les agents qui violent les protocoles.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s7\"><span class=\"badge g\">Sujet 7<\/span>Dissertation · Les institutions de la CEDEAO<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Au cours d'une visite pédagogique, ton lycée te demande de présenter le fonctionnement institutionnel de la CEDEAO à tes camarades.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir de tes savoirs construits, présente une analyse cohérente des institutions de la CEDEAO.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente la Conférence des chefs d'État et de gouvernement et le Conseil des ministres.<\/li><li>Présente la Commission et le Parlement communautaire.<\/li><li>Donne ton point de vue sur l'importance de ces organes pour la vie de la Communauté.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Pour atteindre ses objectifs, la CEDEAO s'est dotée d'institutions chargées de décider, d'exécuter, de représenter les peuples et de dire le droit. Chacun de ces organes y joue un rôle précis, de la Conférence des chefs d'État à la Commission. Quel est le rôle de la Conférence des chefs d'État et du Conseil des ministres, quelles sont les missions de la Commission et du Parlement et quelle importance accorder à ces organes ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>La Conférence des chefs d'État et de gouvernement est l'organe suprême : elle dirige et contrôle la Communauté, détermine sa politique générale et ses grandes orientations, nomme le président de la Commission et se réunit au moins une fois par an. Le Conseil des ministres regroupe les ministres des affaires étrangères et les ministres concernés par l'ordre du jour ; il assure le bon fonctionnement de la Communauté, formule des recommandations à la Conférence, approuve les programmes et le budget et se réunit deux fois par an. <b>Ces deux organes de décision sont relayés par des organes d'exécution et de représentation.<\/b><\/p>\n<p>La Commission est l'organe exécutif ; elle a remplacé le Secrétariat exécutif en 2006 et met en œuvre les décisions de la Conférence et du Conseil des ministres. Son siège est à Abuja, au Nigeria. Le Parlement communautaire est composé de députés détachés des parlements nationaux pour cinq ans, avec un minimum garanti de cinq sièges par État ; il examine notamment les questions relatives aux droits de l'homme et aux libertés fondamentales, à l'énergie et aux télécommunications. <b>Il reste à apprécier l'importance de ces organes.<\/b><\/p>\n<p>Pour nous, ces organes sont indispensables : la Conférence donne l'impulsion politique, le Conseil des ministres prépare et coordonne les décisions, la Commission les applique et le Parlement associe les représentants des peuples. Mais leur efficacité dépend de la volonté politique des États, qui n'appliquent pas toujours les décisions communes, et le Parlement dispose de pouvoirs limités.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Les organes dirigeants et exécutifs de la CEDEAO assurent le fonctionnement de la Communauté, mais leur efficacité reste liée à l'engagement des États. Comment renforcer l'autorité de ces institutions face aux intérêts nationaux ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s8\"><span class=\"badge g\">Sujet 8<\/span>Explication de texte · La libre circulation<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour préparer un exposé sur la libre circulation des personnes en Afrique de l'Ouest, tu étudies un texte consacré à l'application du protocole de 1979.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de la situation de la libre circulation dans la CEDEAO.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Depuis le protocole de 1979, les ressortissants des États membres de la CEDEAO peuvent en principe circuler librement dans l'espace communautaire. Dans la pratique, les voyageurs sont encore arrêtés à de nombreux postes frontaliers, où ils paient parfois des sommes illégales. Cette situation freine le commerce, décourage les voyageurs et affaiblit la confiance dans l'intégration.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA4.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique l'écart entre le principe de libre circulation et la réalité, et ses conséquences.<\/li><li>Donne ton opinion sur les mesures à prendre.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 4. Il insiste sur l'écart entre le principe de libre circulation dans la CEDEAO et sa mise en œuvre.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'auteur rappelle le principe : depuis le protocole de 1979, « les ressortissants des États membres de la CEDEAO peuvent en principe circuler librement dans l'espace communautaire ». La libre circulation est l'une des caractéristiques d'une véritable intégration, car elle permet aux personnes, aux marchandises et aux capitaux de se déplacer sans entrave. Mais la réalité est différente : « les voyageurs sont encore arrêtés à de nombreux postes frontaliers », où les contrôles sont multiples et où l'on réclame parfois de l'argent aux voyageurs.<\/p>\n<p>Les conséquences sont précisées par le texte : « cette situation freine le commerce, décourage les voyageurs et affaiblit la confiance dans l'intégration ». Les produits coûtent plus cher, les délais s'allongent, les commerçants et les travailleurs hésitent à voyager et les populations doutent des bienfaits de la Communauté.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, il faut appliquer réellement les protocoles de libre circulation. Nous pensons qu'il faut supprimer les barrages abusifs, sanctionner les agents qui rançonnent les voyageurs, informer les populations sur leurs droits et harmoniser les documents de voyage.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s9\"><span class=\"badge g\">Sujet 9<\/span>Dissertation · Les faiblesses du commerce dans la CEDEAO<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion d'une foire commerciale organisée dans ta localité, ton professeur te demande d'expliquer pourquoi le commerce entre les États de la CEDEAO reste modeste.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Sur la base de tes savoirs construits, présente une explication cohérente des faiblesses du commerce dans l'espace CEDEAO.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Cite trois problèmes qui freinent le commerce dans l'espace CEDEAO.<\/li><li>Présente trois efforts fournis par la Communauté pour y remédier.<\/li><li>Propose deux actions pour rendre ces efforts plus efficaces.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Créée pour faciliter les échanges entre ses membres, la CEDEAO voit pourtant le commerce intracommunautaire rester modeste. Plusieurs obstacles freinent les échanges, malgré des efforts réels de la Communauté pour les lever. Quels sont les principaux problèmes, quels efforts ont été fournis et quelles actions peuvent les rendre plus efficaces ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Trois problèmes principaux freinent le commerce. Le premier est l'absence d'une véritable politique de développement du commerce intracommunautaire. Le deuxième est l'insuffisance et le manque d'entretien des infrastructures de transports et de communications. Le troisième tient aux difficultés liées à la libre circulation des personnes et des biens : barrières douanières, tracasseries, multiplicité des monnaies et non-application des protocoles. S'y ajoutent le faible développement de l'industrie et un commerce informel anarchique. <b>Face à ces problèmes, la Communauté a pris des initiatives.<\/b><\/p>\n<p>Parmi les efforts fournis, on retient la construction de grands axes routiers comme la transcôtière de Lagos à Nouakchott et la transsaharienne de Dakar à N'Djamena, la mise en place du mécanisme de transit routier inter-États et de la carte brune d'assurance automobile, ainsi que l'adoption du tarif extérieur commun et la libéralisation progressive des échanges. La Communauté organise aussi des foires commerciales. <b>Ces efforts restent cependant insuffisants et doivent être rendus plus efficaces.<\/b><\/p>\n<p>Une première action consiste à supprimer réellement les obstacles à la libre circulation des personnes, des biens et des capitaux : démonter les barrages abusifs, appliquer les protocoles et sanctionner les violations. Une deuxième action consiste à renforcer la construction et l'entretien des infrastructures de transports et de communications, tout en promouvant le développement industriel, pour que les États produisent et échangent davantage entre eux.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Le commerce dans la CEDEAO est freiné par des problèmes structurels, que les efforts de la Communauté n'ont pas encore résolus. Des actions hardies sont nécessaires. Comment convaincre les États de placer l'intérêt communautaire avant leurs intérêts nationaux ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s10\"><span class=\"badge g\">Sujet 10<\/span>Explication de texte · Les monnaies de la CEDEAO<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'un club d'économie de ton lycée, on te demande d'expliquer un texte sur la diversité des monnaies en Afrique de l'Ouest.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des difficultés monétaires de la CEDEAO.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">L'espace CEDEAO compte plusieurs monnaies : le franc CFA dans les États de l'UEMOA, le naira au Nigeria, le cedi au Ghana et d'autres encore. Cette diversité complique les paiements, oblige à des opérations de change coûteuses et décourage les échanges. Les États ont donc décidé de créer une monnaie commune, l'éco, mais ce projet reste à réaliser.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA4.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les difficultés créées par la diversité des monnaies et la solution envisagée.<\/li><li>Donne ton point de vue sur l'utilité d'une monnaie commune.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 4. Il met en exergue les difficultés créées par la diversité des monnaies dans la CEDEAO et le projet de monnaie commune.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'auteur constate que « l'espace CEDEAO compte plusieurs monnaies » : le franc CFA est utilisé dans les États de l'UEMOA, dont le Bénin, le naira au Nigeria, le cedi au Ghana et d'autres monnaies ailleurs. Il en résulte que « cette diversité complique les paiements, oblige à des opérations de change coûteuses et décourage les échanges » : un commerçant doit convertir son argent à chaque frontière, supporte des frais et des risques liés aux variations des taux de change, et certaines monnaies ne sont pas convertibles.<\/p>\n<p>Pour y remédier, le texte précise que « les États ont donc décidé de créer une monnaie commune, l'éco, mais ce projet reste à réaliser ». Cette monnaie unique correspond au dernier niveau de l'intégration économique, l'union économique et monétaire. Sa réalisation suppose des économies comparables et des politiques budgétaires et monétaires harmonisées, ce qui explique les retards.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, une monnaie commune serait utile : elle faciliterait les échanges, réduirait les coûts et renforcerait l'intégration. Nous pensons toutefois qu'elle ne réussira que si les États harmonisent leurs politiques économiques et respectent des règles de discipline budgétaire communes.<\/p>\n<\/div><\/details>\n\n<footer>Sujets d'entraînement composés d'après la fiche de cours de SA4, les corrigés du recueil BEPC 2009-2021 et les méthodes officielles. Les corrigés sont des propositions, non des corrigés officiels.<\/footer>",sa3:"<p class=\"sub\">Histoire · 5 dissertations et 5 explications de texte · format béninois : contexte d'évaluation, tâche, consigne<\/p>\n<div class=\"box\"><b>Rappel.<\/b> <i>Dissertation :<\/i> introduction en un seul bloc (préambule, problématique affirmative, annonce du plan en questions ou sous forme affirmative) ; un paragraphe par consigne, reliés par des phrases de transition en gras ; conclusion (bilan et ouverture) ; ni tirets, ni astérisques dans la rédaction. <i>Explication de texte :<\/i> introduction = source + idée générale introduite par « il met en exergue / en relief… », « il aborde… » ou « il insiste sur… » ; corps = réponse à la consigne 2 appuyée sur au moins trois extraits entre guillemets ; conclusion = en Histoire, l'intérêt du texte (« le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre… »). Les textes sont des textes d'entraînement : à l'examen, la source figure sous le texte, ne l'invente jamais.<\/div>\n\n<h2 id=\"s1\"><span class=\"badge\">Sujet 1<\/span>Dissertation · La Conférence de Berlin<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans la seconde moitié du XIXe siècle, la course à l'Afrique dresse les puissances européennes les unes contre les autres. Pour éviter la guerre entre elles, elles se réunissent à Berlin. Ton professeur te demande de présenter cette conférence à ta classe.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir de tes savoirs construits, présente une analyse cohérente de la Conférence de Berlin.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Évoque les rivalités qui ont précédé la Conférence de Berlin.<\/li><li>Cite cinq décisions prises à cette conférence.<\/li><li>Apprécie le fait que les Africains n'aient pas été invités à Berlin.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>À partir de la seconde moitié du XIXe siècle, l'Europe industrialisée s'intéresse de plus en plus à l'Afrique, ce qui provoque de vives tensions entre les puissances. Pour éviter l'affrontement, le chancelier allemand Bismarck convoque une conférence à Berlin, du 15 novembre 1884 au 26 février 1885. Cette conférence a fixé les règles de la conquête de l'Afrique sans consulter les Africains. Quelles rivalités ont conduit à cette réunion, quelles décisions y ont été prises et que penser de l'absence des Africains ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Plusieurs rivalités ont précédé la conférence. La France et l'Angleterre s'opposaient sur les côtes du golfe de Guinée et à propos du canal de Suez, en Égypte. La France et l'Italie se disputaient la Tunisie en 1881. Autour du bassin du Congo, la France, la Belgique de Léopold II et le Portugal se heurtaient, tandis que l'Allemagne, venue tard dans la conquête, affichait un grand appétit colonial. Pour éviter que ces rivalités ne dégénèrent en guerre, il fallait fixer des règles communes. <b>C'est ce que fit la conférence.<\/b><\/p>\n<p>Parmi ses décisions, on retient la liberté de navigation et de commerce sur les grands fleuves africains, le Congo et le Niger ; la reconnaissance de l'État libre du Congo comme propriété personnelle du roi Léopold II ; l'obligation de notifier aux autres puissances toute prise de possession ; la loi de l'occupation effective, selon laquelle une possession n'est reconnue que si elle est effectivement occupée ; la loi de l'hinterland, qui donne à la puissance installée sur la côte des droits sur l'arrière-pays ; la lutte contre l'esclavage et le maintien de l'enclave de Cabinda au Portugal. <b>Ces décisions ont été prises sans que les Africains y participent, ce qui appelle une appréciation.<\/b><\/p>\n<p>À notre avis, l'absence des Africains est une injustice flagrante : leur continent a été réglementé sans eux, dans l'intérêt exclusif des Européens. Les clauses ont facilité le partage, et la lutte contre l'esclavage a surtout servi à donner aux Européens l'image de bienfaiteurs. La conférence a ainsi ouvert la voie à la balkanisation du continent, à des frontières artificielles et à la destruction de nombreuses structures politiques africaines.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>La Conférence de Berlin est née des rivalités européennes et a fixé les règles de la conquête de l'Afrique en ignorant les Africains. Ses conséquences pèsent encore sur le continent. Comment les États africains peuvent-ils aujourd'hui surmonter l'héritage de ces frontières tracées de l'extérieur ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s2\"><span class=\"badge\">Sujet 2<\/span>Explication de texte · Les causes économiques de l'impérialisme<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour comprendre pourquoi l'Europe s'est lancée à la conquête de l'Afrique, ton groupe de travail étudie un texte consacré aux motivations économiques de cette conquête.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des causes de l'impérialisme européen.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">À la fin du XIXe siècle, les usines européennes produisent plus qu'elles ne peuvent vendre en Europe. Les industriels cherchent donc de nouveaux débouchés, des matières premières comme le coton, le caoutchouc et l'huile de palme, et des terres où placer leurs capitaux. L'Afrique, proche et riche en ressources, devient la cible de cette politique. Les États encouragent cette expansion, car la puissance d'une nation se mesure alors aux territoires qu'elle possède hors d'Europe.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA3.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les causes économiques et politiques de l'impérialisme européen en Afrique.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 3. Il met en relief les motivations économiques et politiques de l'impérialisme européen en Afrique à la fin du XIXe siècle.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Pour l'auteur, « les usines européennes produisent plus qu'elles ne peuvent vendre en Europe » : la révolution industrielle a créé une surproduction. Les industriels cherchent donc « de nouveaux débouchés » pour écouler leurs produits, mais aussi des matières premières comme le coton, le caoutchouc, l'huile de palme et les minerais pour alimenter les usines. Ils recherchent enfin « des terres où placer leurs capitaux » : les banquiers et les investisseurs veulent des placements plus rentables qu'en Europe. L'Afrique, proche et riche, répond à tous ces besoins.<\/p>\n<p>Les causes sont aussi politiques et stratégiques. Selon le texte, « la puissance d'une nation se mesure alors aux territoires qu'elle possède hors d'Europe » : posséder des colonies donne prestige et puissance, d'où la rivalité des États. S'y ajoutent le contrôle des routes maritimes, comme le canal de Suez, et le besoin de terres pour un surplus de population. Les Européens ont aussi invoqué des prétextes humanitaires, comme la fin de l'esclavage, pour justifier la conquête.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre les causes économiques et politiques de la conquête européenne de l'Afrique.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s3\"><span class=\"badge\">Sujet 3<\/span>Dissertation · Notions et causes de l'impérialisme<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Lors d'une séance de révision au CEG, ton professeur demande à chaque élève de présenter l'impérialisme européen en Afrique en commençant par clarifier les notions essentielles.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter un texte cohérent sur l'impérialisme européen en Afrique.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Définis les notions d'impérialisme, de colonisation et de protectorat.<\/li><li>Présente les causes de l'impérialisme européen en Afrique.<\/li><li>Donne ton avis sur la « mission civilisatrice » invoquée par les Européens.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Aux XIXe et XXe siècles, les puissances européennes se sont lancées à la conquête de l'Afrique. Cette expansion, appelée impérialisme, s'explique par des causes variées et s'est justifiée par une prétendue mission civilisatrice. Notre devoir consistera à définir d'abord les notions d'impérialisme, de colonisation et de protectorat, ensuite à présenter les causes de l'impérialisme, enfin à donner notre avis sur la mission civilisatrice.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'impérialisme est la politique d'expansion et de domination d'un État sur d'autres peuples ou territoires. La colonisation est l'occupation et la mise en valeur d'un territoire étranger, et le colonialisme est la doctrine qui la justifie. Un protectorat est un territoire qui garde ses autorités locales, mais dont la défense et les relations extérieures sont contrôlées par une puissance étrangère, alors que la colonie est administrée directement par l'État étranger. <b>Ces notions éclairent les causes de la conquête.<\/b><\/p>\n<p>Les causes économiques et stratégiques sont les plus importantes : placer les capitaux, trouver des matières premières et des débouchés pour les produits des usines, contrôler les routes maritimes. Les causes démographiques poussent l'Europe à chercher des terres pour son surplus de population. Les causes politiques tiennent à la recherche de puissance et de prestige par l'expansion militaire. Les causes humanitaires, enfin, sont avancées comme prétexte : mettre fin à l'esclavage, évangéliser et apporter le progrès. <b>C'est ce dernier argument qu'il convient de juger.<\/b><\/p>\n<p>À notre avis, la mission civilisatrice n'était qu'un prétexte. Si la colonisation a apporté quelques écoles, des routes, des centres de santé, elle a aussi imposé la domination politique, l'impôt, le travail forcé et le pillage des ressources, et elle a dévalorisé les cultures africaines, qui avaient pourtant leurs propres formes d'organisation et de civilisation. L'objectif réel restait l'intérêt économique de l'Europe.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>L'impérialisme européen en Afrique résulte de causes surtout économiques et stratégiques, habillées d'arguments humanitaires. Il a servi l'Europe plus que l'Afrique. Comment les peuples africains ont-ils réagi à cette domination ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s4\"><span class=\"badge\">Sujet 4<\/span>Explication de texte · La « mission civilisatrice »<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'un débat organisé dans ton lycée sur la colonisation, on te demande d'expliquer un texte qui analyse les justifications données par les Européens.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des justifications de la conquête de l'Afrique.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Pour justifier leurs conquêtes, les Européens affirment avoir une mission civilisatrice : mettre fin à l'esclavage et aux guerres entre peuples, soigner, instruire et évangéliser. Mais derrière ces beaux discours, l'objectif réel reste l'exploitation des richesses africaines. Les peuples colonisés ne sont ni consultés ni représentés, et leurs cultures sont présentées comme inférieures.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA3.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les prétextes avancés par les Européens et leurs véritables objectifs.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 3. Il aborde les justifications avancées par les Européens pour conquérir l'Afrique et les objectifs qu'elles cachent.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Selon l'auteur, les Européens affirment avoir une « mission civilisatrice ». Ils prétendent mettre fin à l'esclavage et aux guerres entre peuples, soigner par la médecine, instruire par l'école et évangéliser par les missions chrétiennes. Ces arguments permettaient de présenter la conquête comme un devoir moral auprès de l'opinion européenne et internationale. La lutte contre l'esclavage a d'ailleurs été inscrite parmi les décisions de la Conférence de Berlin.<\/p>\n<p>Mais le texte précise que « l'objectif réel reste l'exploitation des richesses africaines » : trouver des matières premières, des débouchés pour les produits européens et des terres pour les capitaux. Il ajoute que les peuples colonisés « ne sont ni consultés ni représentés », puisque la Conférence de Berlin s'est tenue sans les Africains, et que « leurs cultures sont présentées comme inférieures », ce qui permettait de justifier la domination. Les écoles, les routes et les dispensaires servaient surtout à faciliter l'administration et l'exploitation.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre la distance entre les prétextes humanitaires de la colonisation et ses véritables objectifs économiques et politiques.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s5\"><span class=\"badge\">Sujet 5<\/span>Dissertation · Les formes de colonisation<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans une exposition sur l'Afrique coloniale organisée par ton club d'Histoire-Géographie, tu dois montrer que toutes les puissances n'ont pas colonisé de la même manière.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Présente une analyse cohérente des formes de colonisation européenne en Afrique.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Décris l'administration indirecte pratiquée par la Grande-Bretagne.<\/li><li>Décris l'administration directe pratiquée par la France et son organisation en fédérations.<\/li><li>Cite des possessions belges, portugaises, allemandes, italiennes et espagnoles en Afrique.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Après la Conférence de Berlin, plusieurs puissances européennes se sont partagé l'Afrique. Elles l'ont administrée selon des méthodes différentes, qui ont marqué durablement les territoires concernés. Comment la Grande-Bretagne et la France ont-elles administré leurs colonies, et quelles étaient les possessions des autres puissances ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>La Grande-Bretagne a pratiqué l'administration indirecte, appelée indirect rule. Elle s'appuie sur les chefs traditionnels, qui continuent de gouverner leurs peuples sous le contrôle d'un administrateur britannique. Ce système coûtait moins cher et limitait les révoltes, mais les chefs devaient exécuter les décisions de la puissance coloniale. <b>La France, elle, a choisi une autre méthode.<\/b><\/p>\n<p>La France pratique l'administration directe. Elle place à la tête des territoires des gouverneurs et des commandants de cercle, nommés par la métropole, et supprime ou affaiblit le pouvoir des chefs traditionnels. Sa politique visait d'abord l'assimilation des populations, puis l'association. Ses colonies sont regroupées en fédérations : l'Afrique occidentale française (AOF), dont la capitale est Dakar et dont fait partie le Dahomey, et l'Afrique équatoriale française (AEF), toutes deux dirigées par des gouverneurs généraux. <b>D'autres puissances ont aussi colonisé le continent.<\/b><\/p>\n<p>La Belgique administre directement le Congo belge et le Rwanda-Urundi. Le Portugal possède l'Angola, le Mozambique et la Guinée-Bissau, également administrés directement. L'Allemagne a détenu le Togo, le Cameroun, le Sud-Ouest africain et l'Afrique orientale, perdus après 1918. L'Italie a occupé l'Érythrée, la Somalie et la Libye. L'Espagne a gardé le Sahara espagnol, la Guinée équatoriale et le nord du Maroc.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Britanniques et Français ont appliqué deux systèmes différents, l'un indirect, l'autre direct, tandis que d'autres puissances se partageaient le reste du continent. Quelles traces ces systèmes ont-ils laissées dans l'organisation des États africains actuels ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s6\"><span class=\"badge\">Sujet 6<\/span>Explication de texte · Le pacte colonial<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Ton professeur d'Histoire-Géographie t'invite à étudier l'organisation économique des colonies à partir d'un texte.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente du fonctionnement de l'économie coloniale.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Dans le système colonial, chaque colonie doit fournir à sa métropole les matières premières dont elle a besoin et acheter en retour ses produits manufacturés. Cette règle, appelée pacte colonial, interdit presque tout commerce avec d'autres pays. Les cultures d'exportation comme le coton, l'arachide ou le palmier à huile remplacent peu à peu les cultures vivrières. L'économie des colonies dépend ainsi des besoins de l'Europe.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA3.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique le fonctionnement du pacte colonial et ses conséquences pour l'Afrique.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 3. Il met en exergue le pacte colonial et ses effets sur l'économie des colonies africaines.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'auteur explique que « chaque colonie doit fournir à sa métropole les matières premières dont elle a besoin » : l'Afrique approvisionne les industries européennes en coton, arachide, huile de palme, caoutchouc et minerais. En échange, elle doit « acheter en retour ses produits manufacturés » : elle devient un marché réservé pour les produits de la métropole, tissus, outils et autres articles. C'est le pacte colonial, qui garantit à l'Europe des matières premières bon marché et des débouchés assurés.<\/p>\n<p>Les conséquences pour l'Afrique sont lourdes. D'après le texte, « les cultures d'exportation comme le coton, l
