'arachide ou le palmier à huile remplacent peu à peu les cultures vivrières » : les paysans produisent pour l'exportation au détriment de leur alimentation, avec des risques de disette. Enfin, « l'économie des colonies dépend ainsi des besoins de l'Europe » : c'est l'extraversion de l'économie, sans industrialisation sur place, avec des prix fixés par les acheteurs européens.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre comment le pacte colonial a organisé l'économie des colonies au profit de l'Europe et freiné le développement de l'Afrique.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s7\"><span class=\"badge\">Sujet 7<\/span>Dissertation · Bilan de la colonisation<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion d'un débat sur les héritages de la colonisation, ton professeur te demande de présenter à la classe un bilan de la domination européenne en Afrique.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter une analyse cohérente des conséquences de l'impérialisme européen.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les avantages que l'Europe a tirés de la colonisation.<\/li><li>Montre en quoi la colonisation a freiné le développement de l'Afrique.<\/li><li>Donne ton avis sur les séquelles de la colonisation aujourd'hui.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>La colonisation de l'Afrique par l'Europe a profondément transformé les deux continents. Elle a enrichi l'une et affaibli l'autre, et ses séquelles se font encore sentir. Notre devoir consistera à présenter d'abord les avantages que l'Europe en a retirés, ensuite à montrer en quoi elle a freiné le développement de l'Afrique, enfin à donner notre avis sur ses séquelles actuelles.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'Europe en a tiré de grands avantages. Sur le plan politique, elle a affirmé sa suprématie sur le monde, avec l'apogée de l'européocentrisme. Sur le plan économique, elle a exploité les ressources du continent, approvisionné ses industries en matières premières et bénéficié du pacte colonial, qui lui assurait un marché réservé. Sur le plan socio-culturel, elle a fait rayonner sa culture, le christianisme et ses langues, imposés comme normes. <b>Mais ces profits ont eu un coût pour l'Afrique.<\/b><\/p>\n<p>Pour l'Afrique, la colonisation a été un frein. Sur le plan politique, elle a entraîné des massacres, l'humiliation et l'exil de souverains, la perte de souveraineté et le tracé de frontières artificielles. Sur le plan économique, elle a provoqué le pillage des ressources, l'extraversion de l'économie et le poids de l'économie de traite. Sur le plan socio-culturel, elle a détruit des sociétés, imposé le code de l'indigénat, l'impôt, les réquisitions, le portage et les travaux forcés, et pillé des biens culturels. <b>Ces effets durent encore.<\/b><\/p>\n<p>À notre avis, de nombreuses difficultés actuelles de l'Afrique ont des racines coloniales : frontières héritées qui divisent des peuples, économies tournées vers l'exportation de matières premières, faible industrialisation, dépendance de l'extérieur. Mais les responsabilités sont partagées, car la mauvaise gouvernance actuelle aggrave ces héritages. Il appartient donc aux Africains de bâtir leur propre développement.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>La colonisation a servi l'Europe et freiné l'Afrique, dont les sociétés portent encore les séquelles. Comment l'Afrique peut-elle transformer cet héritage en moteur d'un développement endogène et solidaire ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s8\"><span class=\"badge\">Sujet 8<\/span>Explication de texte · Administration indirecte et directe<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Au cours d'une séance de travaux dirigés, ton professeur compare les méthodes de gouvernement des puissances coloniales à partir d'un texte.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des systèmes d'administration coloniale.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Les puissances coloniales n'administrent pas toutes leurs territoires de la même façon. Les Britanniques s'appuient souvent sur les chefs locaux, qui gouvernent sous le contrôle d'un administrateur : c'est l'administration indirecte. Les Français, eux, placent des gouverneurs et des commandants à la tête des territoires, regroupés en fédérations comme l'Afrique occidentale française, et cherchent à assimiler les populations : c'est l'administration directe. Dans les deux cas, les décisions essentielles sont prises par l'Europe.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA3.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les deux systèmes d'administration coloniale décrits dans le texte.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 3. Il met en relief les différentes méthodes d'administration utilisées par les puissances coloniales en Afrique.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Selon l'auteur, « les Britanniques s'appuient souvent sur les chefs locaux ». Ces chefs traditionnels continuent de gouverner leurs peuples, mais sous la surveillance d'un administrateur britannique : « c'est l'administration indirecte », ou indirect rule. Ce système est économique et facilite l'acceptation de la domination, tout en gardant le pouvoir réel aux mains des Britanniques.<\/p>\n<p>Les Français, eux, « placent des gouverneurs et des commandants à la tête des territoires ». Les colonies sont regroupées en fédérations, comme l'Afrique occidentale française, avec Dakar pour capitale, ou l'Afrique équatoriale française. Dans cette administration directe, les Français « cherchent à assimiler les populations » : l'objectif est de les amener à adopter la langue, la culture et les institutions françaises, et le pouvoir des chefs traditionnels est affaibli. Le texte conclut que « les décisions essentielles sont prises par l'Europe » : dans les deux systèmes, les Africains restent soumis à l'autorité coloniale.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre la diversité des méthodes d'administration coloniale et leur point commun : la domination européenne.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s9\"><span class=\"badge\">Sujet 9<\/span>Dissertation · Les méthodes de pénétration<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'une causerie sur la conquête coloniale, ton professeur te demande d'expliquer comment les Européens ont pénétré à l'intérieur de l'Afrique.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir de tes savoirs construits, présente une analyse cohérente des méthodes de pénétration européenne en Afrique.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le rôle des explorateurs dans la préparation de la conquête.<\/li><li>Explique le système des « 3M » : missionnaires, marchands, militaires.<\/li><li>Montre l'importance de la loi de l'occupation effective dans la conquête.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Avant d'occuper l'Afrique, les Européens ont d'abord appris à la connaître. Ils ont ensuite employé différentes méthodes de pénétration qui ont rendu possible la colonisation du continent. Quel a été le rôle des explorateurs, comment le système des 3M a-t-il fonctionné et en quoi l'occupation effective a-t-elle accéléré la conquête ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les explorateurs ont ouvert la voie. Des hommes comme Mungo Park, René Caillié, Livingstone, Stanley ou Brazza ont parcouru le continent, tracé des cartes, décrit les peuples, les fleuves et les richesses et publié des récits de voyage. Leurs informations ont éclairé les États européens et leurs missions ont déblayé le chemin des conquérants. <b>Après eux est venue la conquête proprement dite, fondée sur les 3M.<\/b><\/p>\n<p>Les missionnaires pacifiaient et évangélisaient les peuples, ouvraient des écoles et préparaient les populations à accepter la présence européenne. Les marchands installaient des comptoirs sur les côtes, faisaient de la reconnaissance et signaient avec les rois des traités d'amitié ou de commerce, qui se transformaient vite en traités de protectorat. Les militaires, enfin, protégeaient les comptoirs et écrasaient les résistances. <b>La Conférence de Berlin est venue encadrer cette ruée.<\/b><\/p>\n<p>La loi de l'occupation effective, adoptée à Berlin, affirme qu'une possession n'est reconnue que si la puissance qui la revendique l'occupe réellement, avec une administration et une force armée. Pour s'assurer des droits sur des territoires, les Européens ont donc multiplié les traités, les expéditions et les installations de postes militaires. Cette règle a accéléré la conquête et le partage du continent en quelques années.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Explorateurs, missionnaires, marchands et militaires ont préparé et réalisé la pénétration européenne, accélérée par la règle de l'occupation effective. Comment les peuples africains ont-ils répondu à cette pénétration ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s10\"><span class=\"badge\">Sujet 10<\/span>Explication de texte · Le poids de la domination coloniale<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre de la préparation de ton examen, tu as mené des recherches sur la vie des populations sous la colonisation.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des conséquences de la domination coloniale sur les populations africaines.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Les colonisés sont soumis à un régime spécial appelé code de l'indigénat, qui leur retire des droits et leur impose des punitions sans jugement. Ils paient l'impôt de capitation, sont réquisitionnés pour le portage et les travaux forcés, et des jeunes sont enrôlés de force dans l'armée coloniale. Les chefs traditionnels perdent leur autorité, et les religions et les coutumes africaines sont dévalorisées.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA3.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les conséquences de la domination coloniale sur les populations africaines.<\/li><li>Dégage l'intérêt de l'étude de ce texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 3. Il insiste sur les conséquences politiques, économiques et socio-culturelles de la domination coloniale sur les populations africaines.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Le texte rappelle que les colonisés sont soumis au « code de l'indigénat », un statut avilissant qui leur retire des droits et permet à l'administration de les punir sans jugement. Sur le plan économique et social, « ils paient l'impôt de capitation », impôt par tête qui oblige les paysans à produire pour vendre ou à travailler pour les Européens. Ils « sont réquisitionnés pour le portage et les travaux forcés » : transport de charges, construction de routes et de voies ferrées, souvent dans des conditions très dures. Le texte ajoute que des jeunes sont enrôlés de force, comme pendant la Première Guerre mondiale, ce qui provoque des révoltes.<\/p>\n<p>Sur le plan politique et culturel, « les chefs traditionnels perdent leur autorité » : les royaumes sont disloqués, des souverains sont exilés et les structures sociales bouleversées. Les religions et les coutumes africaines sont dévalorisées au profit de la culture européenne, ce qui provoque une aliénation culturelle. Ces conséquences expliquent les nombreuses résistances et les soulèvements contre l'occupation.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte est digne d'intérêt parce qu'il nous a permis de mieux comprendre le poids de la domination coloniale sur les populations africaines et les causes de leurs résistances.<\/p>\n<\/div><\/details>\n\n<footer>Sujets d'entraînement composés d'après la fiche de cours de SA3, les corrigés du recueil BEPC 2009-2021 et les méthodes officielles. Les corrigés sont des propositions, non des corrigés officiels.<\/footer>",sa2:"<p class=\"sub\">Géographie · 5 dissertations et 5 explications de texte · format béninois : contexte d'évaluation, tâche, consigne<\/p>\n<div class=\"box\"><b>Rappel.<\/b> <i>Dissertation :<\/i> introduction en un seul bloc (préambule, problématique affirmative, annonce du plan en questions ou sous forme affirmative) ; un paragraphe par consigne, reliés par des phrases de transition en gras ; conclusion (bilan et ouverture) ; ni tirets, ni astérisques dans la rédaction. <i>Explication de texte :<\/i> introduction = source + idée générale introduite par « il met en exergue / en relief… », « il aborde… » ou « il insiste sur… » ; corps = réponse à la consigne 2 appuyée sur au moins trois extraits entre guillemets ; conclusion = en Géographie, ton opinion justifiée. Les textes sont des textes d'entraînement : à l'examen, la source figure sous le texte, ne l'invente jamais.<\/div>\n<div class=\"box\"><b>Repères.<\/b> Les corrigés utilisent les données des fiches et du recueil BEPC. En complément : 10 008 749 habitants au recensement de 2013 et environ 15 millions estimés en 2026 (projections de l'ONU) ; coton : 637 000 tonnes de coton graine en 2024-2025 ; pauvreté encore supérieure à 30 %. Les CARDER et les CeRPA cités dans les anciens corrigés ont été remplacés par les Agences territoriales de développement agricole (ATDA).<\/div>\n\n<h2 id=\"s1\"><span class=\"badge\">Sujet 1<\/span>Dissertation · Les ressources ligneuses du Bénin<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre de la journée de l'arbre organisée dans ta commune, ton professeur d'Histoire-Géographie te demande de préparer un exposé sur la sauvegarde des forêts du Bénin.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter une analyse cohérente des ressources ligneuses du Bénin.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les ressources ligneuses du Bénin.<\/li><li>Expose les menaces qui pèsent sur ces ressources.<\/li><li>Propose trois solutions pour leur sauvegarde.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Le Bénin, pays d'Afrique de l'Ouest, dispose de forêts et de savanes qui fournissent le bois, le charbon et de nombreux produits à sa population. Ces ressources ligneuses reculent pourtant d'année en année sous l'effet de nombreuses menaces. Notre devoir consistera à présenter d'abord les ressources ligneuses du Bénin, ensuite à exposer les menaces qui pèsent sur elles, enfin à proposer trois solutions pour les sauvegarder.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les ressources ligneuses du Bénin comprennent les forêts galeries, qui couvrent environ 273 000 hectares, les forêts claires et les savanes boisées, d'environ 1 932 000 hectares, ainsi que des forêts dégradées, estimées à 120 000 hectares, et plusieurs forêts classées. S'y ajoutent des plantations de teck et d'acacia, comme à Zogbodomè. Elles fournissent du bois d'œuvre, du bois de chauffe, du charbon de bois, des plantes médicinales et un abri à la faune. <b>Mais ces richesses sont aujourd'hui gravement menacées.<\/b><\/p>\n<p>Les menaces sont à la fois naturelles et humaines. Les feux de végétation tardifs, la coupe sélective des essences, la fabrication du charbon de bois et du bois de chauffe détruisent chaque année de vastes superficies. L'extension des activités agricoles et pastorales, notamment la monoculture extensive du coton, et l'usage abusif des intrants accélèrent le recul des forêts. Il en résulte l'érosion des sols, la disparition d'espèces animales et végétales et des changements climatiques. <b>Face à cette situation, il importe d'agir.<\/b><\/p>\n<p>Trois solutions peuvent être retenues. D'abord, mener des campagnes de sensibilisation des populations sur la sauvegarde et la protection des ressources ligneuses. Ensuite, lutter contre les feux de végétation tardifs grâce à des alertes permanentes et à l'implication des villageois. Enfin, poursuivre et entretenir les projets de plantation d'arbres, tout en encourageant des énergies de substitution au bois et au charbon.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>En somme, le Bénin possède d'importantes ressources ligneuses, menacées par les feux, les coupes et l'extension des cultures. Leur sauvegarde exige l'engagement de tous. Comment concilier alors les besoins en bois d'une population croissante et la protection durable du couvert végétal ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s2\"><span class=\"badge\">Sujet 2<\/span>Explication de texte · L'agriculture béninoise<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour une exposition de ton établissement sur l'économie du Bénin, tu es chargé(e) d'expliquer un texte consacré à l'agriculture.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de l'importance de l'agriculture béninoise.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">L'agriculture occupe plus de la moitié de la population active du Bénin. Les cultures vivrières, comme le maïs, le manioc, l'igname et le haricot, nourrissent les familles. Les cultures de rente, au premier rang desquelles le coton, mais aussi le palmier à huile, l'anacardier et l'ananas, procurent des revenus et alimentent les industries. Pourtant, les outils restent souvent rudimentaires et les paysans manquent d'encadrement et de financement.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA2.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique l'importance de l'agriculture béninoise et les difficultés qu'elle rencontre.<\/li><li>Donne ton point de vue sur l'état actuel de l'agriculture béninoise.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 2. Il met en exergue l'importance de l'agriculture béninoise et ses insuffisances.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Selon l'auteur, « l'agriculture occupe plus de la moitié de la population active » : elle est donc la première source d'emplois du pays. Les cultures vivrières (céréales, tubercules, légumineuses, cultures maraîchères) « nourrissent les familles » et assurent la sécurité alimentaire. Les cultures de rente, dont le coton, principale culture d'exportation, le palmier à huile, l'anacarde et l'ananas, « procurent des revenus et alimentent les industries » : huileries, usines d'égrenage et industries textiles. L'agriculture contribue ainsi aux recettes d'exportation et aux recettes de l'État.<\/p>\n<p>Mais cette agriculture rencontre des difficultés : « les outils restent souvent rudimentaires et les paysans manquent d'encadrement et de financement ». La production est largement artisanale, les rendements restent faibles et la priorité donnée aux cultures d'exportation se fait parfois au détriment des cultures vivrières. La mauvaise gestion du sous-secteur aggrave ces difficultés.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, l'agriculture est bien la base de l'économie béninoise, mais elle reste sous-équipée malgré la diversité de sa production. Nous pensons qu'il faut mécaniser progressivement, former et encadrer les paysans, faciliter le crédit agricole et mieux équilibrer cultures de rente et cultures vivrières.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s3\"><span class=\"badge\">Sujet 3<\/span>Dissertation · Les ressources halieutiques<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion d'une journée de sensibilisation des populations riveraines du lac Ahémé, tu es invité(e) à intervenir sur la protection des ressources de pêche.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Présente un texte cohérent sur les ressources halieutiques du Bénin et les problèmes qui leur sont liés.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>En partant des cours et plans d'eau du Bénin, présente les ressources halieutiques du pays.<\/li><li>Expose les menaces qui pèsent sur ces ressources.<\/li><li>Propose trois solutions à ces menaces.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Grâce à ses lagunes, à ses lacs, à ses fleuves et à sa façade maritime, le Bénin dispose de ressources halieutiques qui font vivre de nombreuses familles. Ces ressources sont aujourd'hui fragilisées, notamment dans des plans d'eau comme le lac Ahémé. Quelles sont ces ressources, quelles menaces pèsent sur elles et quelles solutions peut-on apporter ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les ressources halieutiques du Bénin se répartissent en deux grands bassins, celui du Sud et celui du Nord. Au Sud, on trouve la côte maritime d'environ 125 kilomètres, des lagunes et lacs comme le lac Nokoué et le lac Ahémé, et des cours d'eau comme l'Ouémé et le Mono. Au Nord, les eaux du fleuve Niger et de ses affluents offrent aussi du poisson. Ces plans d'eau fournissent poissons, crevettes et crabes, et favorisent la pêche artisanale, la pisciculture et la transformation du poisson. <b>Cependant, ces ressources subissent de sérieuses pressions.<\/b><\/p>\n<p>Les lacs et lagunes sont d'abord menacés par le comblement, l'envasement et l'ensablement provoqués par l'érosion. Ils sont ensuite pollués par les déchets industriels et les ordures ménagères. La pêche y est souvent pratiquée avec des outils prohibés et sans réglementation suffisante. Enfin, la forte pression démographique des populations riveraines entraîne la surexploitation du poisson. Une conséquence est la baisse de la production locale et le recours croissant au poisson congelé importé. <b>Des solutions s'imposent donc.<\/b><\/p>\n<p>Il faut d'abord draguer les plans d'eau comblés. Il faut ensuite sensibiliser les riverains sur les méfaits des déchets et réglementer la pêche, avec des sanctions contre l'usage d'outils prohibés. Il faut enfin diversifier les activités, reconvertir une partie des pêcheurs et créer des fermes piscicoles pour réduire la pression sur les plans d'eau. Chaque solution doit répondre à une cause précise.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Les ressources halieutiques du Bénin sont variées mais menacées par le comblement, la pollution et la surpêche. Leur protection passe par des mesures adaptées à chaque menace. Quel rôle les populations riveraines elles-mêmes peuvent-elles jouer dans cette gestion durable ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s4\"><span class=\"badge\">Sujet 4<\/span>Explication de texte · L'élevage au Bénin<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'un club d'agriculture de ton collège, on te demande d'expliquer un texte sur l'élevage au Bénin.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Sur la base du texte suivant et de tes savoirs construits, présente une explication cohérente des atouts et des difficultés de l'élevage béninois.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">L'élevage est pratiqué dans tous les départements du Bénin : bovins, caprins, ovins, porcins et volailles. Il reste cependant largement traditionnel, avec la transhumance des troupeaux en saison sèche à la recherche de pâturages et de points d'eau. Les épizooties et les maladies parasitaires déciment les bêtes, et les soins vétérinaires sont insuffisants. Pourtant, bien conduit, l'élevage pourrait améliorer l'alimentation des familles et les revenus des éleveurs.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA2.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les problèmes de l'élevage béninois et leurs conséquences.<\/li><li>Donne ton opinion sur les solutions à apporter.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 2. Il aborde les atouts et les problèmes de l'élevage au Bénin.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Selon l'auteur, « l'élevage est pratiqué dans tous les départements du Bénin » : il fournit viande, lait, œufs et revenus. Mais il « reste cependant largement traditionnel » : les troupeaux se déplacent en saison sèche à la recherche d'eau et de pâturages, ce qui provoque parfois des conflits avec les agriculteurs et fragilise les bêtes. Le texte précise que « les épizooties et les maladies parasitaires déciment les bêtes », d'où des pertes économiques importantes pour les éleveurs. Il ajoute que « les soins vétérinaires sont insuffisants », ce qui laisse les maladies se propager. L'insuffisance de points d'eau et de pâturage en saison sèche aggrave la situation.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, l'élevage béninois a un grand potentiel, mais il est freiné par ses méthodes traditionnelles. Nous pensons qu'il faut former suffisamment de vétérinaires, organiser des campagnes régulières de vaccination, renforcer les capacités des pharmacies vétérinaires, aménager des points d'eau et des zones de pâturage.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s5\"><span class=\"badge\">Sujet 5<\/span>Dissertation · L'agriculture béninoise<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion de la fête des paysans de ta commune, le chef d'arrondissement te demande de présenter à l'assistance la situation de l'agriculture béninoise.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>En te servant de tes savoirs construits, présente une analyse structurée (introduction, corps du devoir, transitions et conclusion) de l'agriculture béninoise.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les conditions favorables à l'agriculture béninoise.<\/li><li>Identifie les problèmes auxquels l'agriculture béninoise est confrontée.<\/li><li>Propose des solutions pour deux des problèmes identifiés.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>L'agriculture est la principale activité économique du Bénin et occupe plus de la moitié de la population active. Malgré des atouts réels, ce secteur reste confronté à de sérieuses difficultés. Notre devoir consistera à présenter d'abord les conditions favorables à l'agriculture béninoise, ensuite à identifier les problèmes auxquels elle est confrontée, enfin à proposer des solutions à deux d'entre eux.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'agriculture béninoise bénéficie de nombreux atouts naturels et humains. Le relief est peu accidenté, le climat est diversifié, les sols sont variés et relativement fertiles et le réseau hydrographique est dense. À cela s'ajoutent une main-d'œuvre agricole abondante, des structures publiques d'encadrement technique, comme les agences territoriales de développement agricole (ATDA), et des écoles et centres de formation agricoles. Ces conditions permettent de produire des cultures vivrières (maïs, manioc, igname, haricot) et des cultures de rente (coton, palmier à huile, anacarde, ananas). <b>Pourtant, le secteur ne tire pas pleinement profit de ces atouts.<\/b><\/p>\n<p>Les problèmes sont nombreux. L'agriculture reste surtout traditionnelle, avec des outils rudimentaires et une faible mécanisation. Les paysans manquent de financement, d'encadrement et d'intrants adaptés. La priorité accordée aux cultures d'exportation, en particulier le coton, se fait parfois au détriment des cultures vivrières. La mauvaise gestion et la corruption freinent enfin le sous-secteur. <b>Retenons deux de ces problèmes pour proposer des solutions.<\/b><\/p>\n<p>Pour la faible mécanisation et le manque de financement, on peut faciliter l'accès des paysans au matériel agricole adapté par des coopératives ou des crédits, et former les agriculteurs à l'utilisation des machines. Pour la priorité donnée aux cultures d'exportation, il faut soutenir aussi les cultures vivrières par des prix incitatifs, des intrants et des infrastructures de stockage, afin d'assurer la sécurité alimentaire.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>L'agriculture béninoise dispose de conditions favorables, mais elle souffre de sous-équipement et de déséquilibres. Des mesures hardies sont nécessaires pour en faire le moteur du développement. Comment l'agriculture pourra-t-elle alors nourrir une population qui croît rapidement ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s6\"><span class=\"badge\">Sujet 6<\/span>Explication de texte · Le déficit énergétique<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Lors d'une conférence-débat organisée dans ton lycée sur l'énergie, on te demande d'expliquer un texte sur les ressources énergétiques du Bénin.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de la situation énergétique du Bénin.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Le Bénin dispose de pétrole et de gaz naturel annoncés dans le bassin sédimentaire côtier, de tourbe, d'un potentiel hydroélectrique, d'un fort ensoleillement dans le Nord et de vents sur la côte. Pourtant, ces ressources sont peu exploitées et le pays achète à l'étranger une grande partie de l'électricité et des produits pétroliers qu'il consomme. Cette dépendance pèse sur la balance commerciale et freine l'industrialisation.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA2.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique pourquoi le Bénin connaît un déficit énergétique malgré ses ressources, et quelles en sont les conséquences.<\/li><li>Donne ton opinion sur les mesures à prendre pour l'indépendance énergétique.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 2. Il met en relief le paradoxe entre les ressources énergétiques du Bénin et sa dépendance énergétique.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Le texte rappelle que le Bénin possède d'importantes ressources : pétrole et gaz naturel dans le bassin sédimentaire côtier, tourbe, cours d'eau pour l'hydroélectricité, soleil au Nord et vent sur la côte. Cependant, « ces ressources sont peu exploitées » : les équipements techniques, les capitaux et la politique énergétique sont insuffisants. Il en résulte que « le pays achète à l'étranger une grande partie de l'électricité et des produits pétroliers qu'il consomme ».<\/p>\n<p>Cette dépendance a des conséquences graves. Selon l'auteur, « cette dépendance pèse sur la balance commerciale et freine l'industrialisation » : le pays dépense des devises pour importer l'énergie, l'électricité coûte cher aux entreprises, les industries se développent peu et les emplois manquent. Les coupures et le coût de l'énergie pèsent aussi sur la vie des ménages.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, cette situation n'est pas une fatalité. Nous pensons qu'il faut développer la recherche et la formation de techniciens, exploiter davantage le solaire et l'éolien, attirer des investissements encadrés par une gestion transparente et rechercher l'indépendance énergétique tout en protégeant l'environnement.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s7\"><span class=\"badge\">Sujet 7<\/span>Dissertation · Ressources minières et énergétiques<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre d'un exposé sur les ressources du sous-sol, ton professeur te demande de montrer que le Bénin dispose de richesses minières et énergétiques peu valorisées.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Présente un texte cohérent sur les ressources minières et énergétiques du Bénin.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les ressources minières et énergétiques du Bénin.<\/li><li>Explique pourquoi ces ressources sont peu exploitées.<\/li><li>Propose trois mesures pour mieux les valoriser.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Le sous-sol et les cours d'eau du Bénin recèlent des ressources minières et énergétiques variées. Pourtant, le pays reste dépendant de l'extérieur pour son énergie et ses produits manufacturés. Quelles sont ces ressources, pourquoi sont-elles peu exploitées et comment les valoriser ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les ressources minières comprennent l'or, le fer, le phosphate, le chrome, le nickel, l'étain, le calcaire, le marbre, le granite, le kaolin, l'argile et la silice. Les ressources énergétiques sont constituées de pétrole et de gaz naturel annoncés dans le bassin sédimentaire côtier, dans le secteur de Sèmè, de tourbe, d'hydroélectricité, d'énergie solaire dans le Nord et d'énergie éolienne sur la côte. <b>Ces richesses pourraient soutenir l'industrie, mais leur exploitation reste très limitée.<\/b><\/p>\n<p>Plusieurs raisons l'expliquent. L'exploitation minière est surtout artisanale et seul le ciment alimente une usine, celle d'Onigbolo. Le pays manque de capitaux, de technologies et de techniciens spécialisés. Les recherches géologiques et les infrastructures sont insuffisantes, et la gouvernance du secteur est parfois défaillante. Il en résulte un déficit énergétique, une faible industrialisation et une balance commerciale déficitaire. <b>Des mesures sont donc nécessaires.<\/b><\/p>\n<p>La première mesure consiste à développer la recherche géologique et à former des ingénieurs et des techniciens. La deuxième consiste à attirer des investissements dans le cadre de partenariats transparents qui profitent au pays et à transformer les produits sur place. La troisième est de développer les énergies renouvelables, solaire et éolienne, pour assurer l'indépendance énergétique.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Le Bénin possède des ressources minières et énergétiques réelles, mais peu valorisées faute de moyens, de formation et de bonne gouvernance. Leur mise en valeur dépend de choix politiques clairs. Comment faire profiter durablement ces richesses à l'ensemble de la population ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s8\"><span class=\"badge\">Sujet 8<\/span>Explication de texte · Tourisme et patrimoine culturel<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>À l'occasion de la journée du patrimoine, ton établissement organise une séance d'explication de textes sur les atouts touristiques du Bénin.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente de l'importance du patrimoine touristique et culturel du Bénin.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Le Bénin possède un riche patrimoine : les palais royaux d'Abomey, les musées, la route de l'esclavage à Ouidah, les chutes de Tanougou et de Kota, les parcs nationaux du W et de la Pendjari et des fêtes comme la Gaani. Ces sites attirent des visiteurs et procurent des emplois aux guides, aux artisans et aux hôteliers. Mais certains sites sont mal entretenus, peu aménagés et mal connus.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA2.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique l'intérêt du tourisme pour le développement du Bénin et les obstacles à son essor.<\/li><li>Donne ton opinion sur la manière de valoriser ce patrimoine.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 2. Il met en exergue les richesses touristiques et culturelles du Bénin et leur valorisation.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>L'auteur affirme que « le Bénin possède un riche patrimoine » : sites historiques et culturels comme les palais royaux d'Abomey et la route de l'esclavage, sites naturels comme les chutes de Tanougou et de Kota ou les parcs du W et de la Pendjari, et manifestations culturelles comme la Gaani, la fête de l'igname ou la danse Guèlèdè, reconnue par l'UNESCO. Il précise que « ces sites attirent des visiteurs et procurent des emplois aux guides, aux artisans et aux hôteliers ». Le tourisme apporte ainsi des devises, des emplois, des revenus à l'artisanat et à la restauration, et fait connaître l'histoire et la culture du pays.<\/p>\n<p>Mais le texte ajoute que « certains sites sont mal entretenus, peu aménagés et mal connus ». L'insuffisance des routes d'accès, des hébergements, de la promotion et de l'entretien des sites limite les visites. La disparition de la faune par le braconnage menace aussi le tourisme de vision.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, le tourisme est un levier de développement encore sous-exploité. Nous pensons qu'il faut aménager et entretenir les sites, améliorer les voies d'accès et l'hébergement, promouvoir la destination Bénin et impliquer les communautés locales dans la protection du patrimoine.<\/p>\n<\/div><\/details>\n\n<h2 id=\"s9\"><span class=\"badge\">Sujet 9<\/span>Dissertation · La population et la jeunesse béninoises<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Lors d'une causerie éducative organisée dans ton lycée, on te demande de montrer que la jeunesse est à la fois une richesse et un défi pour le développement du Bénin.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise tes savoirs construits pour présenter un texte cohérent sur les ressources humaines du Bénin.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les atouts humains du Bénin.<\/li><li>Expose trois problèmes auxquels la jeunesse béninoise est confrontée.<\/li><li>Propose trois solutions à l'un de ces problèmes.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Le Bénin compte parmi ses principales richesses sa population, majoritairement jeune. Cette jeunesse, atout pour le développement, rencontre pourtant de nombreuses difficultés. Notre devoir consistera à présenter d'abord les atouts humains du pays, ensuite à exposer trois problèmes de la jeunesse, enfin à proposer trois solutions à l'un d'eux.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Le pays comptait 10 008 749 habitants au recensement de 2013 et on l'estime en 2026 à environ 15 millions selon les projections de l'ONU. Cette population jeune représente une main-d'œuvre abondante et dynamique. Le Bénin dispose aussi de cadres compétents dans diverses catégories d'activités et de populations spécialisées dans la pêche, l'élevage ou l'artisanat. Son appartenance à la CEDEAO et la proximité du Nigeria lui offrent un vaste marché de consommation. <b>Mais la jeunesse fait face à de sérieux problèmes.<\/b><\/p>\n<p>Elle est d'abord confrontée au chômage et au sous-emploi, liés à l'inadéquation entre la formation et les besoins du marché et à la mauvaise gestion des ressources. Elle est ensuite touchée par l'exode rural, lié à la recherche d'un mieux-être dans les villes. Elle subit enfin la déscolarisation, aggravée par des pesanteurs socioculturelles comme les mariages forcés ou précoces, et parfois la consommation de stupéfiants. <b>Retenons le chômage pour proposer des solutions.<\/b><\/p>\n<p>Pour réduire le chômage et le sous-emploi, il faut d'abord créer des emplois en soutenant les secteurs porteurs comme l'agriculture et l'artisanat. Il faut ensuite adapter la formation aux besoins du marché de l'emploi, notamment par l'enseignement technique et professionnel. Il faut enfin octroyer des crédits pour encourager les initiatives privées des jeunes.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>La population jeune du Bénin est un atout majeur, à condition qu'elle soit formée, encadrée et employée. Comment transformer ce capital humain en moteur durable du développement ?<\/p>\n<\/div><\/details>\n\n<h2 id=\"s10\"><span class=\"badge\">Sujet 10<\/span>Explication de texte · Les effets de la mauvaise gestion des ressources<\/h2>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre de la préparation du BEPC, ton groupe de travail étudie l'impact du mode de gestion des ressources sur le développement du Bénin.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir du texte suivant et de tes savoirs construits, présente une explication cohérente des conséquences d'une mauvaise gestion des ressources.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Faute de valoriser ses ressources, le Bénin importe l'énergie, de nombreux produits manufacturés et même des produits alimentaires courants. Sa balance commerciale est déficitaire et son industrie reste faible. Dans les campagnes, la production artisanale, centrée sur le coton, ne nourrit pas toujours les ménages : les jeunes partent vers les villes, où l'habitat spontané et l'insalubrité se multiplient.<\/div>\n<p class=\"src\">Source : texte d'entraînement composé d'après la fiche de cours de SA2.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique l'impact de la gestion des ressources sur l'économie et la population.<\/li><li>Donne ton opinion sur les défis à relever.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est un texte d'entraînement composé d'après la fiche de cours de la situation d'apprentissage n° 2. Il insiste sur les conséquences de la mauvaise valorisation des ressources sur l'économie et la population du Bénin.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Sur le plan économique, l'auteur constate que « le Bénin importe l'énergie, de nombreux produits manufacturés et même des produits alimentaires courants ». Cette dépendance de l'extérieur s'accompagne d'un déséquilibre : « sa balance commerciale est déficitaire et son industrie reste faible ». Le pays exporte surtout des matières premières, comme le coton, et achète des produits transformés plus coûteux, ce qui limite la création d'emplois industriels.<\/p>\n<p>Sur le plan social, la production artisanale centrée sur le coton ne suffit pas toujours à nourrir les ménages, d'où la pauvreté des campagnes. Le texte relève que « les jeunes partent vers les villes, où l'habitat spontané et l'insalubrité se multiplient » : c'est l'exode rural, qui provoque l'urbanisation anarchique, le chômage urbain et la dégradation de l'environnement.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, ces difficultés viennent moins d'un manque de ressources que de leur mauvaise gestion. Nous pensons qu'il faut valoriser toutes les ressources, assurer l'indépendance énergétique, adapter la formation à l'emploi, réduire l'analphabétisme et promouvoir la bonne gouvernance en luttant contre la corruption.<\/p>\n<\/div><\/details>\n\n<footer>Sujets d'entraînement composés d'après la fiche de cours de SA2, les corrigés du recueil BEPC 2009-2021 et les méthodes officielles. Les corrigés sont des propositions, non des corrigés officiels.<\/footer>",meth:"\n<p class=\"sub\">Format en vigueur au Bénin · dissertation et explication de texte · données actualisées en octobre 2026<\/p>\n\n<h2 id=\"format\">1. Le format de l'épreuve<\/h2>\n<div class=\"scroll\"><table>\n<tr><th>Élément<\/th><th>Ce qu'il faut retenir<\/th><\/tr>\n<tr><td>Composition<\/td><td>Un sujet d'<b>Histoire<\/b> et un sujet de <b>Géographie<\/b>. Dans les sessions récentes (2016 à 2021), chacun est soit une <b>dissertation<\/b>, soit une <b>explication de texte<\/b> (ex. 2016 : Histoire explication de texte, Géographie dissertation ; 2017 : l'inverse). L'ordre n'est pas fixe : il faut maîtriser les deux exercices dans les deux matières.<\/td><\/tr>\n<tr><td>Présentation d'un sujet<\/td><td><b>Contexte d'évaluation<\/b> → <b>Tâche<\/b> → (<b>Support : texte et sa source<\/b> pour l'explication de texte) → <b>Consigne<\/b> (en général 3 consignes).<\/td><\/tr>\n<tr><td>Anciennes sessions (2009-2015)<\/td><td>Formulation « rédaction cohérente (introduction, corps du devoir, transitions et conclusion) », avec parfois des tableaux à compléter, des définitions à associer ou des listes à classer. À s'entraîner aussi.<\/td><\/tr>\n<tr><td>Principe général<\/td><td>Les consignes guident le plan : <b>autant de questions, autant de paragraphes<\/b>. On répond avec les savoirs construits en classe (la fiche de cours), jamais avec des idées étrangères au cours.<\/td><\/tr>\n<\/table><\/div>\n\n<h3>Les verbes d'habileté<\/h3>\n<p>Chaque verbe de la consigne appelle une réponse précise.<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Verbe<\/th><th>Ce qu'il demande<\/th><\/tr>\n<tr><td><b>Citer, énumérer<\/b><\/td><td>Énoncer successivement, dans l'ordre, sans développer (à manier avec prudence en évaluation).<\/td><\/tr>\n<tr><td><b>Identifier<\/b><\/td><td>Reconnaître exactement un fait, une situation.<\/td><\/tr>\n<tr><td><b>Présenter<\/b><\/td><td>Faire connaître le sujet de façon organisée.<\/td><\/tr>\n<tr><td><b>Décrire<\/b><\/td><td>Donner un développement détaillé, avec plus d'informations.<\/td><\/tr>\n<tr><td><b>Exposer<\/b><\/td><td>Faire un développement explicatif (les faits et leur explication).<\/td><\/tr>\n<tr><td><b>Expliquer<\/b><\/td><td>Faire comprendre par les causes, les raisons, les mécanismes.<\/td><\/tr>\n<tr><td><b>Dégager l'intérêt<\/b><\/td><td>(Histoire) dire ce que l'étude du texte a permis de mieux comprendre.<\/td><\/tr>\n<tr><td><b>Donner son opinion / son point de vue<\/b><\/td><td>(Géographie) prendre position et justifier brièvement.<\/td><\/tr>\n<\/table><\/div>\n\n<h2 id=\"diss\">2. Méthode de la dissertation<\/h2>\n<p>La dissertation est un devoir rédigé qui organise des connaissances sur un sujet, selon une démarche rigoureuse, autour d'une problématique claire. Elle comporte trois parties : introduction, corps du devoir, conclusion.<\/p>\n\n<div class=\"box rule\"><div class=\"t\">Règles de présentation<\/div>\nPas de tirets, pas d'astérisques, pas de lignes vides ou sautées. Chaque partie est rédigée <b>en bloc<\/b> et répartie en paragraphes. On commence le corps du devoir par une phrase introductive.<\/div>\n\n<h3>A. L'introduction : un bloc unique, les « 3 P »<\/h3>\n<div class=\"scroll\"><table>\n<tr><th>Élément<\/th><th>Rôle<\/th><th>Comment le trouver<\/th><\/tr>\n<tr><td><b>Préambule<\/b> (idée générale)<\/td><td>Situer le contexte historique (Histoire) ou le cadre géographique (Géographie). Une ou deux phrases au plus : une phrase générale qui amène la problématique sans l'enfermer.<\/td><td>Histoire : les circonstances qui ont mené au sujet. Géographie : le grand ensemble dans lequel il s'insère.<\/td><\/tr>\n<tr><td><b>Problématique<\/b> (idée maîtresse)<\/td><td>Dire sur quoi porte la dissertation. C'est le fil directeur ; ce n'est pas une reformulation du sujet.<\/td><td>Lire la <b>tâche<\/b>, le contexte et surtout les consignes. Elle s'écrit sous <b>forme affirmative<\/b> : une phrase qui dit le problème posé par le sujet.<\/td><\/tr>\n<tr><td><b>Annonce du plan<\/b><\/td><td>Dire au correcteur ce qu'il trouvera dans le corps du devoir.<\/td><td>Au choix, une seule forme : <b>affirmative<\/b> (« Notre devoir consistera à présenter d'abord…, ensuite à décrire…, enfin à donner… ») ou <b>interrogative<\/b> (questions qui reprennent les consignes). Garder les verbes d'habileté des consignes.<\/td><\/tr>\n<\/table><\/div>\n\n<h3>B. Le corps du devoir<\/h3>\n<ul>\n<li>Il suit les consignes : <b>trois questions, trois paragraphes<\/b> (ou plus si le contenu l'exige).<\/li>\n<li>Commencer par une <b>phrase introductive<\/b>, puis répondre à la première question.<\/li>\n<li>Terminer chaque paragraphe par une <b>phrase de transition<\/b> qui relie la réponse donnée à celle qui suit (obligatoire entre la première et la deuxième question). Dans les corrigés de l'application, les transitions sont mises <b>en gras<\/b>.<\/li>\n<li>Chaque réponse s'appuie sur des éléments précis du cours : noms, dates, lieux, exemples.<\/li>\n<\/ul>\n\n<h3>C. La conclusion<\/h3>\n<p>Elle n'est pas un résumé : c'est un <b>bilan<\/b> qui répond à la problématique, suivi d'une <b>ouverture<\/b> vers un autre problème qu'on se contente d'évoquer. Elle reprend en sens inverse les éléments de l'introduction et reste courte.<\/p>\n\n<div class=\"box key\"><div class=\"t\">Canevas à compléter<\/div>\n<p><i>Introduction.<\/i> « … (préambule : contexte, une ou deux phrases). … (problématique : phrase affirmative qui dit le problème posé par le sujet). Notre devoir consistera à … d'abord (consigne 1) …, ensuite à … (consigne 2) …, enfin à … (consigne 3) … » ou, à la place de cette dernière phrase, trois questions qui reprennent les consignes.<\/p>\n<p><i>Corps.<\/i> « … (phrase introductive). … (réponse 1). <b>… (transition)<\/b>. … (réponse 2). <b>… (transition)<\/b>. … (réponse 3). »<\/p>\n<p><i>Conclusion.<\/i> « Au total, … (bilan : réponse à la problématique). … (ouverture). »<\/p><\/div>\n\n<div class=\"box\"><div class=\"t\">Erreurs fréquentes<\/div>\nMettre des tirets ou des lignes sautées · oublier la problématique ou le plan · reformuler le sujet au lieu de poser la problématique · écrire à la fois les questions et la phrase d'annonce du plan · enchaîner les réponses sans transition · résumer au lieu de faire un bilan · rester vague, sans dates ni noms.<\/div>\n\n<h2 id=\"et\">3. Méthode de l'explication de texte<\/h2>\n<p>L'explication de texte consiste à expliquer les idées d'un auteur grâce aux éléments du cours. Elle comporte trois parties qui répondent aux trois consignes. <b>On ne met jamais le numéro des consignes dans la rédaction.<\/b><\/p>\n\n<h3>A. L'introduction ou présentation du texte (consigne 1)<\/h3>\n<ul>\n<li><b>La source :<\/b> titre de l'ouvrage, nom de l'auteur, maison d'édition, année de parution, page. Ces éléments figurent souvent au bas du texte. <b>Il ne faut jamais en inventer<\/b> : si un élément manque, on ne le cite pas. Un texte peut avoir deux sources ou plus (site internet : adresse et date de consultation).<\/li>\n<li><b>L'idée générale :<\/b> le fait central, ce dont parle essentiellement le texte.<\/li>\n<li><b>Interdit :<\/b> annoncer le plan et poser une problématique, formellement exclus ici.<\/li>\n<\/ul>\n<div class=\"box key\"><div class=\"t\">Formules et canevas<\/div>\n<p>« Le texte soumis à notre réflexion… » · « Le texte que nous avons à expliquer… » · « Le texte, objet de notre explication… »<\/p>\n<p>après la source, l'idée générale commence par « Il met en exergue… » · « Il met en relief… » · « Il aborde… » · « Il insiste sur… »<\/p>\n<p><i>Canevas :<\/i> « Le texte soumis à notre réflexion est tiré de … (titre) … et écrit par … (auteur). Il a été édité par … (maison d'édition) … en … (année) … et est tiré de la page … Il met en exergue … (idée générale : le thème et ce que l'auteur en dit). »<\/p><\/div>\n\n<h3>B. Le corps du devoir (consigne 2)<\/h3>\n<ul>\n<li>Une seule partie, en Histoire comme en Géographie.<\/li>\n<li>On explique les affirmations de l'auteur par une rédaction cohérente et argumentée, appuyée sur le cours.<\/li>\n<li>On utilise <b>au moins deux phrases ou citations du texte<\/b>, mises entre guillemets, puis expliquées avec ses propres connaissances.<\/li>\n<li>On ne recopie <b>jamais<\/b> tout le texte.<\/li>\n<\/ul>\n\n<h3>C. La conclusion (consigne 3)<\/h3>\n<div class=\"scroll\"><table>\n<tr><th><\/th><th>Histoire<\/th><th>Géographie<\/th><\/tr>\n<tr><td>Ce qu'on donne<\/td><td><b>L'intérêt du texte<\/b> : la pertinence des idées de l'auteur, ce qu'on a gagné en étudiant le texte.<\/td><td><b>Son opinion<\/b> : sa position (pour ou contre, vrai ou faux) suivie d'une brève justification.<\/td><\/tr>\n<tr><td>Formules<\/td><td>« Le texte, objet de notre explication, est digne d'intérêt parce qu'il nous a permis de mieux comprendre… » · « Le texte de … est d'un intérêt historique appréciable parce qu'il nous a permis d'avoir une idée plus claire de… »<\/td><td>« Nous pensons que… », « Nous sommes d'accord / en désaccord avec l'auteur, parce que… »<\/td><\/tr>\n<\/table><\/div>\n<p><b>Règles :<\/b> la conclusion ne doit pas dépasser l'introduction ; en Géographie, donner son opinion n'est pas faire une dissertation.<\/p>\n\n<div class=\"box\"><div class=\"t\">Dissertation et explication de texte : l'essentiel<\/div>\n<div class=\"scroll\"><table>\n<tr><th><\/th><th>Dissertation<\/th><th>Explication de texte<\/th><\/tr>\n<tr><td>Introduction<\/td><td>Préambule + problématique + annonce du plan<\/td><td>Source + idée générale seulement<\/td><\/tr>\n<tr><td>Corps<\/td><td>Un paragraphe par consigne, avec transitions<\/td><td>Une seule partie, au moins 2 citations expliquées<\/td><\/tr>\n<tr><td>Conclusion<\/td><td>Bilan + ouverture<\/td><td>Intérêt (Histoire) ou opinion (Géographie)<\/td><\/tr>\n<tr><td>Interdits<\/td><td>Tirets, astérisques, lignes vides<\/td><td>Plan, problématique, numéros de consignes, recopie du texte<\/td><\/tr>\n<\/table><\/div><\/div>\n\n<h2 id=\"carte\">4. Carte des sujets BEPC 2009-2021 par SA<\/h2>\n<p>Les thèmes reviennent : Berlin, les résistances (Béhanzin, Samory), le mouvement ouvrier, la CEDEAO et les ressources du Bénin tombent presque chaque année.<\/p>\n<div class=\"scroll\"><table>\n<tr><th>Session<\/th><th>Histoire<\/th><th>Géographie<\/th><\/tr>\n<tr><td>2009<\/td><td>Explication de texte, agriculture européenne au XIXe s. (SA1)<\/td><td>Analyse de l'agriculture béninoise (SA2)<\/td><\/tr>\n<tr><td>2010<\/td><td>Conférence de Berlin : raisons, décisions, conséquences (SA3)<\/td><td>Ressources agricoles et pastorales, problèmes de l'élevage (SA2)<\/td><\/tr>\n<tr><td>2011<\/td><td>Conditions de vie des ouvriers, actions, acquis (SA1)<\/td><td>Tableau de ressources ; problèmes de la jeunesse béninoise (SA2)<\/td><\/tr>\n<tr><td>2012<\/td><td>Résistance de Béhanzin : causes, 2e guerre, leçons (SA5)<\/td><td>Poisson congelé du lac Ahémé ; tableau de ressources ; plan d'action (SA2)<\/td><\/tr>\n<tr><td>2014<\/td><td>Tactique de Samory ; inventions des transports ; point de vue sur Béhanzin (SA1, SA5)<\/td><td>Ressources humaines et techniques du Bénin (SA2)<\/td><\/tr>\n<tr><td>2015<\/td><td>Explication de texte : mutations de l'agriculture (SA1)<\/td><td>Dissertation : faiblesses de la CEDEAO dans le commerce (SA4)<\/td><\/tr>\n<tr><td>2016<\/td><td>Explication de texte : organisation de la résistance de Gbèhanzin (SA5)<\/td><td>Dissertation : cultures de rente du Bénin (SA2)<\/td><\/tr>\n<tr><td>2017<\/td><td>Dissertation : soulèvements populaires au Dahomey, Sahouè de Doutou (SA5)<\/td><td>Explication de texte : forêts du Bénin (SA2)<\/td><\/tr>\n<tr><td>2018<\/td><td>Explication de texte : moyens et stratégies de Samory (SA5)<\/td><td>Dissertation : création et organes de la CEDEAO, Cour de Justice (SA4)<\/td><\/tr>\n<tr><td>2019<\/td><td>Dissertation : mouvement ouvrier, syndicalismes, acquis (SA1)<\/td><td>Explication de texte : avantages de l'intégration économique (SA4)<\/td><\/tr>\n<tr><td>2020<\/td><td>Dissertation : Conférence de Berlin (SA3)<\/td><td>Explication de texte : ressources agricoles du Bénin (SA2)<\/td><\/tr>\n<tr><td>2021<\/td><td>Explication de texte : Conférence de Berlin (SA3)<\/td><td>Dissertation : la CEDEAO, une intégration économique (SA4)<\/td><\/tr>\n<\/table><\/div>\n<p class=\"tag\">Le recueil contient aussi des épreuves sans date : progrès des sciences et « La foi dans le progrès » (SA1), conséquences de l'économie de traite en Afrique (SA3), ressources ligneuses et halieutiques (SA2), mobiles de la résistance de Béhanzin (SA5).<\/p>\n\n<!-- ============ SA1 ============ -->\n<h2 id=\"sa1\"><span class=\"badge\">Histoire<\/span>SA1 — Le mouvement ouvrier en Europe<\/h2>\n\n<h3>Sujet 1 · Dissertation<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Dans le cadre de ta préparation au BEPC, tu as effectué des recherches sur les transformations sociales en Europe aux XIXe et XXe siècles.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Utilise les résultats de tes recherches et tes savoirs construits pour présenter une analyse cohérente du mouvement ouvrier en Europe au XIXe siècle.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les raisons qui ont amené les ouvriers à s'organiser pour revendiquer leurs droits.<\/li><li>Décris les formes de syndicalisme utilisées par ces ouvriers pour défendre leurs intérêts.<\/li><li>Expose les acquis des luttes ouvrières aux XIXe et XXe siècles.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>La révolution agricole et industrielle du XIXe siècle a profondément transformé l'Europe et fait naître deux classes sociales aux intérêts opposés : la bourgeoisie et le prolétariat. Face à la misère, les ouvriers se sont organisés pour défendre leurs droits : c'est le mouvement ouvrier. Pourquoi les ouvriers ont-ils éprouvé le besoin de s'organiser, par quels moyens ont-ils lutté et qu'ont-ils obtenu ?<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Les ouvriers du XIXe siècle se sont organisés parce que leurs conditions de travail et de vie étaient très pénibles. Au travail, ils subissaient des salaires dérisoires, des journées de 14 à 16 heures, des ateliers mal aérés et mal éclairés, des licenciements abusifs en cas de maladie ou de crise, l'absence de congés payés, de retraite et de prise en charge sanitaire, et un travail des femmes et des enfants non réglementé. Les grèves et les associations leur étaient interdites et ils n'avaient pas le droit de vote. Dans leur vie quotidienne, ils habitaient des logements exigus, insalubres et chers, souffraient de sous-alimentation, de tuberculose et d'alcoolisme, et leurs salaires ne suffisaient pas à nourrir leurs familles. À cette misère s'ajoutaient la conscience de leur nombre et de leur utilité ainsi que l'influence des idées socialistes. <b>Pour sortir de cette situation, les ouvriers se sont unis, notamment à travers le syndicalisme dont il convient maintenant de décrire les formes.<\/b><\/p>\n<p>Le syndicalisme est un mouvement qui regroupe les travailleurs d'une même corporation pour défendre leurs intérêts face au patronat. Il a pris deux formes. Le syndicalisme révolutionnaire visait un changement radical de la société et utilisait des actions violentes : grèves violentes, boycott du travail, sabotage des outils, voies de fait. Il s'est surtout développé en France avec la Confédération Générale du Travail (CGT), créée en 1896, ainsi qu'en Italie et en Espagne. Le syndicalisme réformiste ou modéré cherchait au contraire à améliorer progressivement les conditions de travail par la négociation, le dialogue avec le patronat, les sit-in et les grèves pacifiques. Il s'est illustré en Angleterre avec les Trade Unions, à l'origine du Labour Party, et aux États-Unis avec l'American Federation of Labour. <b>Ces luttes ont fini par produire des résultats importants.<\/b><\/p>\n<p>Grâce à leurs luttes, les ouvriers ont obtenu l'amélioration de leurs conditions de travail : réduction de la journée de travail à 8 à 10 heures selon les pays, augmentation progressive des salaires, congés payés, droit de grève, liberté d'association, conventions collectives, réglementation du travail des femmes et des enfants et institution du 1er mai comme fête des travailleurs. Leurs conditions de vie se sont aussi améliorées : allocations familiales, scolarité obligatoire jusqu'à 12 ans, suffrage universel et libertés fondamentales, représentation des travailleurs au parlement, caisses de sécurité sociale et, au Royaume-Uni entre 1906 et 1914, lois créant l'assurance chômage, maladie, vieillesse et invalidité.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>Au total, la misère née de l'industrialisation a poussé les ouvriers européens à s'organiser en syndicats révolutionnaires ou réformistes, et leurs luttes ont abouti à de réels acquis sociaux. Ces conquêtes doivent être préservées, et la question du dialogue social entre travailleurs et employeurs se pose aussi aujourd'hui dans un pays comme le Bénin.<\/p>\n<\/div><\/details>\n\n<h3>Sujet 2 · Explication de texte<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Pour célébrer la fête du 1er mai, les ouvriers de ton père t'invitent à leur présenter les acquis de la lutte des travailleurs au XIXe siècle.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Sur la base du support-texte et de tes savoirs construits, présente une explication cohérente des acquis de la lutte ouvrière au XIXe siècle.<\/p>\n<p><span class=\"lbl\">Support : texte<\/span><\/p>\n<div class=\"texte\">Dans la deuxième moitié du siècle, les syndicats se multiplient. Ils sont favorisés par l'augmentation du nombre des ouvriers d'usine, par la concentration des entreprises (…). En 1864, ils organisent une longue grève des ouvriers pour la réduction de la journée de travail et l'augmentation des salaires. Les syndicats ont beaucoup contribué à faire voter les lois sociales : diminution de la durée de travail, organisation des retraites, indemnisation pour les accidents du travail.<\/div>\n<p class=\"src\">Source : Histoire-Géographie 4e, initiation économique, Nathan, p. 186, sous la direction de Marie-Thérèse Drouillon.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique les raisons des luttes ouvrières tout en dégageant leurs résultats.<\/li><li>Dégage l'intérêt du texte.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre analyse est extrait du livre d'Histoire-Géographie 4e, intitulé « initiation économique », publié chez Nathan, à la page 186, sous la direction de Marie-Thérèse Drouillon. Il met en exergue les luttes et les acquis des syndicats dans la seconde moitié du XIXe siècle en Europe.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Plusieurs causes sous-tendent les luttes ouvrières déclenchées en Europe au XIXe siècle. L'auteur note que « les syndicats se multiplient », favorisés par l'augmentation du nombre des ouvriers d'usine et la concentration des entreprises : plus les ouvriers sont nombreux et réunis dans de grandes usines, plus ils prennent conscience de leurs intérêts communs. Ces ouvriers subissaient de mauvaises conditions de vie et de travail : bas salaires, longues journées de travail, licenciements abusifs, absence de retraite, de congés payés et de suffrage universel, travail des femmes et des enfants non réglementé. À cela s'ajoutaient la volonté de certains d'accéder au patronat et les idées véhiculées par les penseurs socialistes. C'est pourquoi, comme le dit le texte, « en 1864, ils organisent une longue grève » pour obtenir « la réduction de la journée de travail et l'augmentation des salaires ».<\/p>\n<p>Ces luttes ont abouti à plusieurs acquis. Le texte affirme que les syndicats ont fait voter des lois sociales : « diminution de la durée de travail, organisation des retraites, indemnisation pour les accidents du travail ». À ces acquis s'ajoutent le droit de grève, le suffrage universel, la réglementation du travail des femmes et des enfants, les congés payés, la scolarité obligatoire et la création de caisses de sécurité sociale.<\/p>\n<div class=\"lab\">Conclusion (intérêt du texte)<\/div>\n<p>Le texte de Marie-Thérèse Drouillon est digne d'intérêt parce qu'il nous a permis de mieux comprendre le mouvement des luttes ouvrières en Europe au XIXe siècle et les acquis des travailleurs.<\/p>\n<\/div><\/details>\n\n<div class=\"box key\"><div class=\"t\">Banque d'arguments (BEPC 2011 et 2019)<\/div>\n<p><b>Actions des ouvriers :<\/b> sabotages, boycotts, négociations, grèves, marches et manifestations de rue, désobéissance civique, création de caisses d'entraide et de solidarité.<\/p>\n<p><b>Conditions de vie précaires :<\/b> logements insalubres, humides, mal chauffés et mal éclairés ; repas frugal ; aucune assistance en cas de maladie, d'accident ou de chômage ; analphabétisme ; vices sociaux (délinquance, prostitution, alcoolisme) ; ouvrier condamné à boire et souvent victime de la tuberculose.<\/p>\n<p><b>Acquis :<\/b> droit au vote, à la grève, au travail ; journée de 8 à 10 heures ; augmentation des salaires ; 1er mai fête du travail ; repos hebdomadaire et congés payés ; assurance des logements et formes de crédit ; scolarité obligatoire jusqu'à 12 ans ; caisses de sécurité sociale ; ministère du Travail.<\/p><\/div>\n\n<!-- ============ SA2 ============ -->\n<h2 id=\"sa2\"><span class=\"badge g\">Géographie<\/span>SA2 — Ressources et développement du Bénin<\/h2>\n<div class=\"box up\"><div class=\"t\">Repères actualisés<\/div>\nPopulation : 10 008 749 habitants au recensement de 2013 (RGPH4) ; environ 15 millions estimés en 2026 ; le cinquième recensement (RGPH5) est en préparation. Agriculture : environ le quart du PIB selon les sources récentes. Coton : 637 000 tonnes en 2024-2025, premier producteur d'Afrique de l'Ouest. Soja : forte progression (652 000 tonnes attendues en 2024-2025). Pauvreté : taux encore supérieur à 30 %.<\/div>\n\n<h3>Sujet 1 · Dissertation<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Le développement du Bénin passe nécessairement par une bonne gestion des ressources humaines et techniques disponibles. Dans le but de permettre à ton entourage de comprendre cette déclaration, tu es invité(e) à produire un texte cohérent à partir des consignes suivantes.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les ressources humaines et techniques dont dispose le Bénin.<\/li><li>Expose trois menaces qui pèsent sur ces ressources en vue de montrer leur impact sur le niveau de développement du Bénin.<\/li><li>Propose trois pistes de solution en vue d'une meilleure gestion des ressources humaines et techniques.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Parmi les nombreuses potentialités dont dispose le Bénin, pays d'Afrique de l'Ouest, figurent les ressources humaines et techniques. La qualité de leur gestion détermine en grande partie le niveau de développement du pays, mais cette gestion pose de sérieux problèmes. Notre devoir consistera à présenter d'abord les ressources humaines et techniques du Bénin, ensuite à exposer trois menaces qui pèsent sur elles et leur impact sur le développement, enfin à proposer trois pistes de solution pour mieux les gérer.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Le Bénin dispose de nombreuses ressources humaines. Sa population, de 10 008 749 habitants au recensement de 2013 et estimée à environ 15 millions en 2026 selon les projections de l'ONU, est majoritairement jeune, ce qui garantit une main-d'œuvre disponible et dynamique. Le pays compte des cadres compétents dans diverses catégories d'activités et des populations spécialisées dans la pêche, l'élevage ou l'artisanat. Il appartient à la CEDEAO et à l'UEMOA, ce qui lui ouvre un vaste marché de consommation, et il est voisin du Nigeria, géant de plus de 200 millions d'habitants. Sur le plan technique, on note la culture attelée et le début de mécanisation de l'agriculture, l'usage d'engrais et d'intrants, des centres de formation et de recherche agricoles, la disponibilité de soins vétérinaires, le développement de la pisciculture et de l'apiculture, la modernisation des infrastructures artisanales, la professionnalisation des artisans et l'existence du Centre de Perfectionnement du Personnel des Entreprises (CPPE). <b>Malheureusement, ces ressources sont menacées, ce qui nous conduit à examiner ces menaces.<\/b><\/p>\n<p>Les ressources humaines sont d'abord menacées par la corruption, la gabegie et l'impunité, qui détournent les moyens de l'État. Elles le sont ensuite par l'analphabétisme, l'incivisme et l'inadéquation entre la formation et l'emploi, qui laissent des milliers de jeunes au chômage. Elles le sont enfin par la politisation de l'administration, le népotisme, le régionalisme et le laxisme, qui écartent les compétences. Les ressources techniques souffrent de la faible modernisation de l'agriculture, de l'élevage traditionnel et du faible recours aux soins vétérinaires, de la faible industrialisation et de la faible compétitivité de certains produits artisanaux. Il en résulte un faible niveau de développement : pauvreté (plus de 30 % de la population), chômage et sous-emploi, dépendance vis-à-vis de l'extérieur et exode rural. <b>Face à cette situation, des solutions s'imposent.<\/b><\/p>\n<p>Pour mieux gérer ces ressources, il faut d'abord engager une lutte efficace contre la corruption, le népotisme et le favoritisme, dépolitiser l'administration et vulgariser le code de bonne conduite dans les services publics. Il faut ensuite promouvoir l'éducation pour tous et l'alphabétisation, et élaborer des programmes de formation qui tiennent compte du marché de l'emploi. Il faut enfin moderniser l'agriculture et l'élevage, soutenir la recherche et valoriser toutes les ressources disponibles, tout en promouvant l'esprit de l'effort et du travail.<\/p>\n<div class=\"lab\">Conclusion<\/div>\n<p>En somme, le Bénin dispose de ressources humaines et techniques importantes, mais menacées par la mauvaise gouvernance et les insuffisances techniques. Leur gestion rationnelle, appuyée par l'intégration régionale, est la condition d'un développement durable.<\/p>\n<\/div><\/details>\n\n<h3>Sujet 2 · Explication de texte<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Candidat(e) au BEPC, tu as fait des recherches sur les ressources dont dispose la République du Bénin pour son développement.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>Sur la base des résultats de ces recherches et de tes savoirs construits, présente une explication du texte suivant en te servant des consignes qui l'accompagnent.<\/p>\n<p><span class=\"lbl\">Texte<\/span><\/p>\n<div class=\"texte\">Le Bénin dispose, bien qu'il ne soit pas un pays forestier comme certains pays de la sous-région ouest-africaine, d'un potentiel boisé assez important. À son actif, on dénombre 45 forêts occupant une superficie de 1 373 447 ha dont plus de 14 000 ha de plantations de teck productives. En dehors de ces forêts dont la plupart sont classées ou protégées, le Bénin a également dans son giron deux parcs nationaux. Partant, les ressources naturelles sont globalement suffisantes pour satisfaire les besoins immédiats en bois. Mais aujourd'hui, nos forêts sont dans un état de dégradation avancée mettant en péril la stabilité des écosystèmes et entraînant de fait le phénomène de la déforestation dans le pays.<\/div>\n<p class=\"src\">Source : La Gazette du Golfe, n° 1476 du 21 au 27 juillet 2014, p. 12.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente le texte en insistant sur la source et l'idée générale.<\/li><li>Explique l'impact du mode de gestion des plantations et des forêts sur le développement économique du Bénin.<\/li><li>Donne ton opinion sur la dégradation avancée des forêts en République du Bénin.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction (présentation du texte)<\/div>\n<p>Le texte soumis à notre réflexion est tiré de l'hebdomadaire béninois La Gazette du Golfe, numéro 1476 du 21 au 27 juillet 2014, à la page 12. Il aborde les ressources forestières (forêts et plantations) du Bénin et leur dégradation.<\/p>\n<div class=\"lab\">Corps du devoir<\/div>\n<p>Selon l'auteur, « le Bénin dispose (…) d'un potentiel boisé assez important ». Il s'agit de « 45 forêts occupant une superficie de 1 373 447 ha », parmi lesquelles des forêts galeries, des forêts claires et des savanes boisées, ainsi que de deux parcs nationaux, le W et la Pendjari. Il y a également des plantations de teck, d'afzélia, de caïlcédrat et d'anacardiers. Malheureusement, ces ressources sont mal gérées : « nos forêts sont dans un état de dégradation avancée ». Les feux de végétation tardifs, la coupe sélective des essences, la fabrication du charbon de bois, l'extension des activités agricoles et la monoculture du coton en sont les principales causes.<\/p>\n<p>Ce mode de gestion a un impact négatif sur le développement économique. La disparition de la faune menace le tourisme et la pharmacopée. La déforestation provoque des changements climatiques, l'érosion et la dégradation des sols, ce qui fait baisser les récoltes, endette les producteurs et accélère l'exode rural. Le recul de l'artisanat et de la pharmacopée réduit les revenus, et l'État perd des recettes. Ces modes de gestion compromettent ainsi le développement durable du pays.<\/p>\n<div class=\"lab\">Conclusion (opinion)<\/div>\n<p>À notre avis, la dégradation avancée des forêts est grave et résulte d'une mauvaise gestion. Nous pensons que des mesures hardies s'imposent : sensibiliser les populations, lutter contre les feux de végétation, appliquer la réglementation et reboiser.<\/p>\n<\/div><\/details>\n\n<div class=\"box key\"><div class=\"t\">Banque d'arguments (BEPC 2010 à 2020)<\/div>\n<p><b>Ressources ligneuses :<\/b> forêts galeries 273 000 ha ; forêts dégradées 120 000 ha ; forêts claires et savanes boisées 1 932 000 ha. Menaces : feux de végétation, coupe sélective, charbon de bois, extension des activités agricoles et pastorales, activités des pharmaco-thérapeutes. Solutions : sensibilisation, lutte contre les feux tardifs, plantations d'arbres.<\/p>\n<p><b>Élevage (BEPC 2010) :<\/b> bovins, caprins, ovins, porcins, volailles, lapins, escargots. Problèmes : épizooties, maladies parasitaires, insuffisance de points d'eau, de soins vétérinaires et de pâturage en saison sèche. Solutions : former des vétérinaires, campagnes régulières de vaccination, renforcer les capacités des Pharmavet.<\/p>\n<p><b>Cultures de rente et vivrières (BEPC 2016 et 2020) :<\/b> céréales, tubercules, légumineuses, oléagineux, fruits et cultures maraîchères ; coton, palmier à huile, anacarde, ananas, karité. Le coton reste la culture de rente la plus importante ; le riz prend de l'importance. Problèmes : priorité aux cultures d'exportation au détriment des vivrières, sous-équipement, mauvaise gestion et corruption.<\/p>\n<p><b>Lac Ahémé (BEPC 2012) — cause → solution :<\/b> comblement, envasement → dragage ; pollution → sensibilisation sur les déchets ; outils de pêche prohibés et non-réglementation → réglementation, sensibilisation puis sanctions ; forte pression démographique et surexploitation → diversification des activités, conversion des pêcheurs, fermes piscicoles. Il faut toujours relier la cause à sa solution.<\/p>\n<p><b>Jeunesse béninoise (BEPC 2011) :<\/b> chômage et sous-emploi (→ création d'emplois, formation adaptée, crédits), exode rural (→ infrastructures, crédits, formation des acteurs ruraux), déscolarisation (→ allègement des charges scolaires, application des textes, campagnes d'information), mariages précoces, consommation de stupéfiants.<\/p>\n<p><b>Plan d'action (BEPC 2012) :<\/b> à chaque fois, donner l'<i>action<\/i>, les <i>ressources humaines<\/i>, les <i>contraintes<\/i> et le <i>résultat attendu<\/i>. Exemple : action = formation des paysans à l'utilisation des machines agricoles ; ressources humaines = responsable du CeRPA, ONG du sous-secteur ; contraintes = insuffisance de moyens financiers, pesanteurs socioculturelles ; résultat = les paysans de la commune maîtrisent les machines.<\/p><\/div>\n\n<!-- ============ SA3 ============ -->\n<h2 id=\"sa3\"><span class=\"badge\">Histoire<\/span>SA3 — L'impérialisme européen en Afrique<\/h2>\n\n<h3>Sujet 1 · Dissertation<\/h3>\n<div class=\"sujet\">\n<p><span class=\"lbl\">Contexte d'évaluation<\/span><br>Le club d'Histoire-Géographie de ton collège organise une exposition sur la colonisation de l'Afrique aux XIXe et XXe siècles.<\/p>\n<p><span class=\"lbl\">Tâche<\/span><br>À partir de tes savoirs construits, présente une analyse cohérente de l'impérialisme européen en Afrique.<\/p>\n<p><span class=\"lbl\">Consigne<\/span><\/p>\n<ul><li>Présente les causes de l'impérialisme européen en Afrique aux XIXe et XXe siècles.<\/li><li>Décris les méthodes de pénétration utilisées par les puissances européennes.<\/li><li>Donne ton avis argumenté sur les conséquences de la colonisation pour l'Afrique.<\/li><\/ul>\n<\/div>\n<details><summary>Voir le corrigé rédigé<\/summary><div class=\"copie\">\n<div class=\"lab\">Introduction<\/div>\n<p>Après la traite négrière, l'Afrique est devenue, aux XIXe et XXe siècles, la cible des puissances européennes industrialisées. Cette politique d'expansion, appelée impérialisme, a bouleversé le desti
